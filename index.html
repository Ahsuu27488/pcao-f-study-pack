{"d":"D6","q":"A university proposes using AI to help grade student essays.","a":"What must be resolved before deployment?","o":["How long the essays are","How grades will be justified to students, who is accountable for them, and whether the AI assists or decides","Which model writes the most sophisticated prose","Whether the essays should be submitted digitally"],"c":1,"w":["A grade is a decision about a person's future that they are entitled to contest. Assistance that a marker can defend is a different proposition from a score a system produces, and the difference has to be settled in advance rather than in the appeals process.","Grade kisi ke mustaqbil ka faisla hai jise woh challenge kar sakta hai. Woh madad jo examiner defend kar sake ek baat hai, aur woh score jo system de de doosri — farq pehle tay hona chahiye.","گریڈ کسی کے مستقبل کا فیصلہ ہے۔ مدد اور فیصلہ الگ باتیں ہیں۔"]},
{"d":"D1","q":"A user asks the model to “improve” a document without naming which qualities matter.","a":"What will the model most likely do?","o":["Refuse until told","Ask a clarifying question every time","Return the document unchanged","Improve something — probably fluency or structure — because with no named dimension it optimises what is easiest to change"],"c":3,"w":["An open instruction still produces work; it just produces work aimed at whatever the model finds salient. The risk is not that nothing happens but that the wrong thing improves while the thing you cared about is untouched.","Khuli hidayat phir bhi kaam karti hai; bas woh us cheez ki taraf karti hai jo model ko aham lage. Khatra ye nahi ke kuch nahi hoga, balke ye hai ke ghalat cheez behtar hogi.","کھلی ہدایت پھر بھی کام کرتی ہے؛ بس غلط چیز بہتر ہوتی ہے۔"]},
{"d":"D4","q":"A team connects an AI agent to its support ticketing system. After replying, the agent closes the ticket.","a":"Where is the design problem?","o":["The ticket system is unsuitable for AI","Closing a ticket asserts that the issue is resolved, which is a judgement about a human outcome the agent cannot verify","The agent needs a larger context window","The agent should reply faster"],"c":1,"w":["Replying and resolving are different actions. A reply is a contribution to the thread; closing is a claim about the customer's situation, and it removes the case from the queue where someone would have looked at it.","Reply karna aur resolve karna alag kaam hain. Reply thread mein hissa daalna hai; close karna customer ki soorat-e-haal ke baare mein dawa hai, aur woh case queue se hata deta hai.","جواب دینا اور حل کرنا الگ کام ہیں۔"]},
{"d":"D2","q":"An AI system extracts dates from international contracts. A spot-check finds it converts 03/04/2026 to April 3rd, when the contract's originating country means 3 April is March 4th.","a":"Why is this especially dangerous?","o":["It only affects a few contracts","The date looks entirely plausible, so the mistake produces a valid-looking document with a wrong fact that nothing will flag","The error is obvious once seen","It is a formatting preference"],"c":1,"w":["A wrong date written in the expected format is indistinguishable from a right one. This is the category of error that automation makes harder to catch, because the format check passes and only domain knowledge would query the value.","Ghalat tareekh usi format mein likhi ho to sahi se pehchani nahi jati. Yahi woh galti hai jo automation mein pakadna mushkil hoti hai, kyunke format check pass ho jata hai.","غلط تاریخ اسی فارمیٹ میں لکھی ہو تو پہچانی نہیں جاتی۔"]},
{"d":"D5","q":"A team's agent answers from a knowledge source that was last synchronised eight months ago.","a":"What kind of risk does this create?","o":["Slower responses","Confident answers that were true eight months ago, presented without any indication of their age","Larger storage usage","Reduced model capability"],"c":1,"w":["Freshness is invisible in the output. Nothing in a grounded answer shows when the grounding was captured, so the reader has no way to judge whether it still holds — which is why sync schedules are part of the design.","Tazgi output mein dikhti nahi. Grounded jawab mein kahin nahi likha hota ke bunyaad kab li gayi thi, is liye padhne wala andaza nahi laga sakta ke woh ab bhi sach hai ya nahi.","تازگی آؤٹ پٹ میں نظر نہیں آتی۔"]},
{"d":"D6","q":"A startup proposes training a creditworthiness model on public social media data.","a":"What is the threshold objection?","o":["Social data is too unstructured","The model will be expensive to train","Using unrelated personal data to decide access to credit is a fairness problem that accuracy cannot cure","The dataset will be too small"],"c":2,"w":["The objection is not to the method but to the input. Where the data has no causal connection to the outcome it predicts, a statistically valid model still makes an unjust decision — and that is a governance question before it is a technical one.","Aitraz tareeqe pe nahi, input pe hai. Jahan data ka nateeje se koi asli talluq na ho, wahan statistically durust model bhi na-insaaf faisla karta hai.","اعتراض طریقے پر نہیں، ان پٹ پر ہے۔"]},
{"d":"D3","q":"A team needs to summarise roughly 500 customer reviews every week at the lowest reasonable cost.","a":"Which choice fits?","o":["A fast, inexpensive model with a well-structured prompt, since the task is repetitive and low-consequence","The most capable reasoning model, run on all 500","Manual summarisation by an analyst","A model chosen by benchmark ranking alone"],"c":0,"w":["Model selection is a cost decision as much as a capability one. Where the task is uniform, the volume is high and the stakes are low, paying for reasoning capacity that the task never exercises is the wrong trade twice over.","Model ka chunav taqat ke saath kharch ka bhi faisla hai. Jahan kaam ek jaisa, volume zyada aur khatra kam ho, wahan reasoning ki qeemat dena do taraf se ghalat tijarat hai.","ماڈل کا انتخاب صلاحیت کے ساتھ خرچ کا بھی فیصلہ ہے۔"]},
{"d":"D4","q":"A workflow depends entirely on one person who approves every item, and they are on leave for two weeks.","a":"What does this reveal?","o":["The workflow has a single point of failure that the automation inherited from the manual process without addressing","The items should be fewer","Approvals should be removed altogether","The model is unreliable"],"c":0,"w":["Automating the steps around a bottleneck leaves the bottleneck exactly where it was and hides it behind a faster pipeline. Mapping the process first is what would have surfaced this before launch.","Bottleneck ke aas paas automate karna bottleneck ko wahi chhorta hai aur tez pipeline ke peeche chhipa deta hai. Process ka naqsha pehle banane se ye launch se pehle nazar aa jata.","بوٹل نیک کے آس پاس خودکاری اسے وہیں چھوڑتی ہے۔"]},
{"d":"D1","q":"A user asks for exactly ten bullet points on a topic that genuinely requires qualification and context.","a":"What is the likely result?","o":["Ten points will be produced, which forces compression of nuance into a count the subject does not fit","The model will produce fewer points","Ten accurate and complete points","The model will refuse"],"c":0,"w":["A count is a constraint on form, and the model will satisfy it. Where the subject does not divide evenly, the constraint quietly discards the qualifications — so the format chosen in the prompt ends up shaping the truth of the answer.","Ginti shakal ki shart hai, aur model usay poori karega. Jahan mauzu barabar taqseem nahi hota, shart chupke se zaroori tafseel hata deti hai — is liye prompt ka format jawab ka sach banata hai.","تعداد شکل کی شرط ہے، اور ماڈل اسے پوری کرے گا۔"]},
{"d":"D7","q":"An agent's outputs are correct, but the workflow occasionally hangs and never returns.","a":"What is the design gap?","o":["There is no timeout or failure condition, so a request that stops responding has no path out","The model is producing invalid output","The output format is wrong","The prompt is too long"],"c":0,"w":["Correctness of output does not cover the case where there is no output. Any call that can fail has to be bounded by a timeout with a defined consequence, or a single stalled request blocks everything behind it.","Output durust hona us soorat ko cover nahi karta jab output hi na aaye. Har call ke liye timeout chahiye aur uska nateeja tay hona chahiye.","آؤٹ پٹ درست ہونا اُس صورت کو نہیں سنبھالتا جب آؤٹ پٹ ہی نہ آئے۔"]},
{"d":"D2","q":"An AI report states that a trend is “growing steadily”, based on three data points that all fall within normal variation.","a":"What is wrong with the claim?","o":["The report should have used a chart","It asserts a pattern from too little evidence — three points cannot distinguish a trend from noise","The trend is real but understated","The data should have been averaged"],"c":1,"w":["The sentence is grammatically and tonally fine, and the numbers behind it are accurate. What is invented is the interpretation, which the reader has no way to separate from the data beneath it.","Jumla durust hai aur numbers bhi theek hain. Jo banaya gaya hai woh interpretation hai, aur padhne wala usay neeche ke data se alag nahi kar sakta.","جملہ درست ہے اور اعداد بھی۔ جو بنایا گیا وہ تشریح ہے۔"]},
{"d":"D5","q":"A team cannot say which of its 400 knowledge documents the agent actually draws on.","a":"Why is this a problem?","o":["Without visibility into what is retrieved, a wrong source cannot be traced, removed or corrected","It uses more storage","It makes the agent slower","It reduces answer length"],"c":0,"w":["A system whose inputs cannot be inspected cannot be debugged or governed. When an answer is wrong, the investigation has nowhere to begin, so the same error recurs without ever being located.","Jis system ke inputs dekhne mein na aayein usay debug ya govern nahi kiya ja sakta. Jawab ghalat ho to jaiza shuru karne ki jagah hi nahi hoti, to wohi galti dohrati rehti hai.","جس نظام کے ان پٹ دیکھنے میں نہ آئیں اسے جانچا نہیں جا سکتا۔"]},
{"d":"D3","q":"A team must choose between a general conversational assistant and an agentic coding tool for a task that involves editing multiple files in a repository.","a":"Which fits?","o":["Either, since both use the same models underneath","Neither; the task should be done manually","The agentic tool, because the task requires reading and changing a codebase rather than producing text","The conversational assistant, since it is more flexible"],"c":2,"w":["The distinction here is not which model is better but what the tool can reach. A conversational assistant cannot read files it has not been given, and the task is defined by its need to work across the repository.","Farq ye nahi ke kaunsa model behtar hai, ye hai ke tool kahan pohnch sakta hai. Baat-cheet wala assistant un files ko nahi padh sakta jo di na gayi hon.","فرق یہ نہیں کہ کون سا ماڈل بہتر ہے، یہ ہے کہ اوزار کہاں پہنچ سکتا ہے۔"]},
{"d":"D6","q":"An AI system prioritises which maintenance requests are handled first in public housing.","a":"What makes this a governance matter and not just a technical one?","o":["The output decides who receives a service they are entitled to, and the people affected cannot see or contest the ranking","The system may run slowly","The requests may be poorly written","The model may be expensive to run"],"c":0,"w":["Allocation of a public entitlement by an opaque ranking puts the burden of the system's errors on the people least able to challenge it. The technical work is easy here; the legitimacy is the hard part.","Ek ghair-wazeh ranking se awaami haq ki taqseem system ki ghaltiyon ka bojh un logon pe daalti hai jo challenge karne se sabse kamzor hain.","غیر واضح درجہ بندی سے عوامی حق کی تقسیم بوجھ کمزوروں پر ڈالتی ہے۔"]},
{"d":"D2","q":"An AI summary of a 60-page policy states the general rule clearly but omits the mandatory exception that applies to a third of the cases.","a":"What is the result?","o":["A summary that will be applied as though the exception does not exist, because the reader has no reason to look for it","A summary that needs a larger context window","A shortened but faithful summary","A stylistic difference"],"c":0,"w":["Compression is only safe when it preserves what governs the decision. Here the omitted material is the part that changes the action, so the summary is not shorter — it is a different rule.","Compression sirf tab mehfooz hai jab woh bacha le woh cheez jo faisla karti hai. Yahan chhora gaya hissa hi woh hai jo amal badalta hai, to summary chhoti nahi, doosra rule hai.","دباؤ صرف اُس وقت محفوظ ہے جب فیصلہ کرنے والی چیز بچی رہے۔"]},
{"d":"D1","q":"A user asks the same question in five separate conversations because the first four answers differed.","a":"What would have solved this at the source?","o":["Using a model with more parameters","Setting the temperature to zero and nothing else","Supplying enough context and criteria that the answer is determined by the input rather than by sampling variation","Asking a sixth time"],"c":2,"w":["Variance is a symptom of an under-specified request. When the criteria are explicit the space of acceptable answers narrows, and the model stops filling the gap with variety the user did not want.","Farq kam-zer-declared request ki alamat hai. Jab mayaar wazeh hon, qabool jawabon ki jagah tang ho jati hai aur model woh variety bharna band kar deta hai jo user nahi chahta tha.","فرق کم بیان کی گئی درخواست کی علامت ہے۔"]},
{"d":"D4","q":"A workflow is automated and runs nightly, but nothing reports whether it succeeded.","a":"Why is this a design failure?","o":["It uses unnecessary resources","It slows the following day's work","A silent workflow cannot distinguish success from failure, so a broken run looks identical to a quiet night","It increases storage costs"],"c":2,"w":["Silence is the worst possible signal because it is ambiguous. The workflow needs an explicit success condition and an alert on absence, or the first sign of trouble becomes a downstream user noticing something missing.","Khamoshi sabse buri nishani hai kyunke woh dhundhli hai. Workflow ko saaf kamyabi ki shart aur na honay pe ittila chahiye, warna pehla ishara neeche wala user banega jo kami mehsoos karega.","خاموشی سب سے بری نشانی ہے کیونکہ وہ دھندلی ہے۔"]},
{"d":"D7","q":"An agent that performed well in testing fails in production, where the real data differs from the samples.","a":"What is the correct diagnosis?","o":["The model needs retraining on the test set","The production environment is slower","The model is unstable","The workflow was only ever exercised against the test data's range, so production inputs lie outside what it was built for"],"c":3,"w":["The system is behaving exactly as designed; the design was validated against a narrower world than the one it now meets. This is an input-boundary failure, and the fix is broader validation, not a component swap.","System bilkul design ke mutabiq chal raha hai; design us se tang duniya pe test hua tha jis mein woh ab hai. Ye input ki hadd ki galti hai, aur fix wider validation hai, component badalna nahi.","نظام بالکل ڈیزائن کے مطابق چل رہا ہے؛ ڈیزائن تنگ دنیا پر آزمایا گیا تھا۔"]},
{"d":"D2","q":"An AI-drafted email is fluent and complete, and never mentions that the attachment the user referred to was missing and could not be attached.","a":"What is the nature of this failure?","o":["A limitation of email clients","A silent failure of the workflow that the polished prose conceals, so the recipient is misled by confidence rather than content","A formatting omission","An error the recipient will easily notice"],"c":1,"w":["The draft reads as though everything went as planned. This is what makes unexplained failures dangerous inside fluent output: the writing style carries an assurance the process never earned.","Draft aisa padha jata hai jaise sab kuch plan ke mutabiq hua. Yehi fluent output mein chhipi galti ko khatarnak banata hai — likhai ka lehja woh aitmaad deta hai jo process ne kamaya hi nahi.","مسودہ ایسا پڑھا جاتا ہے جیسے سب ٹھیک ہوا۔"]},
{"d":"D5","q":"A team's knowledge source mixes customer-specific exceptions with general company policy, with no separation.","a":"What is the likely effect?","o":["Shorter answers","Larger storage needs","One customer's exception can be surfaced as though it were general policy, because nothing distinguishes their scope","Slower retrieval"],"c":2,"w":["Scope is part of meaning. A rule that is correct for one account is wrong for all the others, and once both sit in the same undifferentiated store, retrieval has no basis for choosing between them.","Daira matlab ka hissa hai. Jo rule ek account ke liye sahi hai woh baqi sab ke liye ghalat hai, aur ek hi jagah rakhe jaane par retrieval ke paas farq karne ki bunyaad nahi rehti.","دائرہ معنی کا حصہ ہے۔ ایک اکاؤنٹ کا قاعدہ باقی سب کے لیے غلط ہے۔"]},
{"d":"D3","q":"A team has a task with high reasoning demands and almost no tolerance for error — a regulated calculation performed monthly.","a":"Which model choice is appropriate?","o":["Any model, since a human will check it anyway","A model chosen for its low cost","The fastest model, since the volume is low","A high-capability reasoning model, with a human check on the output before it is used"],"c":3,"w":["Where errors are intolerable and the volume is low, the cost of capability is trivial against the cost of being wrong. The human check does not licence a weaker model — it is a second line, not the first.","Jahan galti na-qabool ho aur volume kam ho, wahan taqat ki qeemat ghalat hone ki qeemat ke saamne kuch nahi. Human check kamzor model ki ijazat nahi deta — woh doosri line hai, pehli nahi.","جہاں غلطی ناقابلِ قبول ہو اور حجم کم ہو، وہاں صلاحیت کی قیمت کچھ نہیں۔"]},
{"d":"D4","q":"A team plans to automate a process that runs once a year.","a":"What should be weighed?","o":["Whether it is technically possible","Whether the cost of building and maintaining the automation is repaid by a task performed twelve times a decade","Whether the process could run more often","Which model is most capable"],"c":1,"w":["Automation carries a maintenance cost independent of how often it runs, and an annual workflow will be exercised against stale assumptions about its inputs. Feasibility is not the same question as sense.","Automation ka maintenance kharch us se alag hai ke woh kitni baar chalti hai, aur saalana workflow purane assumptions pe chalta hai. Mumkin hona aur samajh-dari hona alag sawal hain.","خودکاری کا دیکھ بھال خرچ الگ ہے۔"]},
{"d":"D6","q":"An organisation stores patient health records in one system and wants to connect the same agent to its newsletter tooling.","a":"What is the concern?","o":["The newsletter tool may be slow","The agent will confuse the two tasks","The newsletter will be longer","Connecting the agent to both creates a path by which health data could reach a system with no need for it, and no protection for it"],"c":3,"w":["Each connection is also a possible route. Scope creep in agent access is how data ends up somewhere it was never assessed to go, and the risk is created at connection time rather than at the moment of a leak.","Har connection ek mumkin raasta bhi hai. Agent ki access barhna isi tarah data ko wahan pohncha deta hai jahan usay jaane ka jaiza hi nahi hua.","ہر کنکشن ایک ممکن راستہ بھی ہے۔"]},
{"d":"D1","q":"A user instructs the model to “be creative” for a task that must follow a regulatory format exactly.","a":"Why will this instruction cause harm?","o":["It names a goal that directly conflicts with the actual requirement, and the model has no basis for knowing the format wins","The model dislikes constraints","The task is impossible","Creativity is not a supported instruction"],"c":0,"w":["Instructions compete, and the model will resolve the competition using whatever it reads as primary. Where compliance is the real requirement, saying “be creative” establishes the opposite priority and invites variation in the one place it is forbidden.","Hidayat aapas mein muqabla karti hain, aur model wohi jeetata hai jo usay bara lage. Jahan compliance asli shart ho, wahan “creative raho” kehna ulti tarjeeh qaim karta hai.","ہدایات باہم مقابلہ کرتی ہیں، اور ماڈل وہی جیتاتا ہے جو بڑا لگے۔"]},
{"d":"D7","q":"A workflow produces the right output but takes forty minutes where two were expected.","a":"What should be established first?","o":["Whether a faster model exists","Whether the output can be cached","Where the time is actually spent across the stages, so the bottleneck is identified rather than guessed at","Whether the team's expectation was reasonable"],"c":2,"w":["Forty minutes against two suggests something structural rather than a slow component. Measuring per stage separates a genuinely heavy step from an avoidable number of calls, and those have opposite fixes.","Do minute ke saamne chalees minute kisi dhaanche ki taraf ishara karta hai, dheeme hisse ki nahi. Har stage naapna asli bhari step ko be-wajah calls se alag karta hai, aur donon ka ilaaj ulat hai.","چالیس منٹ کسی ڈھانچے کی طرف اشارہ کرتا ہے، سست حصے کی نہیں۔"]},
{"d":"D2","q":"An AI summary records that a customer “agreed to the terms”, when the customer actually asked for a copy to review.","a":"What has the summary done?","o":["Reflected the customer's probable intention","Described the exchange accurately enough","Simplified an unnecessarily long exchange","Converted a request for information into an agreement, which is a legal event that never occurred"],"c":3,"w":["Asking to review is the behaviour of someone who has not yet agreed. Recording it as agreement creates a record of a commitment nobody made, and that record may later decide a dispute.","Review ke liye maangna us shakhs ka amal hai jisne abhi haan nahi kahi. Usay agreement likhna aise wade ka record banata hai jo kisi ne kiya hi nahi tha.","جائزے کے لیے مانگنا اُس شخص کا عمل ہے جس نے ابھی ہاں نہیں کہی۔"]},
{"d":"D5","q":"A company's knowledge base contains fifteen overlapping documents describing the same process, all still marked current.","a":"What is the practical consequence?","o":["Faster answers, since more material is available","Fifteen times the storage cost","Shorter responses","Retrieval may cite any of them, so the agent's answers vary by document rather than by question and no single source can be corrected"],"c":3,"w":["Overlapping sources multiply by conflict rather than by coverage. When two documents disagree, the agent has no rule for choosing, so fixing the system requires first deciding which document is the policy.","Overlap karne wale sources coverage se nahi, takrao se barhte hain. Jab do documents ikhtilaf karein, agent ke paas chunne ka rule nahi hota, to system theek karne ke liye pehle tay karna parta hai kaunsa document policy hai.","ٹکرانے والے ماخذ احاطے سے نہیں، ٹکراؤ سے بڑھتے ہیں۔"]},
{"d":"D3","q":"A team needs a model whose output will be parsed by downstream software with strict formatting requirements.","a":"What matters most in selection?","o":["The model's creative writing quality","The size of its context window","Whether it can reliably produce structured output in the required schema","The model's total parameter count"],"c":2,"w":["Here the constraint is not intelligence but compliance with a schema, and it should be tested directly. A more capable model that formats unreliably will cost more in downstream failures than it gains in better prose.","Yahan shart samajh nahi, schema ki pabandi hai, aur ise seedha test karna chahiye. Zyada qabil model jo format pe bharosa na de woh behtar likhai se zyada nuqsan downstream mein dega.","یہاں شرط سمجھ نہیں، اسکیما کی پابندی ہے۔"]},
{"d":"D6","q":"A team designs an agent that recommends actions and also holds the permission to carry them out.","a":"What is the governance problem?","o":["It will require more storage","The agent needs a larger context window","Recommendation and execution belong to different parties, so an error in judgement is never caught before it becomes an action","The agent will be slower"],"c":2,"w":["Separating the two creates the moment where a human sees the judgement before it is applied. Where one component does both, the check that review provides is designed out of the system entirely.","Dono ko alag rakhne se woh lamha banta hai jab human faisla amal mein aane se pehle dekh le. Jahan ek hi hissa dono kare, wahan review ka check design se hi nikal jata hai.","دونوں کو الگ رکھنے سے وہ لمحہ بنتا ہے جب انسان فیصلہ دیکھ لے۔"]},
{"d":"D2","q":"A team finds that an AI tool's stated confidence has no relationship to whether its answers are correct.","a":"What should the team do?","o":["Ask the model to justify its confidence","Trust the high-confidence answers only","Stop using confidence as a signal and instead build verification that does not depend on the model's self-assessment","Increase the confidence threshold"],"c":2,"w":["Confidence is generated by the same process that generated the answer, so it can be fluent in exactly the same way. A check that reads the model's own assurance is not a check at all.","Confidence usi process se banta hai jis se jawab bana, is liye woh bhi utna hi safed-jhoot ho sakta hai. Model ka apna aitmaad padhne wala check asal mein check hi nahi hai.","اعتماد اُسی عمل سے بنتا ہے جس سے جواب بنا۔"]},
{"d":"D4","q":"A team introduces AI into a process without ever defining what a successful outcome looks like.","a":"What will happen?","o":["The AI will ask for a definition","There will be no basis for judging the system, so neither improvement nor failure can be established","The AI will perform poorly","The process will run more slowly"],"c":1,"w":["A system without a success criterion cannot be evaluated, only argued about. The first deliverable of an AI project is the definition of what counts as working, before anything is built.","Bina kamyabi ke mayaar ke system ko naapa nahi ja sakta, sirf behas ho sakti hai. AI project ka pehla deliverable ye tay karna hai ke chalna kya kehlata hai.","بغیر کامیابی کے معیار کے نظام ناپا نہیں جا سکتا۔"]},
{"d":"D1","q":"A user asks for an “honest assessment” of their plan, and receives three paragraphs of encouragement.","a":"What is the most likely cause?","o":["The instruction was social rather than specific; a request for candour needs the criteria and the licence to be explicit","The plan is genuinely flawless","The model cannot critique plans","The model needs a larger context window"],"c":0,"w":["Requests for honesty describe a manner, not a task. Saying what to examine and inviting the negative finding directly is what produces criticism, because the model's default is to be agreeable rather than to search for problems.","Sachai ki darkhwast tareeqe ko batati hai, kaam ko nahi. Ye batana ke kya dekho aur bura pehlu bhi dhoondo hi tanqeed paida karta hai, kyunke model ka default khush-kalam hona hai.","سچائی کی درخواست طریقہ بتاتی ہے، کام نہیں۔"]},
{"d":"D7","q":"An agent is slow specifically on the first request of each day, and fast afterwards.","a":"What does this pattern indicate?","o":["The model is warming up its reasoning","Some part of the workflow is being initialised or re-fetched on the first run and reused thereafter","The users ask harder questions in the morning","The network is congested in the mornings"],"c":1,"w":["A cost paid once per day and never again is a start-up cost, not a performance problem. Recognising that shape points at caching or initialisation rather than at the model itself.","Ek baar roz ka kharcha start-up ka kharcha hai, performance ka masla nahi. Is shakal ko pehchanna model ki taraf ishara nahi, caching ki taraf karta hai.","ایک بار روز کا خرچ آغاز کا خرچ ہے۔"]},
{"d":"D5","q":"A team's library of shared prompts has no named owner for any of them.","a":"What is the likely outcome?","o":["The prompts will run faster","The prompts will be shorter","The library will shrink","Nobody is responsible for correctness or updates, so errors persist and improvements are never merged back"],"c":3,"w":["Shared resources degrade without ownership because any individual's fix is nobody's obligation. The single change that turns a prompt archive into a maintained asset is assigning who answers for each one.","Shared cheezein bina malik ke kharab hoti hain, kyunke kisi ka sudhaar kisi ki zimmedari nahi hota. Prompt archive ko maintain hone wala asset banane ke liye bas ye tay karna hai ke har ek ka jawabdeh kaun hai.","مشترکہ چیزیں بغیر مالک کے خراب ہوتی ہیں۔"]},
{"d":"D2","q":"An AI-generated summary of a technical specification omits all units of measurement.","a":"Why does this matter more than a missing sentence?","o":["It does not; the numbers are correct","The units would have been obvious to the reader","It makes the summary shorter","A quantity without a unit is not a fact — the same figure could mean millimetres or metres, so the summary cannot be acted on"],"c":3,"w":["Units are what make a number mean anything. Their absence does not leave a gap in the text; it leaves the text looking complete while being unusable, which is the more dangerous of the two.","Units hi number ko matlab dete hain. Unka na hona text mein khala nahi chhorta; woh text ko mukammal dikhata hai magar bekaar banata hai — donon mein se ye zyada khatarnak hai.","اکائیاں ہی عدد کو معنی دیتی ہیں۔"]},
{"d":"D6","q":"A company plans to deploy an AI system in a context where nobody will be able to observe its decisions.","a":"What is the governance implication?","o":["The model should be larger","Deployment should proceed if the model is accurate enough","The system should log to a file no one reads","Unobservable decisions cannot be audited, reviewed or corrected, so the deployment should not proceed until observability exists"],"c":3,"w":["Observability is a precondition, not a nice-to-have. A system whose behaviour cannot be inspected has no way to discover that it is wrong, and a log nobody reads does not create observability.","Dekhne mein aana shart hai, koi achi baat nahi. Jis system ka amal inspect na ho sake usay pata hi nahi chalega ke woh ghalat hai, aur jo log koi na padhe woh observability paida nahi karta.","مشاہدہ شرط ہے، کوئی اچھی بات نہیں۔"]},
{"d":"D3","q":"A team needs to process audio recordings in three languages, producing transcripts and summaries.","a":"What capability is required first?","o":["A faster model","A creative writing model","Transcription that reliably handles all three languages, before summarisation can be trusted at all","A very large context window"],"c":2,"w":["The pipeline has stages, and the first one bounds everything after it. If transcription is unreliable in one language, the summary inherits the error while appearing entirely normal in the other two.","Pipeline ke stages hain, aur pehla stage baqi sab ko bandhta hai. Agar ek zubaan mein transcription pe bharosa na ho, to summary woh galti virasat mein le leti hai magar baqi do mein bilkul theek lagti hai.","پائپ لائن کے مراحل ہیں، پہلا مرحلہ باقی سب کو باندھتا ہے۔"]},
{"d":"D7","q":"An agent's error rate has risen gradually over several months, with no single change to point to.","a":"What is the most likely explanation?","o":["The storage is filling up","Slow drift in the environment — new input patterns, a changing knowledge source, or evolving user behaviour — rather than a single fault","The users have become less careful","The model has degraded on the provider's side"],"c":1,"w":["Gradual change with no discrete cause is the signature of drift, and drift is found by comparing the system's inputs and sources now against what they were. It cannot be diagnosed from the output alone.","Rafta rafta tabdeeli jiski koi ek wajah na ho drift ki nishani hai, aur drift tab milti hai jab mojooda inputs aur sources ka purane se muqabla kiya jaye. Sirf output se pata nahi chalta.","رفتہ رفتہ تبدیلی ڈرفٹ کی نشانی ہے۔"]},
{"d":"D4","q":"A team automates a pipeline where the first stage needs speed and the last stage needs careful reasoning.","a":"What is the right design?","o":["Run both models on every stage and compare","Use one capable model for every stage to keep it simple","Use the fastest model throughout","Match the model to each stage, so the cheap stage stays cheap and the reasoning stage gets the capability it needs"],"c":3,"w":["Stage requirements differ, so a single choice is wrong somewhere by construction. Matching per stage is how a pipeline keeps both its cost and its quality, and it is a design decision rather than a purchasing one.","Har stage ki shart alag hai, is liye ek hi chunav kisi na kisi jagah ghalat hoga. Har stage pe match karna hi pipeline ko kharch aur quality dono bachata hai.","ہر مرحلے کی شرط الگ ہے۔"]},
{"d":"D1","q":"A user writes a prompt in a language the model handles less well than English, for a task requiring precise technical terminology.","a":"What is the practical answer?","o":["Split the task into several prompts","Write the instruction and technical terms in the language the model handles best, and ask for the output in the language needed","Use a larger model only","Accept the reduced quality as unavoidable"],"c":1,"w":["Input language and output language are independent choices. Taking the best of both — precise instructions in the stronger language, a result in the language the audience needs — costs nothing and removes an avoidable source of error.","Input aur output ki zubaan alag faisle hain. Donon se behtareen lena — hidayat mazboot zubaan mein, nateeja zaroori zubaan mein — kuch kharch nahi karta aur ek be-wajah galti hata deta hai.","ان پٹ اور آؤٹ پٹ کی زبان الگ فیصلے ہیں۔"]},
{"d":"D5","q":"A team's knowledge base includes a document that only certain staff are permitted to read.","a":"What must the configuration do?","o":["Nothing, if the document is accurate","Respect the same access restrictions in the agent's retrieval, so the agent cannot surface it to someone who is not entitled to see it","Ask users to avoid asking about it","Remove the document entirely"],"c":1,"w":["Authorization does not disappear because the reader became a machine. An agent that retrieves without checking entitlement reproduces the document to whoever asks, and quietly defeats the control that existed on the file.","Ijazat is liye khatam nahi hoti ke padhne wala machine ban gaya. Jo agent entitlement check kiye baghair retrieve kare woh document har poochne wale ko de deta hai, aur file pe maujood control chupke khatam kar deta hai.","اجازت اس لیے ختم نہیں ہوتی کہ پڑھنے والا مشین بن گیا۔"]},
{"d":"D2","q":"An AI-generated summary is accurate, but gives the reader no indication of what was left out.","a":"Why does this matter?","o":["The reader can check the original","It makes the summary shorter","A summary silent about its own omissions invites the reader to treat it as complete, which is a claim it never made","The summary is fine if it is accurate"],"c":2,"w":["The danger of compression is not the material removed but the confidence of the reader in what remains. Naming what was excluded is what keeps a summary honest about being one.","Compression ka khatra hataayi hui cheez nahi, bachi hui cheez pe padhne wale ka bharosa hai. Ye batana ke kya chhoda gaya, hi summary ko imandar rakhta hai.","دباؤ کا خطرہ ہٹائی گئی چیز نہیں، باقی پر بھروسہ ہے۔"]},
{"d":"D6","q":"A company wants AI to answer customer complaints about billing errors, with access to account records.","a":"Which condition is essential?","o":["Only that answers are polite","Only that the model is fast","Only that the answers are short","That answers to customers carry an accurate account of their own data and that the customer can reach a human when the answer is wrong"],"c":3,"w":["Two things fail together here: an incorrect answer about someone's own money, and a channel that cannot escalate. Either alone is survivable; the combination leaves the customer with no accurate information and no recourse.","Yahan do cheezein saath fail hoti hain: kisi ke apne paison ke baare mein ghalat jawab, aur aisa raasta jahan escalation na ho. Donon alag alag bardasht ho jate hain; mil kar customer ko be-bas chhor dete hain.","یہاں دو چیزیں ساتھ ناکام ہوتی ہیں۔"]},
{"d":"D3","q":"A team selects a model based only on its top score on a public benchmark.","a":"What is the flaw in this method?","o":["The score will be out of date within a week","The model will be too expensive","Benchmarks are always inaccurate","The benchmark may not resemble the team's actual task, so the score measures something other than what they need"],"c":3,"w":["A benchmark is evidence about the tasks it contains. Choosing on that basis without checking resemblance is choosing on reputation, and the cheap test — trying the model on a handful of your own cases — is the one that decides.","Benchmark un kaamon ke baare mein saboot hai jo us mein hain. Mushabihat check kiye baghair us pe chunna naam pe chunna hai, aur asli faisla sasta test karta hai — apne kuch case us pe chala kar dekhna.","بینچ مارک اُن کاموں کا ثبوت ہے جو اس میں ہیں۔"]},
{"d":"D4","q":"A team's workflow passes its output directly into a second workflow with no validation between them.","a":"What risk does this create?","o":["Higher storage use","Slower processing","An error in the first stage becomes an input to the second, where it may be amplified rather than caught","Longer response times"],"c":2,"w":["Chaining without a check removes the only point where a bad result could have been stopped. Each subsequent stage builds on the error, and the eventual output is wrong in a way that no longer points back to its cause.","Bina check ke chain karna woh wahid jagah hata deta hai jahan ghalat nateeja roka ja sakta tha. Har agla stage us galti pe banta hai, aur aakhir mein output aise ghalat hota hai ke uski wajah pata nahi chalti.","بغیر جانچ کے جوڑنا واحد موقع ہٹا دیتا ہے۔"]},
{"d":"D2","q":"An AI gives a correct answer to the question that was typed, but not to the question that was meant.","a":"What is the failure here?","o":["The delegation was ambiguous, so the answer is right by the letter and useless in practice","The output format was wrong","The model is not capable enough","The model misunderstood the task"],"c":0,"w":["The model has no access to intent beyond what was written. This is the Define failure in its purest form — the gap between the typed question and the intended one is the part of the task the user never delegated.","Model ke paas likhi hui baat ke ilawa niyat tak koi rasai nahi. Ye Define ki galti ka saaf roop hai — jo sawal likha gaya aur jo maqsad tha, unka farq woh hissa hai jo user ne delegate hi nahi kiya.","ماڈل کے پاس لکھی بات کے علاوہ نیت تک رسائی نہیں۔"]},
{"d":"D5","q":"A team wants the agent to treat internal working notes and published material differently.","a":"How should this be handled?","o":["As an explicit configuration that distinguishes what may be quoted externally from what may only inform an internal answer","By using a different model for each","By asking users to be careful","By removing the internal notes"],"c":0,"w":["A distinction that lives only in people's habits will eventually be crossed by someone who does not know it exists. Making it configuration means the rule holds regardless of who is asking and how the question is phrased.","Jo farq sirf logon ki aadat mein ho woh ek din us shakhs se tajawuz ho jayega jise uske wajood ka pata hi nahi. Configuration mein rakhne se rule har poochne wale pe lagta hai.","جو فرق صرف عادت میں ہو وہ ایک دن تجاوز ہو جائے گا۔"]},
{"d":"D6","q":"An agent is authorised to negotiate contract terms with a supplier on the company's behalf.","a":"What has to accompany this authority?","o":["A polite tone","A larger context window","A faster response time","Hard limits on what may be conceded, a record of everything offered, and a human who approves the final terms"],"c":3,"w":["Negotiation is a sequence of commitments, and each one narrows what remains possible. Without stated limits and a record, a series of individually reasonable concessions can produce an agreement nobody authorised.","Negotiation wadon ka silsila hai, aur har wada aage ki gunjaish tang karta hai. Bina haddon aur record ke, alag alag maqool riayatein mil kar aisa agreement bana sakti hain jiski kisi ne ijazat nahi di thi.","مذاکرات وعدوں کا سلسلہ ہے۔"]},
{"d":"D1","q":"A user supplies two examples in one prompt that demonstrate contradictory formats.","a":"What will the model most likely produce?","o":["It will average the two formats","It will pick one, and which one it picks is effectively random — so nothing about the output can be relied on","It will produce both","It will ask which format to use"],"c":1,"w":["Examples are read as the standard. Two conflicting standards leave the model to resolve a decision the user never made, and an output that cannot be predicted cannot be trusted to match the template.","Examples mayaar samjhe jate hain. Do takrate hue mayaar model ko aisa faisla karne dete hain jo user ne kabhi kiya hi nahi, aur jo output pehle se tay na ho us pe bharosa nahi kiya ja sakta.","مثالیں معیار سمجھی جاتی ہیں۔"]},
{"d":"D4","q":"A team automates a process that carries a legal requirement to retain records of each step.","a":"What must the design preserve?","o":["A durable record of inputs, decisions and outputs, since the automation must be as auditable as the manual process was","Only the final output","Nothing beyond the result","Only the model name used"],"c":0,"w":["Automation does not remove an obligation; it moves where the obligation is discharged. If the manual process left a paper trail and the automated one leaves none, the compliance position is worse even though the work is faster.","Automation zimmedari khatam nahi karti; woh jagah badalti hai jahan zimmedari poori hoti hai. Agar manual process kaghaz ka record chhorta tha aur automated kuch nahi, to compliance pehle se kharab ho gayi.","خودکاری ذمہ داری ختم نہیں کرتی۔"]},
{"d":"D2","q":"An AI summary of a safety report strips out every caveat, leaving only the conclusions.","a":"Why is the result unsafe?","o":["It is too short","The conclusions are incorrect","The caveats are the conditions under which the conclusions hold, so removing them turns a conditional finding into an unconditional one","The report should not have been summarised"],"c":2,"w":["In safety material the qualifications are the content. A finding stated without its limits reads as broader and more certain than it is, and that reading is exactly what a decision-maker will act on.","Safety material mein shartein hi asli content hoti hain. Bina haddon ke likha nateeja apni asal se zyada aam aur zyada yaqeeni padha jata hai, aur faisla karne wala usi pe amal karta hai.","حفاظتی مواد میں شرائط ہی اصل مواد ہوتی ہیں۔"]},
{"d":"D6","q":"A company uses AI to triage emergency calls.","a":"What does responsible deployment demand?","o":["A larger context window","A fast model","A conservative design that escalates to a human whenever confidence is low, since the cost of a missed emergency is measured in lives","A polite interface"],"c":2,"w":["Where the cost of a false negative is catastrophic and irreducible, the system must be tuned to over-escalate. Any optimisation for efficiency here trades directly against the outcome the system exists to prevent.","Jahan false negative ka nuqsan tabahi ho aur usay khatam na kiya ja sake, system ko zyada escalate karne ki taraf set karna parta hai. Yahan efficiency ki koi behtari seedha us nateeje se tijarat karti hai jise rokna system ka maqsad hai.","جہاں غلط منفی کا نقصان تباہی ہو، وہاں زیادہ escalate کرنا لازم ہے۔"]},
{"d":"D7","q":"A workflow produces the right items but in the wrong sequence.","a":"What is the most likely cause?","o":["The output format is wrong","The dataset is too small","The model is producing incorrect content","The ordering step is missing or the stages run in parallel without a defined sequence"],"c":3,"w":["Correct items in the wrong order usually means the content work succeeded and the sequencing work was never built. It is a structural omission rather than a quality problem, and the fix belongs in the workflow's shape.","Sahi cheezein ghalat tarteeb mein matlab content ka kaam ho gaya aur tarteeb ka kaam bana hi nahi. Ye dhaanche ki kami hai, quality ka masla nahi.","صحیح چیزیں غلط ترتیب میں مطلب ترتیب کا کام بنا ہی نہیں۔"]},
{"d":"D4","q":"A team's automation saves four hours a day but requires a new forty-minute manual step each evening.","a":"How should this be judged?","o":["By the model's accuracy alone","As a failure, since any manual step is unacceptable","As a clear success, since four hours exceed forty minutes","By the net position, including whether the new step is reliable and who owns it when it is missed"],"c":3,"w":["The arithmetic appears favourable but the comparison is not only about hours. A new manual dependency reintroduces the fragility the automation was meant to remove, and it needs an owner before it is judged a win.","Hisaab faida mand lagta hai magar muqabla sirf ghanton ka nahi. Naya manual step woh nazuk pan wapas le aata hai jise automation hata rahi thi, aur usay jeet kehne se pehle malik tay karna parta hai.","حساب فائدہ مند لگتا ہے مگر موازنہ صرف گھنٹوں کا نہیں۔"]},
{"d":"D2","q":"An AI-generated financial summary rounds figures in a way that makes a significant variance look immaterial.","a":"What has happened?","o":["Rounding has changed the conclusion, because the precision removed was the part that carried the signal","The summary is more readable as a result","The variance did not matter anyway","The numbers are slightly imprecise"],"c":0,"w":["Rounding is a decision about what is worth showing, and made by default it discards exactly the deviations that matter most. The output is numerically close and analytically wrong.","Rounding ye faisla hai ke dikhane layak kya hai, aur default mein woh theek unhi farqon ko hata deti hai jo sabse aham hain. Output numbers mein qareeb hai magar tashreeh mein ghalat.","گول کرنا یہ فیصلہ ہے کہ دکھانے کے قابل کیا ہے۔"]},
{"d":"D4","q":"A team automates a process and then nobody records how the new version works.","a":"What problem does this create?","o":["The system becomes dependent on the people who built it, and their departure removes the organisation's understanding of its own process","Storage costs will rise","The automation will run slower","The model will need retraining"],"c":0,"w":["An undocumented system is a system the organisation does not own. When the people who built it leave, the process can still run but can no longer be changed, diagnosed or defended — which is a slower way of losing it.","Bina document ka system aisa system hai jiska malik organisation nahi. Banane wale chale jayein to process chal to sakta hai magar badla, samjha ya defend nahi ja sakta.","بغیر دستاویز کا نظام ایسا نظام ہے جس کا مالک ادارہ نہیں۔"]},
{"d":"D1","q":"A prompt says “summarise the meeting and send the follow-up to the team”, without saying who the team is.","a":"Why is this a delegation failure?","o":["The model cannot write follow-ups","The model will refuse to send","A required input was left to the model to invent, so any recipient list it produces is a guess presented as a decision","The instruction is too short"],"c":2,"w":["Naming the audience is not a detail; it determines content, tone and level. Left unstated, the model will still name recipients, and an invented distribution list is a decision the user did not make.","Audience batana tafseel nahi; woh content, lehja aur satah tay karta hai. Na batane pe model phir bhi naam dega, aur banayi hui list woh faisla hai jo user ne kiya hi nahi.","سامعین بتانا تفصیل نہیں؛ وہ مواد اور لہجہ طے کرتا ہے۔"]},
{"d":"D2","q":"An AI summary of a negotiation records the final agreement but omits every concession made along the way.","a":"Why is the record incomplete?","o":["What each side gave up is part of the agreement's meaning and shapes how it is interpreted if it is later disputed","The concessions were not important","The concessions were implied by the outcome","The summary should have been longer"],"c":0,"w":["An agreement is understood through its history as well as its text. Without the concessions, the record shows what was decided but not what it cost either party — which is precisely what a future disagreement will turn on.","Agreement apni tareekh se bhi samjha jata hai, sirf apne matn se nahi. Riayatein na hon to record batata hai kya tay hua, ye nahi ke kisi ko kya dena para — aur aage ka ikhtilaf isi pe hoga.","معاہدہ اپنی تاریخ سے بھی سمجھا جاتا ہے۔"]}
]

function applyI18n(){
  var nodes = document.querySelectorAll("[data-i18n]");
  for(var i=0;i<nodes.length;i++){
    var el = nodes[i];
    var v = t(el.getAttribute("data-i18n"));
    if(v) el.innerHTML = v;
  }
  renderCourses();
  renderCards();
  renderQuiz();
}

/* =========================================================
   6. TABS
   ========================================================= */
var tabBtns = [].slice.call(document.querySelectorAll("[data-tab]"));
var panels  = [].slice.call(document.querySelectorAll("[data-panel]"));
var tablist = document.querySelector(".tabs");

function showTab(id){
  var found = false;
  tabBtns.forEach(function(b){
    var on = b.getAttribute("data-tab") === id;
    if(on) found = true;
    b.setAttribute("aria-selected", on ? "true":"false");
    b.tabIndex = on ? 0 : -1;
  });
  panels.forEach(function(p){ p.hidden = p.getAttribute("data-panel") !== id; });
  if(found) write("tab", id);
  return found;
}
tabBtns.forEach(function(b){
  b.addEventListener("click", function(){ showTab(b.getAttribute("data-tab")); });
});
if(tablist){
  tablist.addEventListener("keydown", function(e){
    var i = tabBtns.indexOf(document.activeElement);
    if(i < 0) return;
    var n = null;
    if(e.key === "ArrowRight") n = tabBtns[(i+1) % tabBtns.length];
    else if(e.key === "ArrowLeft") n = tabBtns[(i-1+tabBtns.length) % tabBtns.length];
    else if(e.key === "Home") n = tabBtns[0];
    else if(e.key === "End") n = tabBtns[tabBtns.length-1];
    else return;
    e.preventDefault(); n.focus(); showTab(n.getAttribute("data-tab"));
  });
}

/* =========================================================
   7. LANGUAGE SWITCH
   ========================================================= */
function setLang(l){
  lang = l;
  var root = document.documentElement;
  root.setAttribute("data-lang", l);
  root.lang = (l === "ur") ? "ur" : (l === "ru" ? "ur-Latn" : "en");
  root.dir = (l === "ur") ? "rtl" : "ltr";
  write("lang", l);
  var segs = document.querySelectorAll("#langSeg button");
  for(var i=0;i<segs.length;i++){
    segs[i].setAttribute("aria-pressed", segs[i].getAttribute("data-lang") === l ? "true" : "false");
  }
  applyI18n();
}
document.querySelectorAll("#langSeg button").forEach(function(b){
  b.addEventListener("click", function(){ setLang(b.getAttribute("data-lang")); });
});

function renderCourses(){
  var host = document.getElementById("courseList");
  if(!host) return;
  host.innerHTML = "";
  COURSES.forEach(function(c, i){
    var a = document.createElement("a");
    a.className = "course";
    a.href = "https://agentfactory.panaversity.org/docs/" + c[2];
    a.target = "_blank"; a.rel = "noopener";
    var tags = c[3].map(function(d){
      var hot = c[4][c[3].indexOf(d)];
      return '<span class="dtag'+(hot?' hot':'')+'">'+d+'</span>';
    }).join("");
    a.innerHTML =
      '<span class="num">'+String(i+1).padStart(2,"0")+'</span>'+
      '<span class="cb"><span class="ct">'+c[0]+'</span>'+
      '<span class="cd">'+L(c[1])+'</span>'+(c[5]?'<span class="est">'+L(c[5])+'</span>':'')+
      '<span class="tags">'+tags+'</span></span>';
    host.appendChild(a);
  });
}

/* =========================================================
   9. FLASHCARDS
   ========================================================= */
function renderCards(){
  var grid = document.getElementById("fcGrid");
  var prog = document.getElementById("fcProgress");
  if(!grid) return;
  grid.innerHTML = "";
  CARDS.forEach(function(c, i){
    var id = "c"+i;
    var card = document.createElement("div");
    card.className = "fc";
    if(read("fc."+id) === "known") card.classList.add("known");

    var body = document.createElement("button");
    body.type = "button"; body.className = "fc-body";
    body.setAttribute("aria-expanded","false");

    var hint = document.createElement("span");
    hint.className = "fc-hint"; hint.textContent = t("fc.hint");
    hint.setAttribute("data-hint","1");

    var q = document.createElement("span");
    q.className = "fc-q"; q.innerHTML = L(c[0]);

    var ans = document.createElement("span");
    ans.className = "fc-a"; ans.innerHTML = L(c[1]);

    body.appendChild(hint); body.appendChild(q); body.appendChild(ans);
    body.addEventListener("click", function(){
      var open = card.classList.toggle("open");
      body.setAttribute("aria-expanded", open ? "true":"false");
      hint.textContent = open ? t("fc.hintHide") : t("fc.hint");
    });

    var foot = document.createElement("div");
    foot.className = "fc-foot";
    var know = document.createElement("button");
    know.type = "button"; know.className = "fc-know";
    know.textContent = card.classList.contains("known") ? t("fc.known") : t("fc.mark");
    know.addEventListener("click", function(){
      var on = card.classList.toggle("known");
      write("fc."+id, on ? "known" : "no");
      know.textContent = on ? t("fc.known") : t("fc.mark");
      refreshFcProgress();
    });
    foot.appendChild(know);
    card.appendChild(body); card.appendChild(foot);
    grid.appendChild(card);
  });
  refreshFcProgress();
}
function refreshFcProgress(){
  var grid = document.getElementById("fcGrid");
  var prog = document.getElementById("fcProgress");
  if(!grid || !prog) return;
  var known = grid.querySelectorAll(".fc.known").length;
  prog.textContent = known + " " + t("fc.of") + " " + CARDS.length + " " + t("fc.prog");
}

/* =========================================================
   10. QUIZ ENGINE
   ========================================================= */
var quizState = {
  mode:"practice",
  set:1,
  practice:{ "1":{}, "2":{}, "3":{} },
  mock:{ "1":null, "2":null, "3":null }
};
var timerId = null;

function saveQuiz(){
  write("quiz", JSON.stringify({
    mode:quizState.mode, set:quizState.set,
    practice:quizState.practice, mock:quizState.mock
  }));
}
function loadQuiz(){
  var raw = read("quiz");
  if(!raw) return;
  try{
    var o = JSON.parse(raw);
    if(o.mode) quizState.mode = o.mode;
    if(o.set) quizState.set = o.set;
    if(o.practice) quizState.practice = o.practice;
    if(o.mock) quizState.mock = o.mock;
  }catch(e){}
}

function scaled(raw, total){
  if(!total) return 100;
  return Math.round(100 + (900 * raw / total));
}
function fmt(ms){
  if(ms < 0) ms = 0;
  var s = Math.floor(ms/1000);
  var m = Math.floor(s/60), ss = s % 60;
  return String(m).padStart(2,"0") + ":" + String(ss).padStart(2,"0");
}

function syncSegs(){
  document.querySelectorAll("#modeSeg button").forEach(function(b){
    b.setAttribute("aria-pressed", b.getAttribute("data-mode") === quizState.mode ? "true":"false");
  });
  document.querySelectorAll("#setSeg button").forEach(function(b){
    b.setAttribute("aria-pressed", b.getAttribute("data-set") === String(quizState.set) ? "true":"false");
  });
}

document.querySelectorAll("#modeSeg button").forEach(function(b){
  b.addEventListener("click", function(){
    quizState.mode = b.getAttribute("data-mode");
    saveQuiz(); syncSegs(); renderQuiz();
  });
});
document.querySelectorAll("#setSeg button").forEach(function(b){
  b.addEventListener("click", function(){
    quizState.set = parseInt(b.getAttribute("data-set"),10);
    saveQuiz(); syncSegs(); renderQuiz();
  });
});

function stopTimer(){ if(timerId){ clearInterval(timerId); timerId = null; } }

/* ---------- practice ---------- */
function renderPractice(){
  var host = document.getElementById("qStage");
  var bank = SETS[quizState.set] || [];
  if(!bank.length){ host.innerHTML = '<div class="empty">…</div>'; return; }

  var bar = document.createElement("div");
  bar.className = "quizctl";
  bar.style.marginBottom = "14px";
  bar.innerHTML =
    '<span class="stat">'+t("qz.answered")+' <b data-pd>0</b> / <b>'+bank.length+'</b></span>'+
    '<span class="stat">'+t("qz.correct")+' <b data-pr>0</b></span>'+
    '<button class="btn spacer" type="button" data-reset>'+t("qz.reset")+'</button>';
  host.appendChild(bar);

  var list = document.createElement("div");
  list.style.cssText = "display:flex;flex-direction:column;gap:14px";
  host.appendChild(list);

  var answered = quizState.practice[String(quizState.set)] || {};

  function counters(){
    bar.querySelector("[data-pd]").textContent = Object.keys(answered).length;
    var right = 0;
    Object.keys(answered).forEach(function(k){ if(answered[k] === bank[k].c) right++; });
    bar.querySelector("[data-pr]").textContent = right;
  }

  bank.forEach(function(item, qi){
    var card = document.createElement("div");
    card.className = "q";
    var head = document.createElement("p");
    head.className = "qsc";
    head.innerHTML = '<span class="qn">'+t("qz.qof")+' '+(qi+1)+' · '+item.d+'</span>'+item.q+
      '<strong class="qask">'+item.a+'</strong>';
    card.appendChild(head);

    var opts = document.createElement("div");
    opts.className = "opts";
    var why = document.createElement("p");
    why.className = "why";
    var letters = ["A","B","C","D"];

    function paint(picked){
      card.classList.add("answered");
      if(picked === item.c) card.classList.add("right");
      [].forEach.call(opts.children, function(btn, bi){
        btn.disabled = true;
        if(bi === item.c) btn.classList.add("right");
        else if(bi === picked) btn.classList.add("wrong");
        else btn.classList.add("faded");
      });
      why.innerHTML = "<b>"+letters[item.c]+".</b> " + L(item.w);
    }

    item.o.forEach(function(text, oi){
      var b = document.createElement("button");
      b.type = "button"; b.className = "opt";
      b.innerHTML = '<span class="ol">'+letters[oi]+'</span><span class="ot">'+text+'</span>';
      b.addEventListener("click", function(){
        if(card.classList.contains("answered")) return;
        answered[qi] = oi;
        quizState.practice[String(quizState.set)] = answered;
        saveQuiz();
        paint(oi); counters();
      });
      opts.appendChild(b);
    });

    card.appendChild(opts); card.appendChild(why);
    list.appendChild(card);

    if(answered[qi] !== undefined) paint(answered[qi]);
  });

  bar.querySelector("[data-reset]").addEventListener("click", function(){
    quizState.practice[String(quizState.set)] = {};
    answered = quizState.practice[String(quizState.set)];
    saveQuiz(); renderQuiz();
  });

  counters();
}

/* ---------- mock ---------- */
var mockView = { index:0, confirming:false };

function renderMock(){
  var host = document.getElementById("qStage");
  var bank = SETS[quizState.set] || [];
  if(!bank.length){ host.innerHTML = '<div class="empty">…</div>'; return; }
  var st = quizState.mock[String(quizState.set)];

  if(!st){
    var setup = document.createElement("div");
    setup.className = "card";
    setup.innerHTML =
      '<h3>'+t("qz.mock")+' · Set '+quizState.set+'</h3>'+
      '<p class="sub prose">'+bank.length+' '+t("f.items")+' · 120 '+t("f.minutesNote")+' · '+t("qz.outOf")+'</p>';
    var go = document.createElement("button");
    go.type = "button"; go.className = "btn primary";
    go.textContent = t("qz.start");
    go.addEventListener("click", function(){
      quizState.mock[String(quizState.set)] = {
        answers:{}, deadline: Date.now() + 120*60*1000, submitted:false, timeUp:false
      };
      mockView.index = 0;
      saveQuiz(); renderMock();
    });
    setup.appendChild(go);
    host.innerHTML = ""; host.appendChild(setup);
    return;
  }

  if(st.submitted){ renderReport(bank, st); return; }

  /* running */
  stopTimer();
  var head = document.createElement("div");
  head.className = "mockhead";
  head.innerHTML =
    '<span class="timer" data-timer>--:--</span>'+
    '<span class="stat">'+t("qz.qof")+' <b data-pos>1</b> / <b>'+bank.length+'</b></span>'+
    '<button class="btn primary spacer" type="button" data-submit>'+t("qz.submit")+'</button>';
  host.innerHTML = "";
  host.appendChild(head);

  var pal = document.createElement("div");
  pal.className = "palette";
  pal.style.margin = "14px 0";
  host.appendChild(pal);

  var qhost = document.createElement("div");
  host.appendChild(qhost);

  var nav = document.createElement("div");
  nav.className = "mocknav";
  nav.style.marginTop = "14px";
  nav.innerHTML =
    '<button class="btn" type="button" data-prev>'+t("qz.prev")+'</button>'+
    '<button class="btn" type="button" data-next>'+t("qz.next")+'</button>';
  host.appendChild(nav);

  var confirmBox = document.createElement("div");
  confirmBox.className = "callout trap";
  confirmBox.style.marginTop = "14px";
  confirmBox.hidden = true;
  confirmBox.innerHTML = '<strong>'+t("qz.confirmSubmit")+'</strong>';
  var cy = document.createElement("button");
  cy.type="button"; cy.className="btn primary"; cy.textContent = t("qz.confirmYes");
  var cn = document.createElement("button");
  cn.type="button"; cn.className="btn"; cn.textContent = t("qz.confirmNo");
  var crow = document.createElement("div");
  crow.style.cssText="display:flex;gap:9px;margin-top:6px";
  crow.appendChild(cy); crow.appendChild(cn);
  confirmBox.appendChild(crow);
  host.appendChild(confirmBox);

  function drawQuestion(){
    var qi = mockView.index, item = bank[qi];
    qhost.innerHTML = "";
    var card = document.createElement("div");
    card.className = "q";
    var head2 = document.createElement("p");
    head2.className = "qsc";
    head2.innerHTML = '<span class="qn">'+t("qz.qof")+' '+(qi+1)+' · '+item.d+'</span>'+item.q+
      '<strong class="qask">'+item.a+'</strong>';
    card.appendChild(head2);
    var opts = document.createElement("div");
    opts.className = "opts";
    var letters = ["A","B","C","D"];
    item.o.forEach(function(text, oi){
      var b = document.createElement("button");
      b.type = "button"; b.className = "opt";
      if(st.answers[qi] === oi) b.classList.add("sel");
      b.innerHTML = '<span class="ol">'+letters[oi]+'</span><span class="ot">'+text+'</span>';
      b.addEventListener("click", function(){
        st.answers[qi] = oi;
        saveQuiz(); drawQuestion(); drawPalette();
      });
      opts.appendChild(b);
    });
    card.appendChild(opts);
    qhost.appendChild(card);
    head.querySelector("[data-pos]").textContent = qi+1;
  }

  function drawPalette(){
    pal.innerHTML = "";
    bank.forEach(function(_, i){
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = i+1;
      if(st.answers[i] !== undefined) b.classList.add("ans");
      if(i === mockView.index) b.classList.add("cur");
      b.addEventListener("click", function(){ mockView.index = i; drawQuestion(); drawPalette(); });
      pal.appendChild(b);
    });
  }

  nav.querySelector("[data-prev]").addEventListener("click", function(){
    if(mockView.index > 0){ mockView.index--; drawQuestion(); drawPalette(); }
  });
  nav.querySelector("[data-next]").addEventListener("click", function(){
    if(mockView.index < bank.length-1){ mockView.index++; drawQuestion(); drawPalette(); }
  });
  head.querySelector("[data-submit]").addEventListener("click", function(){
    confirmBox.hidden = false;
  });
  cn.addEventListener("click", function(){ confirmBox.hidden = true; });
  cy.addEventListener("click", function(){
    st.submitted = true; stopTimer(); saveQuiz(); renderMock();
  });

  var timerEl = head.querySelector("[data-timer]");
  function tick(){
    var left = st.deadline - Date.now();
    timerEl.textContent = fmt(left);
    timerEl.classList.toggle("low", left < 5*60*1000);
    if(left <= 0){
      st.submitted = true; st.timeUp = true;
      stopTimer(); saveQuiz(); renderMock();
    }
  }
  tick();
  timerId = setInterval(tick, 1000);

  drawQuestion(); drawPalette();
}

/* ---------- report ---------- */
function renderReport(bank, st){
  stopTimer();
  var host = document.getElementById("qStage");
  host.innerHTML = "";

  var raw = 0;
  var domains = {};
  bank.forEach(function(item, i){
    if(!domains[item.d]) domains[item.d] = {right:0,total:0};
    domains[item.d].total++;
    if(st.answers[i] === item.c){ raw++; domains[item.d].right++; }
  });
  var sc = scaled(raw, bank.length);
  var pass = sc >= 720;

  if(st.timeUp){
    var tu = document.createElement("div");
    tu.className = "callout warn";
    tu.innerHTML = '<strong>'+t("qz.timeUp")+'</strong>';
    host.appendChild(tu);
  }

  var card = document.createElement("div");
  card.className = "scorecard " + (pass ? "pass":"fail");
  card.innerHTML =
    '<div class="verdict">'+(pass ? t("qz.pass") : t("qz.fail"))+'</div>'+
    '<div class="scorenum">'+sc+'</div>'+
    '<div class="scnote"><strong>'+t("qz.yourScore")+'</strong> — '+t("qz.outOf")+'</div>'+
    '<div class="scnote">'+t("qz.raw")+': '+raw+' / '+bank.length+'</div>';
  host.appendChild(card);

  var byDomain = document.createElement("h3");
  byDomain.style.marginTop = "22px";
  byDomain.textContent = t("qz.byDomain");
  host.appendChild(byDomain);

  var wrap = document.createElement("div");
  wrap.className = "tablewrap";
  wrap.style.marginTop = "10px";
  var rows = Object.keys(DOMAIN_LABEL).map(function(d){
    var v = domains[d] || {right:0,total:0};
    var pct = v.total ? Math.round(100*v.right/v.total) : 0;
    var cls = pct >= 70 ? "" : (pct >= 50 ? "mid" : "low");
    return '<tr><td><span class="code">'+d+'</span> '+DOMAIN_LABEL[d]+'</td>'+
      '<td class="n">'+v.right+' / '+v.total+'</td>'+
      '<td><div class="dbar"><i class="'+cls+'" style="width:'+pct+'%"></i></div></td>'+
      '<td class="n">'+pct+'%</td></tr>';
  }).join("");
  wrap.innerHTML = '<table class="dtable"><thead><tr><th>'+t("qz.domainTitle")+'</th><th>'+t("qz.scoreTitle")+'</th><th></th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';
  host.appendChild(wrap);

  var note = document.createElement("p");
  note.className = "footnote";
  note.style.marginTop = "10px";
  note.textContent = t("qz.scaleNote");
  host.appendChild(note);

  var revHead = document.createElement("h3");
  revHead.style.marginTop = "22px";
  revHead.textContent = t("qz.review");
  host.appendChild(revHead);

  var revList = document.createElement("div");
  revList.style.cssText = "display:flex;flex-direction:column;gap:10px;margin-top:12px";
  var letters = ["A","B","C","D"];
  bank.forEach(function(item, i){
    var picked = st.answers[i];
    var ok = picked === item.c;
    var d = document.createElement("div");
    d.className = "rev " + (ok ? "good":"bad");
    var ya = (picked === undefined) ? t("qz.unanswered") : (letters[picked]+". "+item.o[picked]);
    d.innerHTML =
      '<p class="rq">'+(i+1)+'. '+item.q+'</p>'+
      '<p class="ra">'+t("qz.yourAnswer")+': <b>'+ya+'</b></p>'+
      (ok ? "" : '<p class="ra">'+t("qz.rightAnswer")+': <b>'+letters[item.c]+'. '+item.o[item.c]+'</b></p>')+
      '<p class="ra">'+L(item.w)+'</p>';
    revList.appendChild(d);
  });
  host.appendChild(revList);

  var again = document.createElement("button");
  again.type = "button"; again.className = "btn";
  again.style.marginTop = "18px";
  again.textContent = t("qz.startOver");
  again.addEventListener("click", function(){
    quizState.mock[String(quizState.set)] = null;
    mockView.index = 0;
    saveQuiz(); renderMock();
  });
  host.appendChild(again);
}

/* ---------- dispatcher ---------- */
function renderQuiz(){
  var stage = document.getElementById("qStage");
  if(!stage) return;
  stopTimer();
  syncSegs();
  stage.innerHTML = "";
  if(quizState.mode === "practice") renderPractice();
  else renderMock();
}

/* =========================================================
   11. CHECKLIST
   ========================================================= */
function bindChecklist(){
  document.querySelectorAll("#checklist input[type=checkbox]").forEach(function(box){
    var key = "ck." + box.getAttribute("data-ck");
    box.checked = read(key) === "1";
    box.addEventListener("change", function(){
      if(box.checked) write(key,"1"); else wipe(key);
    });
  });
}

/* =========================================================
   12. BOOT
   ========================================================= */
loadQuiz();
bindChecklist();

var savedLang = read("lang");
if(savedLang && LANGS.indexOf(savedLang) > -1) lang = savedLang;
var savedTab = read("tab");

syncSegs();
setLang(lang);                 /* applies i18n + renders courses/cards/quiz */
if(!savedTab || !showTab(savedTab)) showTab("overview");

window.addEventListener("beforeunload", stopTimer);
})();
</script>
