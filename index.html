{"d":"D5","q":"A team adds a skill that encapsulates their internal approval procedure so the agent follows the same steps every time.","a":"What does this actually solve?","o":["It makes the model more creative","It makes the procedure repeatable and reviewable instead of being re-described in every prompt","It increases the maximum token limit","It removes the need for human approval"],"c":1,"w":["Stored configuration converts a habit into a specification. The value is consistency plus the ability to inspect the procedure itself — which is impossible when it lives in whatever someone typed that day.","Stored configuration aadat ko specification banati hai. Faida consistency hai, aur ye ke procedure khud inspect ho sake — jo tab namumkin hai jab woh har roz ke type kiye hue prompt mein ho.","محفوظ ترتیب عادت کو تفصیل بناتی ہے۔ فائدہ مستقل مزاجی اور طریقہ کار کی جانچ ہے۔"]},
{"d":"D1","q":"A manager asks for a summary of a long report. The summary is accurate, but two pages long when a single paragraph was needed.","a":"What was missing from the delegation?","o":["An instruction to cite sources","A more capable model","The report itself","The length and format constraint on the output"],"c":3,"w":["The task was defined by subject but not by shape. Accuracy was satisfied and usefulness was not, which is what happens when the deliverable is never specified. This is a Define failure, not a model failure.","Kaam ka mauzu bata diya gaya magar shakal nahi. Accuracy mil gayi, faida nahi — yehi hota hai jab deliverable bataya na jaye. Ye Define ki galti hai, model ki nahi.","کام کا موضوع بتا دیا گیا مگر شکل نہیں۔ یہ تفویض کی غلطی ہے، ماڈل کی نہیں۔"]},
{"d":"D2","q":"A research assistant uses AI to build a reference list, then submits it without opening any of the sources.","a":"Which principle has been violated?","o":["A citation is not verification — checking the citation is verification","Use the largest model available","Always work only from primary documents","Never use AI for research"],"c":0,"w":["Links that were never opened are decoration. The check is the work; the presence of a reference proves only that a reference was produced, not that it points anywhere real.","Jo links kholay hi nahi gaye woh sirf sajaawٹ hain. Check karna hi asli kaam hai; citation ka hona sirf itna batata hai ke citation bani, ye nahi ke woh kisi asli jagah le jati hai.","جو لنک کھولے ہی نہیں گئے وہ صرف سجاوٹ ہیں۔ جانچنا ہی اصل کام ہے۔"]},
{"d":"D4","q":"A team automates a monthly report. The first two months are correct. In month three a source changes format, and the report silently produces blanks.","a":"What should the design have included?","o":["A more capable model to handle format variation","A second report for comparison","An annual manual review","A validation check on incoming data that halts when the format is not recognised"],"c":3,"w":["The dangerous part is not the break, it is the silence. A workflow that fails loudly costs an hour; one that fails quietly produces a plausible document nobody knows to distrust. Guard the input boundary.","Khatarnak cheez tootna nahi, khamoshi hai. Jo workflow zor se fail ho woh ek ghanta leta hai; jo chupke fail ho woh aisi report banata hai jis pe koi shak na kare. Input ki hadd pe guard lagayein.","خطرناک چیز ٹوٹنا نہیں، خاموشی ہے۔ ان پٹ کی حد پر حفاظت لگائیں۔"]},
{"d":"D6","q":"A startup plans to run an AI tool over customer chat logs containing names, phone numbers and home addresses.","a":"What must be settled before anything else?","o":["Whether the data may lawfully be used this way, and what must be removed before it is","Which model produces the fastest responses","How many tokens the logs contain","Which output format the tool should return"],"c":0,"w":["Questions about permission and minimisation come before questions about implementation. Personal data has a legal and ethical life of its own, and no technical choice can retroactively authorise a use that was never permitted.","Ijazat aur data kam karne ke sawal implementation se pehle aate hain. Zaati data ki apni qanooni aur akhlaqi hadd hoti hai, aur koi technical faisla us istemal ko baad mein jaiz nahi kar sakta.","اجازت اور ڈیٹا کم کرنے کے سوال عمل سے پہلے آتے ہیں۔"]},
{"d":"D7","q":"A team's AI workflow is slow. Every request reprocesses the same 80-page document from the beginning.","a":"What is the likely inefficiency?","o":["The output format is too verbose","The office network is slow","The same source material is reprocessed on every call instead of being retrieved or cached","The model is too small for the work"],"c":2,"w":["The repeated work is visible in the description: the same document, processed from scratch, on every request. Retrieval solves this by fetching only the relevant passages, which changes both cost and latency without touching model choice.","Dohraaya gaya kaam description mein saaf hai: wohi document, har request pe shuru se. Retrieval sirf zaroori hisse laata hai, jo cost aur speed dono badal deta hai — model badalne ki zaroorat nahi.","دہرایا گیا کام تفصیل میں صاف ہے۔ ریٹریول صرف ضروری حصے لاتا ہے۔"]},
{"d":"D2","q":"A consultant submits an AI-assisted analysis. It contains a confident five-year projection built on an assumption that was never stated.","a":"What is the professional failure?","o":["Omitting a disclaimer","Presenting an unstated assumption as though it were a conclusion","Using AI for analysis at all","Failing to use a larger model"],"c":1,"w":["The projection may be internally sound, but the reader cannot tell because its foundation is invisible. The duty is to surface the assumption so the reader can accept or reject it — a disclaimer would not fix a hidden premise.","Projection andar se durust ho sakta hai, magar padhne wala jaan nahi sakta kyunke uski bunyaad chhipi hui hai. Farz hai assumption saamne laana; disclaimer chhipi hui bunyaad ka ilaaj nahi.","تخمینہ درست ہو سکتا ہے، مگر بنیاد چھپی ہونے سے قاری جان نہیں سکتا۔"]},
{"d":"D3","q":"A team needs an assistant that answers policy questions and links to the wiki page each answer came from.","a":"What decides whether this is possible?","o":["The number of people who will use it","The average length of the questions asked","Whether the wiki is available to the assistant as a retrievable, citable knowledge source","The visual design of the interface"],"c":2,"w":["Citations require a source the assistant can actually reach and reference. Without that connection it can describe the policy but cannot point to where it came from, and a description that points nowhere is not a citation.","Citation ke liye aisa source chahiye jahan tak assistant pohnch sake. Us connection ke bina woh policy bata sakta hai magar uska thikana nahi de sakta — aur bina thikane wali baat citation nahi.","حوالے کے لیے ایسا ماخذ چاہیے جہاں تک رسائی ہو۔"]},
{"d":"D5","q":"A team keeps its prompt templates in a shared document and pastes them in by hand each time.","a":"What is the practical risk?","o":["The model will forget the templates","The document will become slow to open","The templates will eventually grow too long","Different members will use stale or locally edited versions, so the same task produces inconsistent output"],"c":3,"w":["A template that lives in a document is only as current as the last person who copied it. Storing it as configuration removes the drift and makes one change apply everywhere at once.","Document mein rakha template utna hi naya hota hai jitna aakhri copy karne wale ne rakha. Configuration mein rakhne se drift khatam hota hai aur ek tabdeeli sab jagah lag jati hai.","دستاویز میں رکھا سانچہ اُتنا ہی نیا جتنا آخری نقل کرنے والے نے رکھا۔"]},
{"d":"D1","q":"A user writes one instruction containing three goals that cannot all be satisfied at the same time.","a":"What is the likely outcome?","o":["The model will optimise for whichever goal it reads as primary and may quietly drop the others","The model will resolve the conflict in the way the user intended","The model will refuse the task","The output will be longer than expected"],"c":0,"w":["A conflicting instruction delegates the choice to the model, and the model has no basis for choosing. The delegation should state which goal wins when they collide — that is a decision the human owns, not the agent.","Takrate hue hidayat model ko faisla de deti hai, aur model ke paas faisle ki koi bunyaad nahi. Delegation mein batana chahiye ke takrao mein kaunsa maqsad jeetega — ye faisla human ka hai.","ٹکراتی ہدایت فیصلہ ماڈل کو دے دیتی ہے، اور ماڈل کے پاس بنیاد نہیں۔"]},
{"d":"D2","q":"A support agent answers a complaint with a correct policy answer — but the policy changed last week, and the agent used the previous version.","a":"What is the root cause?","o":["The knowledge source was stale, so the agent had no current version to answer from","The model tier was too low","The complaint was unusually complex","The model invented a policy that never existed"],"c":0,"w":["The answer was accurate when it was written, which is why nothing flagged it. Stale grounding produces confident, wrong, internally consistent output — the failure mode that looks most like success. Keep the source current.","Jawab likhne ke waqt sahi tha, isi liye kisi ne roka nahi. Purani bunyaad bharosemand, ghalat aur andar se durust jawab deti hai — wohi galti jo kamyabi jaisi lagti hai. Source ko taza rakhein.","جواب لکھتے وقت درست تھا، اسی لیے کسی نے روکا نہیں۔ پرانی بنیاد بھروسے والا غلط جواب دیتی ہے۔"]},
{"d":"D4","q":"A team plans to introduce AI into a process where a mistake ends up in a regulatory filing.","a":"Which design is appropriate?","o":["Fully automated, with human review only if a complaint arrives","AI drafts and a qualified human reviews and signs off before the filing is submitted","No AI should be used anywhere near the process","AI drafts and submits, with an action log kept"],"c":1,"w":["Where an error carries legal consequence, the review point belongs before submission, not after discovery. Logging preserves evidence of the mistake without preventing it, and refusing AI entirely discards a useful drafting step.","Jahan galti ka qanooni nateeja ho, wahan review submission se pehle hona chahiye, pakadne ke baad nahi. Log galti ka saboot rakhta hai, usay rokta nahi; aur AI ko poora chhor dena faida mand draft step zaya karna hai.","جہاں غلطی کا قانونی نتیجہ ہو، جائزہ جمع کرنے سے پہلے ہونا چاہیے۔"]},
{"d":"D7","q":"A workflow fails intermittently. Logs show every failure coincides with two requests arriving at the same moment.","a":"What does this point to?","o":["A context window limit","A model quality problem","A concurrency problem in how the workflow handles simultaneous requests","A wording problem in the prompt"],"c":2,"w":["The failure correlates with a timing condition, not with content, which locates it in the workflow rather than the model. Intermittent and reproducible-by-timing failures are almost always structural — a shared resource with no coordination.","Failure ka talluq waqt se hai, content se nahi — is liye masla workflow mein hai, model mein nahi. Waqt se dohraane wali galtiyan taqreeban hamesha dhaanche ki hoti hain.","ناکامی کا تعلق وقت سے ہے، مواد سے نہیں — اس لیے مسئلہ ورک فلو میں ہے۔"]},
{"d":"D2","q":"A team receives an AI summary of a 90-minute meeting. It records every decision reached but not who agreed to each one.","a":"What is the gap in the deliverable?","o":["Ownership is missing, and the record does not actually support the action it was made for","Nothing — the decisions were captured","The summary is too short","The model needed a larger context window"],"c":0,"w":["A decision without an owner is a note, not a record. The purpose of the summary was to make follow-up possible, and without ownership the document cannot serve the reason it was produced.","Bina malik ke faisla ek note hai, record nahi. Summary ka maqsad follow-up mumkin banana tha, aur bina malik ke woh apna maqsad poora nahi karti.","بغیر مالک کے فیصلہ یادداشت ہے، ریکارڈ نہیں۔"]},
{"d":"D3","q":"A team needs an assistant that reads the company's private documents and must not send that text outside their own infrastructure.","a":"What kind of solution does this require?","o":["A larger public model","A deployment in which the model and the data both stay under the organisation's control","A browser extension","Any public chat model"],"c":1,"w":["The constraint is about where the text goes, not how capable the model is. That is a deployment question — the data boundary decides which options remain available, and model quality is irrelevant if the answer cannot be used.","Shart ye hai ke text kahan jaata hai, model kitna acha hai ye nahi. Ye deployment ka sawal hai — data ki hadd faisla karti hai kaunse options rehte hain.","شرط یہ ہے کہ متن کہاں جاتا ہے۔ یہ تعیناتی کا سوال ہے۔"]},
{"d":"D1","q":"A user needs the model to follow a five-step procedure in a fixed order every single time.","a":"What is the most reliable way to get this?","o":["Ask the model to determine the optimal order itself","State the steps explicitly, in order, and require the output to follow that sequence","Write a longer prompt with no internal structure","Describe the goal and let the model work out its own steps"],"c":1,"w":["When order matters, order must be specified. Leaving the sequence to the model invites variation between runs, and a procedure whose steps can be reordered is a procedure that will eventually be run in the wrong order.","Jab tarteeb aham ho, tarteeb batani parti hai. Model pe chhorne se har run mein farq aata hai, aur aisa procedure jiska order badal sake woh ek din ghalat order mein chalega.","جب ترتیب اہم ہو، ترتیب بتانی پڑتی ہے۔"]},
{"d":"D6","q":"An AI system recommends which insurance claims to pay. A claimant who was refused asks how the decision was reached.","a":"What does responsible use require here?","o":["That the basis of the decision can be explained and reviewed by a human","Nothing — the decision was made by an automated system","That the model be replaced","That the claimant be given a different decision"],"c":0,"w":["A decision that affects a person and cannot be explained cannot be challenged, and a decision that cannot be challenged should not be automated. Explainability and review are what make the automation legitimate rather than merely convenient.","Jo faisla kisi fard pe asar dale aur samjhaya na ja sake woh challenge nahi ho sakta, aur jo challenge na ho sake woh automate nahi karna chahiye.","جو فیصلہ سمجھایا نہ جا سکے وہ چیلنج نہیں ہو سکتا۔"]},
{"d":"D4","q":"A team's AI workflow produces correct output, but staff keep bypassing it because it adds four extra clicks to their day.","a":"What is the real problem?","o":["The output format is wrong","The workflow design ignores the people who have to operate it","The staff need further training","The model is producing inaccurate output"],"c":1,"w":["A workflow that is correct and unused has failed. Adoption is part of the design: every extra step is a cost paid thousands of times, and friction pushes users back to the manual path the automation was meant to replace.","Jo workflow sahi ho magar use na ho woh fail hai. Adoption design ka hissa hai: har extra click hazaron baar ada hota hai, aur mushkil logon ko purane tareeqe pe wapas bhej deti hai.","جو ورک فلو درست ہو مگر استعمال نہ ہو وہ ناکام ہے۔"]},
{"d":"D3","q":"An agent must look up today's exchange rate before converting an invoice total.","a":"What does this requirement tell you about the solution?","o":["The invoice must be converted manually","A reasoning model is required","The agent needs access to a live data source, because today's rate cannot come from training data","A larger model is needed"],"c":2,"w":["Some facts are only true at the moment they are asked. No model, however large, carries today's rate, so the design must include a live lookup — and the value it returns should be recorded, because it will be different tomorrow.","Kuch baatein sirf usi lamhe sach hoti hain jab poocha jaye. Kitna hi bara model ho, aaj ka rate uske paas nahi hota — is liye live source chahiye, aur jo value aaye woh record bhi karni chahiye.","کچھ باتیں صرف اسی لمحے سچ ہوتی ہیں۔ آج کا ریٹ ماڈل کے پاس نہیں ہوتا۔"]},
{"d":"D2","q":"A reviewer notices that an AI-drafted contract summary omits the indemnity clause, though everything else is accurate.","a":"How should this be treated?","o":["A material omission — the missing clause changes the meaning of the document, so the summary cannot be used as it stands","A formatting issue","Acceptable, since most of the document was captured","A minor omission that can be added later"],"c":0,"w":["Omitting the clause that allocates risk is not a gap in coverage, it is a different document. The omissions that matter are the ones that change what the reader would decide, not the ones that change the page count.","Woh clause chhorna jo khatre ki taqseem karta hai, coverage ka khala nahi — ye ek alag document hai. Aham woh chhoot hai jo padhne wale ka faisla badal de.","وہ شق چھوڑنا جو خطرے کی تقسیم کرتی ہے، ایک مختلف دستاویز ہے۔"]},
{"d":"D7","q":"A user reports that the agent gives better answers in the morning than in the afternoon, with no other change.","a":"What should be checked first?","o":["Whether the model's quality varies by time of day","Whether the office network is congested in the afternoon","What actually differs between the two sessions — the instructions, the context supplied, or the data used","Whether a larger model is available"],"c":2,"w":["A model does not have a time of day. When output quality changes and the model has not, something in the input changed — and the first job is to find the variable, not to replace the component.","Model ka din ke waqt se koi talluq nahi. Jab output badle aur model na badle, to input mein kuch badla hai — pehla kaam us badlav ko dhoondna hai.","ماڈل کا وقت سے تعلق نہیں۔ جب آؤٹ پٹ بدلے اور ماڈل نہ بدلے، تو ان پٹ میں کچھ بدلا ہے۔"]},
{"d":"D5","q":"A company wants the agent to use their internal style guide whenever it writes customer emails.","a":"How should this be configured?","o":["Included in the model's training","Typed from memory into each prompt","Appended to the customer's original email","Stored once as a reusable instruction or knowledge source applied to every relevant task"],"c":3,"w":["A rule that lives in a person's memory is applied differently by each person and drifts as memory fades. Storing it makes one standard apply everywhere, and makes the standard itself something that can be reviewed and changed.","Jo rule kisi ki yaad mein rehta hai woh har banda alag lagata hai aur waqt ke saath badalta hai. Store karne se ek mayaar har jagah lagta hai aur khud review hone layak ban jata hai.","جو قاعدہ یاد میں رہتا ہے وہ ہر شخص الگ لگاتا ہے۔"]},
{"d":"D4","q":"A hospital wants AI to route incoming referrals to the correct department. A mis-routed referral delays patient care by days.","a":"Which design decision matters most?","o":["Making the routing as fast as technically possible","Building a review or fallback path for low-confidence and ambiguous cases","Ensuring the interface looks modern","Which model vendor is chosen"],"c":1,"w":["When the cost of an error is measured in patient days, the design question is not average accuracy but what happens at the edges. A confidence threshold with a human fallback converts an unbounded failure into a bounded one.","Jab galti ki qeemat mareez ke dinon mein ho, to sawal average accuracy ka nahi, kinaron ka hai. Confidence threshold ke saath human fallback ek be-hadd galti ko mahdood bana deta hai.","جب غلطی کی قیمت مریض کے دنوں میں ہو، تو سوال کناروں کا ہے۔"]},
{"d":"D6","q":"A manager asks whether the agent should be allowed to approve expense claims below a set value on its own.","a":"What is the core governance question?","o":["What the agent may decide without human review, and what happens when that decision is wrong","Which model tier the agent runs on","How many claims are filed each month","How quickly the agent processes a claim"],"c":0,"w":["This is a question about delegated authority: where the line sits, and what recourse exists on the wrong side of it. Speed and volume are operational concerns; they have no bearing on whether the delegation is legitimate.","Ye sawal delegated ikhtiyar ka hai: hadd kahan hai, aur us ke paar galti pe kya bandobast hai. Speed aur volume operational cheezein hain, delegation ke jaiz hone se unka koi talluq nahi.","یہ سوال تفویض شدہ اختیار کا ہے: حد کہاں ہے، اور غلطی پر کیا انتظام ہے۔"]},
{"d":"D1","q":"A workflow returns a well-written answer to the wrong question, every time, for every input.","a":"Which rung of the diagnostic ladder is this?","o":["The model needs a larger context window","The output format is wrong","The task was defined badly — the instructions do not describe the task the user actually wants","The reasoning is too complex for the model"],"c":2,"w":["When the failure is uniform across all inputs and the output is coherent, the model is doing exactly what it was asked. That points at the definition of the task, which is the one component nobody has checked.","Jab galti sab inputs pe ek jaisi ho aur output saaf ho, to model wohi kar raha hai jo usay kaha gaya. Ye task ki tareef ka masla hai — woh hissa jise kisi ne check nahi kiya.","جب غلطی سب ان پٹ پر یکساں ہو، تو ماڈل وہی کر رہا ہے جو کہا گیا۔"]},
{"d":"D2","q":"A team uses AI to check contracts against a compliance checklist. The tool reports that a contract passes, and nobody reads the contract itself.","a":"What is the structural risk?","o":["The AI's output has become the sole record, so an incorrect pass cannot be detected by anyone downstream","The checklist is too long for the model","The AI may be slightly less accurate than a lawyer","The contract should have been shorter"],"c":0,"w":["Replacing human review with a model check is only sound if something still catches the model's mistakes. When the tool's verdict becomes the only source of truth, every error it makes becomes invisible by construction.","Human review ki jagah model check tab theek hai jab koi model ki galti bhi pakde. Jab tool ka faisla hi wahid sach ban jaye, to uski har galti chhup jati hai.","انسانی جائزے کی جگہ ماڈل چیک تب ٹھیک ہے جب کوئی ماڈل کی غلطی بھی پکڑے۔"]},
{"d":"D6","q":"A company plans to publish AI-generated medical guidance on its public website, sourced from a chatbot.","a":"What is the primary governance failure?","o":["Unverified health guidance is being published under the company's name to people who may act on it","The content was not translated","The chatbot was asked too many questions","The website loads slowly"],"c":0,"w":["Publication transfers the content into the company's authority, where strangers will treat it as advice. The severity comes from the combination: unverified claims, an unattended audience, and potential physical harm.","Publish karne se content company ke ikhtiyar mein chala jata hai, jahan ajnabi usay mashwara samjhenge. Shiddat in teenon ke mel se aati hai: bina verify dawa, be-nigrani audience, aur jismani nuqsan ka khatra.","شائع کرنے سے مواد کمپنی کے اختیار میں چلا جاتا ہے، جہاں اجنبی اسے مشورہ سمجھیں گے۔"]},
{"d":"D4","q":"A team is deciding where to place AI in a process containing one high-volume low-risk step and one low-volume high-risk step.","a":"Where does AI belong first?","o":["The high-risk step, because that is where the most value sits","Neither step","Both at once, to learn faster","The high-volume low-risk step, where errors are cheap and volume makes the gain large"],"c":3,"w":["Start where the cost of being wrong is low and the repetition makes improvement measurable. Earned trust from that step is what justifies approaching the high-risk one later, with evidence rather than optimism.","Wahan se shuru karein jahan galti sasti ho aur dohrai se behtari naapi ja sake. Us step ka bharosa hi baad mein high-risk step ke liye saboot deta hai.","وہاں سے شروع کریں جہاں غلطی سستی ہو اور دہرائی سے بہتری ناپی جا سکے۔"]},
{"d":"D4","q":"Six months after launch, a team realises no one has reviewed the AI workflow against its original purpose.","a":"What is missing from the design?","o":["A larger context window","A redesigned interface","A scheduled review step in the workflow's operating lifecycle","A faster model"],"c":2,"w":["Workflows outlive the conditions they were built for: sources change, policies change, people change. Without a review step, drift accumulates silently and the system keeps answering a question the organisation no longer asks.","Workflows un halaat se zyada jeete hain jin ke liye bane the: sources, policies aur log badalte hain. Review ke bina tabdeeli chupke jama hoti rehti hai.","ورک فلو اُن حالات سے زیادہ جیتے ہیں جن کے لیے بنے تھے۔"]},
{"d":"D2","q":"A team receives an AI-written risk assessment. Every paragraph is carefully hedged with words like “may” and “could”, so nothing in it is technically false.","a":"What is the problem with this output?","o":["It should have been written in the passive voice","It is too long to read","It uses the wrong tone for the audience","It is unfalsifiable — a document hedged into vagueness cannot be acted on or checked"],"c":3,"w":["Hedging so complete that no claim can be tested is a way of saying nothing while looking thorough. A risk assessment exists to support a decision; if no line in it can be wrong, no line in it can be used.","Itna hedging ke koi dawa test na ho sake, ye kuch na kehne ka tareeqa hai — magar dekhnay mein mukammal lagta hai. Risk assessment faisla karne ke liye hota hai; agar koi line ghalat nahi ho sakti to koi line kaam bhi nahi aati.","اتنی احتیاط کہ کوئی دعویٰ جانچا نہ جا سکے، یہ کچھ نہ کہنے کا طریقہ ہے۔"]}
],
2: [
{"d":"D2","q":"An AI system transcribes recorded sales calls. Spot-checks find that roughly once in fifty calls it renders “we can't guarantee that” as “we can guarantee that”.","a":"Which conclusion is supported?","o":["A larger model would remove the remaining errors","The transcription is reliable, given how low the error rate is","A rare negation error is unacceptable in a document that may become a record, so the transcript needs verification before use","The problem is audio quality and nothing can be done"],"c":2,"w":["A two-percent error rate sounds small until you notice which two percent it is. Errors that flip a meaning are categorically different from errors that drop a word, because the transcript will be quoted as though it said what it appears to say.","Do percent galti chhoti lagti hai jab tak aap na dekhein ke kaunse do percent hain. Jo galti matlab ulat de woh lafz chhorne wali galti se bilkul alag hai — kyunke transcript aise quote hoga jaise woh wahi keh raha ho.","دو فیصد غلطی چھوٹی لگتی ہے جب تک دیکھیں کون سے دو فیصد ہیں۔ معنی پلٹنے والی غلطی الگ قسم کی ہے۔"]},
{"d":"D1","q":"A team lead must produce a project brief for three different audiences — engineers, executives and the client — from one source document.","a":"What should the delegation specify?","o":["Each audience, what that audience needs to decide, and the length and format for each version","That the output should be professional and clear","Only the source document and the word “brief”","That the model should produce three documents"],"c":0,"w":["Three audiences means three outcomes, not one task run three times. Stating what each reader must decide is what makes the versions differ meaningfully; without it the model produces the same brief with a different opening sentence.","Teen audiences matlab teen nateeje, ek kaam teen baar nahi. Ye batana ke har padhne wale ko kya faisla karna hai, hi versions ko waqai mukhtalif banata hai.","تین سامعین مطلب تین نتائج۔ یہ بتانا کہ ہر قاری کو کیا فیصلہ کرنا ہے، ہی نسخوں کو مختلف بناتا ہے۔"]},
{"d":"D3","q":"A design agency needs accessibility descriptions for 12,000 product photographs, generated nightly.","a":"Which approach fits?","o":["A designer writes each description in a chat window","A model with a larger context window","A searchable spreadsheet of colour codes","A scheduled programmatic workflow that submits each image and stores the returned description"],"c":3,"w":["Nightly volume at that scale rules out interactive use entirely. The shape of the task — many small independent items, produced on a schedule, stored somewhere — is what determines the solution, before any model is chosen.","Us paimana pe har raat ka kaam interactive istemal ko namumkin kar deta hai. Kaam ki shakal — bohat si chhoti alag cheezein, waqt pe, kisi jagah store honi — hi hal tay karti hai.","اُس پیمانے پر ہر رات کا کام متعامل استعمال ناممکن کرتا ہے۔"]},
{"d":"D4","q":"A bank's AI loan pre-screener is faster than the manual process it replaced, but it declines applicants with thin credit files far more often than humans did.","a":"What should be examined?","o":["How many applications arrive each day","The model's speed","Whether the pattern reflects a real credit signal or an artefact of what the model treats as missing data","The interface used by the loan officers"],"c":2,"w":["The system is working as designed and producing a different outcome — which is exactly the case worth investigating. A model reading an unconventional file as absent may be encoding a bias rather than detecting a risk.","System design ke mutabiq chal raha hai magar nateeja alag de raha hai — yehi woh soorat hai jise dekhna chahiye. Model ghair-mutadil file ko ghair-hazir samajh kar bias daal sakta hai, risk detect nahi kar raha.","نظام ڈیزائن کے مطابق چل رہا ہے مگر نتیجہ مختلف ہے۔ غیر معمولی فائل کو غائب سمجھ کر تعصب شامل ہو سکتا ہے۔"]},
{"d":"D2","q":"An AI meeting summary reports: “the client approved the timeline.” The recording shows the client said “the timeline works for now.”","a":"How serious is this difference?","o":["Irrelevant, since the meeting ended positively","A transcription artefact with no consequence","Minor — both statements are broadly positive","Material — approval is a commitment and “for now” is provisional, which changes what the team may act on"],"c":3,"w":["The summary converted a provisional remark into an approval, and the team will plan against the stronger version. Summary tools fail most dangerously not by inventing facts but by hardening soft ones.","Summary ne aarzi baat ko approval bana diya, aur team us sakht version pe plan karegi. Summary tools sabse khatarnak tab fail hote hain jab woh narm baat ko sakht kar dete hain.","خلاصے نے عارضی بات کو منظوری بنا دیا۔ خلاصہ اوزار نرم بات کو سخت کر کے سب سے زیادہ خطرہ دیتے ہیں۔"]},
{"d":"D5","q":"A team wants every agent response to use the company's formal register and its specific internal terminology.","a":"Where does this belong?","o":["Nowhere; tone cannot be specified","In each prompt, described from memory","In stored configuration — a reusable instruction the agent applies to every relevant task","In the recipient's name field"],"c":2,"w":["Register and terminology are standing rules, not per-task details. Putting them in configuration means one definition governs everything and one change propagates everywhere, which is impossible when the rule is retyped.","Register aur terminology permanent rules hain, per-task tafseel nahi. Configuration mein rakhne se ek tareef sab kuch chalahi hai aur ek tabdeeli har jagah lagti hai.","لہجہ اور اصطلاحات مستقل قواعد ہیں۔ ترتیب میں رکھنے سے ایک تعریف سب پر چلتی ہے۔"]},
{"d":"D1","q":"A user's instruction is simply “make this shorter”. The model cuts a paragraph containing a required legal disclosure.","a":"What was the delegation failure?","o":["The user should have used a different model","“Shorter” specified the change but not what must be preserved, so the model cut on length alone","The document was too long for the context window","The model does not understand legal language"],"c":1,"w":["Instructions about a change must carry two parts: what to change and what is protected. Given only a direction, the model optimises the stated variable — here, length — and is indifferent to everything unstated.","Badlav wali hidayat ke do hisse hone chahiye: kya badalna hai aur kya bachana hai. Sirf ek simt dene pe model wohi variable behtar karta hai jo bataya gaya — yahan lambai — aur baqi se be-parwah rehta hai.","تبدیلی کی ہدایت کے دو حصے ہوتے ہیں: کیا بدلنا ہے اور کیا بچانا ہے۔"]},
{"d":"D4","q":"A team automates invoice reconciliation. The workflow flags mismatches correctly, but no one decided what happens to a flagged item.","a":"What is the design gap?","o":["The workflow runs too slowly","The model is not accurate enough","The invoices should be fewer","The exception path was never designed, so flagged items have no owner and no next step"],"c":3,"w":["Automating the happy path is half a design. Every flag the system raises is a promise that someone will act on it; without a defined owner and route, the automation creates work it cannot finish.","Happy path automate karna aadha design hai. System ka har flag ye wada hai ke koi us pe amal karega — bina malik aur raaste ke automation aisa kaam banata hai jo woh khud khatam nahi kar sakta.","خوش کن راستہ خودکار کرنا آدھا ڈیزائن ہے۔ بغیر مالک کے خودکاری ایسا کام بناتی ہے جو خود ختم نہیں کر سکتی۔"]},
{"d":"D2","q":"An AI tool generates a chart from sales data. The chart is visually clean and well labelled, but the vertical axis begins at 95%, so a 2% change reads as a cliff.","a":"Why does this matter?","o":["The visual encoding misrepresents the magnitude of the change, which is the only thing the chart exists to convey","The colours are inappropriate","The chart should have used a pie format","Charts are decorative and the data is correct"],"c":0,"w":["A chart is a claim about proportion, and its axis is the claim. A truncated axis does not make the numbers wrong — it makes the reading of them wrong, which is harder to catch because the underlying data checks out.","Chart proportion ka dawa hai, aur uski axis hi woh dawa hai. Truncated axis numbers ghalat nahi karti — unka padhna ghalat karti hai, aur ye pakadna mushkil hai kyunke data durust hota hai.","چارٹ تناسب کا دعویٰ ہے، اور اس کا محور ہی دعویٰ ہے۔"]},
{"d":"D3","q":"A team needs an assistant that answers questions over 500 internal PDFs, with each answer pointing to the page it came from.","a":"Which capability is the deciding factor?","o":["The model's parameter count","A longer maximum output length","Faster response times","Retrieval that can locate relevant passages and return a reference to their source"],"c":3,"w":["Half a terabyte of documents will never fit in a prompt, and pasting excerpts by hand loses the provenance the answer needs. Retrieval is what makes both the coverage and the citation possible at once.","Itne documents prompt mein kabhi nahi aayenge, aur haath se hisse paste karne se woh sanad chhut jati hai jo jawab ko chahiye. Retrieval hi coverage aur citation dono mumkin banata hai.","اتنی دستاویزات پرامپٹ میں کبھی نہیں آئیں گی۔ ریٹریول ہی احاطہ اور حوالہ دونوں ممکن بناتا ہے۔"]},
{"d":"D5","q":"A team's knowledge source contains three versions of the same policy document, with no dates and no indication which is current.","a":"What is the consequence?","o":["The agent may cite a superseded policy with full confidence, and nothing in the output reveals which version it used","None, as long as the content is similar","The source will load more slowly","The agent will average the three versions"],"c":0,"w":["Ambiguity in a knowledge source becomes false confidence in the output. The agent cannot prefer a version it cannot identify, so it may answer correctly or incorrectly, and the citation will look equally solid either way.","Knowledge source mein ibham output mein jhoota bharosa ban jata hai. Agent us version ko tarjeeh nahi de sakta jise pehchan na sake, aur citation dono soorat mein ek jaisi mazboot lagegi.","علم کے ماخذ میں ابہام آؤٹ پٹ میں جھوٹا بھروسہ بنتا ہے۔"]},
{"d":"D4","q":"A team automates handoffs between two departments. The receiving team starts each case without knowing why it was escalated.","a":"What is missing from the workflow?","o":["A shared calendar","More automation in the sending department","A faster notification","The reason for the handoff, carried with the case itself"],"c":3,"w":["A handoff without a reason forces the receiving team to reconstruct the context the system already had. The information existed at the moment of escalation; the design simply failed to carry it across the boundary.","Bina wajah ke handoff receiving team ko woh context dobara banana parta hai jo system ke paas pehle se tha. Maloomat escalation ke waqt maujood thi; design ne usay hadd ke paar nahi bheja.","بغیر وجہ کے حوالگی وصول کرنے والی ٹیم کو سیاق دوبارہ بنانا پڑتا ہے۔"]},
{"d":"D1","q":"A user asks for “a few ideas” and receives forty.","a":"What went wrong?","o":["A vague quantity was left to the model's interpretation, and the deliverable was never bounded","The model is over-productive by nature","The temperature setting was too high","The model requires a longer prompt"],"c":0,"w":["“A few” is not a specification. When a count is left open the model optimises for generosity, and the user must now spend time reducing output they never asked for — the cost of an unbounded delegation.","“Kuch” koi specification nahi hai. Ginti khuli chhorne pe model zyada dene ko behtar samajhta hai, aur user ko woh output kam karna parta hai jo usne maanga bhi nahi tha.","”کچھ“ کوئی تفصیل نہیں۔ تعداد کھلی چھوڑنے پر ماڈل زیادہ دینا بہتر سمجھتا ہے۔"]},
{"d":"D2","q":"A bilingual employee reviews an AI translation. The tone and meaning are correct, but a product name has been translated into the local language.","a":"How should this be classified?","o":["A translation of minor importance","A brand-compliance failure — proper nouns are protected, and the error is invisible to anyone who does not know the rule","An improvement in accessibility","A harmless stylistic choice"],"c":1,"w":["This is the class of error that survives every general check, because the sentence reads perfectly well. Only someone holding the specific rule can catch it, which is why protected terms belong in configuration rather than in reviewers' heads.","Ye woh galti hai jo har aam check se bach jati hai, kyunke jumla bilkul theek padha jata hai. Sirf wohi pakad sakta hai jise khaas rule pata ho — isi liye protected terms configuration mein hone chahiye.","یہ وہ غلطی ہے جو ہر عام جانچ سے بچ جاتی ہے، کیونکہ جملہ بالکل ٹھیک پڑھا جاتا ہے۔"]},
{"d":"D6","q":"A company proposes using an AI agent to monitor employee chat messages for signs of disengagement.","a":"What is the threshold question?","o":["Whether the model can process that many messages","Which sentiment model performs best","Whether continuous surveillance of private communications is a proportionate and legitimate use at all","How much storage the logs require"],"c":2,"w":["Some uses are decided before they are designed. Monitoring private communications changes the relationship between employer and employee regardless of accuracy, and no technical refinement resolves a question of legitimacy.","Kuch istemal design se pehle tay hote hain. Zaati baaton ki nigrani accuracy se qat-e-nazar employer aur employee ke talluq ko badal deti hai, aur koi technical behtari jaiz hone ka sawal hal nahi karti.","کچھ استعمال ڈیزائن سے پہلے طے ہوتے ہیں۔ نجی باتوں کی نگرانی تعلق کو بدل دیتی ہے۔"]},
{"d":"D3","q":"A team's task is to read a 300-page standards document and answer narrow, specific questions from it accurately.","a":"Which capability matters most?","o":["A very long output limit","A creative writing style","Accurate retrieval of the relevant passage, so the answer is drawn from the right part of the document","Fast response generation"],"c":2,"w":["When the document fits but the answer is narrow, the difficulty is finding the right page, not generating text. Retrieval quality decides whether the answer is grounded or merely plausible.","Jab document fit ho jaye magar jawab tang ho, mushkil sahi safha dhoondna hai, text likhna nahi. Retrieval ki quality tay karti hai jawab grounded hoga ya sirf plausible.","جب دستاویز فٹ ہو جائے مگر جواب تنگ ہو، مشکل صحیح صفحہ ڈھونڈنا ہے۔"]},
{"d":"D7","q":"A workflow is producing duplicate actions: some customers receive two confirmation emails for a single order.","a":"What should be investigated?","o":["The email template wording","The customer database size","Whether a retry or error-handling path is re-executing an action that already succeeded","The email provider's reliability"],"c":2,"w":["Duplicated side effects are the signature of a retry that is not idempotent. The operation was repeated because something upstream looked like a failure; the fix belongs in the workflow's retry logic, not in the message content.","Duplicate actions ek aise retry ki nishani hain jo idempotent nahi. Amal dohraya gaya kyunke oopar kuch fail lagta raha; fix retry logic mein hai, message mein nahi.","دوہرے اثرات اُس ری ٹرائی کی نشانی ہیں جو idempotent نہیں۔"]},
{"d":"D2","q":"A team uses AI to draft code review comments. One comment is technically correct in general, but refers to a function that does not exist in the repository.","a":"What kind of failure is this?","o":["A stylistic disagreement","A performance concern","A hallucinated reference — the comment is plausible, specific and false, and would mislead the reviewer it is aimed at","An acceptable simplification"],"c":2,"w":["The specific naming makes it credible, and the reviewer has no reason to doubt a comment written in their own domain language. Hallucinated specifics are most dangerous exactly where the reader lacks the time to check.","Specific naam isay yaqeeni banate hain, aur reviewer ke paas apni zubaan mein likhe comment pe shak karne ki wajah nahi. Banayi hui tafseel wahan sabse khatarnak hoti hai jahan check karne ka waqt na ho.","مخصوص نام اسے یقینی بناتا ہے، اور جائزہ لینے والے کے پاس شک کی وجہ نہیں۔"]},
{"d":"D1","q":"A manager assigns the same recurring weekly task to the model, retyping the entire background context every Monday.","a":"What would improve this?","o":["Asking the model to remember last week","Using a larger model for the task","Writing a longer prompt each Monday","Storing the standing context once as configuration, so each week's prompt carries only what changed"],"c":3,"w":["Context that never changes should not be retyped. Separating the standing instructions from the weekly input makes the prompt shorter, the output more consistent, and the standing context editable in one place.","Jo context kabhi nahi badalta woh dobara type nahi karna chahiye. Permanent hidayat ko hafta-war input se alag karne se prompt chhota, output consistent aur context ek jagah editable ho jata hai.","جو سیاق کبھی نہیں بدلتا وہ دوبارہ ٹائپ نہیں کرنا چاہیے۔"]},
{"d":"D4","q":"A team automates data entry from scanned forms. The forms arrive in three different layouts.","a":"What must the design handle?","o":["All three layouts, with routing or extraction logic matched to each and an exception path for the rest","Whatever layout the model encounters first","Only the most common layout","A single layout chosen for consistency"],"c":0,"w":["A form that cannot be parsed will not announce itself; it will produce a record with fields quietly missing. Designing for the known variation and routing the unknown to a human is what keeps the data trustworthy.","Jo form parse nahi ho sakta woh batata nahi; woh aisa record banata hai jiske fields chupke se khaali hote hain. Jaani hui variation ke liye design karna aur anjaani human ko dena hi data ko bharose layak rakhta hai.","جو فارم پڑھا نہ جا سکے وہ بتاتا نہیں؛ وہ خاموشی سے ادھورا ریکارڈ بناتا ہے۔"]},
{"d":"D5","q":"A company connects the agent to its live CRM so it can read current account status.","a":"What does this primarily change?","o":["The model's underlying capability","It increases the context window","It removes the need to check anything","The agent answers from current system data instead of from what a user typed or the model recalls"],"c":3,"w":["A connector changes the source of truth, not the intelligence. Its value is that the answer now tracks reality, and its risk is that reality keeps moving — so the freshness of what was read still matters.","Connector sach ka source badalta hai, samajh nahi. Faida ye hai ke jawab haqeeqat se juray rehta hai, aur khatra ye ke haqeeqat badalti rehti hai — is liye padhi gayi cheez ki tazgi aham rehti hai.","کنیکٹر سچ کا ماخذ بدلتا ہے، سمجھ نہیں۔"]},
{"d":"D6","q":"An AI system filters incoming job applications. It was trained on the company's historical hiring decisions.","a":"What risk does this carry?","o":["It will require more storage","It will reproduce whatever bias shaped past hiring, and present it as an objective score","None, since the history reflects company standards","It will be slower than manual screening"],"c":1,"w":["Learning from past decisions means learning the reasons those decisions were made, including the ones nobody would defend. The output arrives as a number, which strips the bias of its context and makes it harder to challenge.","Purane faislon se seekhna un faislon ki wajahon ko seekhna hai, un ko bhi jo koi defend na kare. Output ek number ban kar aata hai, jo bias ka context khatam kar deta hai aur challenge karna mushkil bana deta hai.","پرنے فیصلوں سے سیکھنا اُن وجوہات کو سیکھنا ہے۔ آؤٹ پٹ عدد بن کر آتا ہے جو تعصب چھپا دیتا ہے۔"]},
{"d":"D2","q":"A user asks the model to compare two products. The response is detailed and enthusiastic about one of them, and never mentions the other.","a":"What is the defect?","o":["A coverage failure — the deliverable was a comparison and only one side of it exists","The second product is inferior","The prompt used the wrong keywords","A harmless emphasis"],"c":0,"w":["The task was relational, and the output is not. This kind of gap is easy to miss because everything present is accurate; the error is in what is absent, and absence does not advertise itself.","Kaam do cheezon ka talluq tha, aur output nahi hai. Aisa khala pakadna mushkil hai kyunke jo maujood hai woh durust hai; galti us mein hai jo nahi hai, aur kami khud batati nahi.","کام دو چیزوں کا تعلق تھا، اور آؤٹ پٹ نہیں ہے۔ غلطی اُس میں ہے جو نہیں ہے۔"]},
{"d":"D3","q":"A team needs an assistant to answer questions about regulations that are revised every quarter.","a":"What does this requirement determine?","o":["The assistant must be rebuilt each quarter","The model must be larger","The regulations must be supplied as a maintained, retrievable source rather than relied on from training data","The questions should be asked less often"],"c":2,"w":["Any fact that changes on a schedule cannot live in model weights and stay true. The design question is therefore about who maintains the source and how quickly a revision reaches it — not about model capability.","Jo baat waqt ke saath badalti hai woh model ke andar sach nahi reh sakti. Design ka sawal ye hai ke source kaun maintain karega aur tabdeeli kitni jaldi pohnchegi — model ki taqat ka nahi.","جو بات وقت کے ساتھ بدلتی ہے وہ ماڈل کے اندر سچ نہیں رہ سکتی۔"]},
{"d":"D4","q":"A team automates a customer process end to end. After launch, throughput rises sharply but complaints about tone increase.","a":"What was overlooked?","o":["The number of staff required","The model's accuracy","The server capacity","The qualitative dimension of the work — speed improved while the experience the automation produced got worse"],"c":3,"w":["Throughput is the easiest measure and therefore the one an automation is optimised against. The complaints are the real signal that the workflow was designed to a number rather than to the outcome it was meant to produce.","Throughput sabse aasan paimana hai, is liye automation usi ki taraf bhagti hai. Shikayatein asli ishara hain ke workflow outcome ke liye nahi, ek number ke liye design hua tha.","تھروپٹ سب سے آسان پیمانہ ہے، اس لیے خودکاری اسی طرف بھاگتی ہے۔"]},
{"d":"D6","q":"A startup deploys an agent authorised to issue refunds under fifty dollars without human review.","a":"What must accompany this delegation?","o":["A promise to review the policy at some point","A record of every refund, a way to detect misuse, and a defined point at which it escalates","A faster refund path","Nothing beyond the limit itself"],"c":1,"w":["A spending authority is only safe when it is observable. The dollar limit bounds a single transaction; logging bounds the total, and an escalation rule bounds the cases the limit was never meant to cover.","Kharch ka ikhtiyar sirf tab mehfooz hai jab woh dekhne mein aaye. Dollar limit ek transaction bandhti hai; logging total bandhta hai, aur escalation rule un cases ko jo limit ne cover nahi kiye.","اخراجات کا اختیار صرف اُس وقت محفوظ ہے جب مشاہدے میں ہو۔"]},
{"d":"D2","q":"An AI-drafted email is well structured and professional, but greets the recipient by the wrong name.","a":"How should this be weighed?","o":["Cosmetically minor, since the content is right","Acceptable if the recipient is known","Disqualifying — the error is in the most visible position and signals that the draft was never checked","A template problem with no real impact"],"c":2,"w":["The first line is where the reader decides whether the message was written for them. An error there costs more trust than the same error buried in a paragraph, and it advertises the absence of a review step.","Pehli line pe hi padhne wala faisla karta hai ke message uske liye likha gaya tha ya nahi. Wahan ki galti us galti se zyada bharosa todti hai jo paragraph mein chhipi ho.","پہلی سطر پر ہی قاری فیصلہ کرتا ہے۔"]},
{"d":"D5","q":"A team stores its 200 most-used prompts in a shared repository, each with a named owner and a change history.","a":"What does this achieve?","o":["Lower token cost","Fewer prompts overall","Faster model responses","A reviewable, versioned prompt library, so improvements are shared and mistakes can be traced to the edit that caused them"],"c":3,"w":["Prompts are configuration and drift like any other. Ownership and history turn an invisible practice into something that can be improved deliberately and, when output degrades, diagnosed rather than guessed at.","Prompts configuration hain aur har configuration ki tarah badalte hain. Malik aur history ek chhipi hui aadat ko aisi cheez banate hain jise behtar kiya ja sake, aur galti pe andaza nahi, diagnosis ho.","پرامپٹ ترتیب ہیں اور بدلتے رہتے ہیں۔"]},
{"d":"D1","q":"A user's prompt assigns a role — “you are a senior auditor” — but supplies no criteria for the specific task.","a":"What will the role alone achieve?","o":["It will guarantee expert-level output","It will prevent hallucination","It replaces the need for examples","It sets a tone and a perspective, but decides nothing about what a good answer to this task looks like"],"c":3,"w":["A role shapes how the model writes, not what it is trying to achieve. The criteria for a correct answer have to be stated separately; assuming the persona supplies them is where this style of prompt quietly fails.","Role tay karta hai ke model kaise likhega, ye nahi ke woh kis nateeje ki koshish kar raha hai. Sahi jawab ka mayaar alag se batana parta hai.","کردار طے کرتا ہے ماڈل کیسے لکھے گا، یہ نہیں کہ کیا حاصل کرنا ہے۔"]},
{"d":"D6","q":"A company uses AI to generate job descriptions and publishes them without review for exclusionary language.","a":"What is the effect?","o":["Roles of exclusionary wording are reproduced at scale and given the authority of an official posting","The postings will attract fewer applicants overall","The postings will be shorter","No effect, since the language is generated automatically"],"c":0,"w":["Scale is the harm. Wording that would once have appeared in one advert now appears in every advert, consistently, and carries the employer's name — so nobody downstream treats it as something to question.","Nuqsan scale hai. Jo alfaz pehle ek ishtihaar mein aate the woh ab har ishtihaar mein, har baar, aur employer ke naam ke saath aate hain — to koi unhein shak ki nazar se nahi dekhta.","نقصان پیمانہ ہے۔ جو الفاظ پہلے ایک اشتہار میں آتے تھے وہ اب ہر اشتہار میں آتے ہیں۔"]},
{"d":"D3","q":"A team is deciding between fine-tuning a model on their data and using a general model with well-written instructions and retrieval.","a":"What should drive the decision?","o":["Whether the task requires knowledge (which retrieval supplies) or a specific behaviour and format (which is what fine-tuning shapes)","Which option is more modern","Fine-tuning is always better","Which one uses fewer tokens"],"c":0,"w":["These are different tools for different problems. Retrieval adds facts that change; fine-tuning shapes stable behaviour. Choosing by preference rather than by which gap actually exists wastes both effort and quality.","Ye do alag maslon ke do alag auzaar hain. Retrieval woh facts deta hai jo badalte hain; fine-tuning stable behaviour banata hai. Pasand se chunna mehnat aur quality, dono zaya karta hai.","یہ دو مختلف مسائل کے دو مختلف اوزار ہیں۔"]},
{"d":"D4","q":"A workflow has been automated, but the human approval step added to it now takes longer than the manual work it replaced.","a":"What does this indicate?","o":["The approval step was bolted on without being designed, so the workflow's total shape is worse than the manual process","The model is too slow","Approvals should be removed entirely","The automation was unnecessary"],"c":0,"w":["The bottleneck moved rather than disappeared. Review belongs at the point where it changes the outcome; placed at a point where it only adds delay, it converts a design flaw into a queue.","Bottleneck khatam nahi hua, jagah badal li. Review wahan hona chahiye jahan woh nateeja badalta hai; sirf der badhane wali jagah pe rakhne se design ki khami queue ban jati hai.","رکاوٹ ختم نہیں ہوئی، جگہ بدل لی۔"]},
{"d":"D2","q":"An AI tool produces meeting notes that correctly capture all decisions but attribute one statement to an attendee who was not present.","a":"Why is this worse than a routine error?","o":["It is not worse; the decisions are all correct","It manufactures evidence about a person, and the note will be treated as a reliable record of what they said","It makes the note longer than necessary","It shows the model needs a larger context window"],"c":1,"w":["Attributing words to a named person is a claim about that person, not about the meeting. The note looks complete and will be trusted, so the fabrication may never be examined — and it may later be cited against them.","Kisi kaam ka bayan kisi naam wale banda se jorna us banda ke baare mein dawa hai, meeting ke baare mein nahi. Note mukammal lagta hai aur us pe bharosa hoga, to banana hua bayan kabhi check bhi nahi hoga.","کسی کے بارے میں بات دوسرے سے جوڑنا اُس شخص کے بارے میں دعویٰ ہے۔"]},
{"d":"D7","q":"A team's agent performs well for one department and poorly for another, using exactly the same configuration.","a":"What should be examined first?","o":["Whether the model is unreliable","Whether the two departments' tasks or inputs actually differ, so the shared configuration only fits one of them","Whether a newer model is available","Which department complained first"],"c":1,"w":["Identical configuration and different outcomes means the inputs are not identical. The apparent contradiction dissolves once you look at what each department actually asks for — which is why the comparison has to be made before the config is changed.","Ek hi configuration aur alag nateeje matlab inputs ek jaise nahi hain. Ye ikhtilaf us waqt khatam ho jata hai jab dekhein ke har department asal mein kya mangta hai.","ایک ہی ترتیب اور مختلف نتائج مطلب ان پٹ ایک جیسے نہیں ہیں۔"]},
{"d":"D5","q":"A team adds a document to the agent's knowledge source, not realising it is an early draft that was later rewritten.","a":"What is the risk?","o":["The agent may answer from a superseded draft while citing it as though it were authoritative","The agent will average the draft with the final version","The agent will refuse to use it","The knowledge base will load more slowly"],"c":0,"w":["The citation will look valid because the document exists, which is exactly what makes the error hard to spot. Curating what enters a knowledge source is part of maintaining it — an uncatalogued source is an unverified one.","Citation jaiz lagegi kyunke document maujood hai — yahi is galti ko pakadna mushkil banata hai. Knowledge source mein kya jaata hai ye tay karna us ko maintain karne ka hissa hai.","حوالہ درست لگے گا کیونکہ دستاویز موجود ہے — یہی غلطی پکڑنا مشکل بناتا ہے۔"]},
{"d":"D6","q":"A hospital wants AI to summarise patient records to support discharge planning.","a":"Which governance condition applies?","o":["Only that the model is fast enough for ward rounds","That a clinician reviews the summary before it informs care, and that the patient's data is handled lawfully","Only that the summary is accurate","Only that the summary is written in plain language"],"c":1,"w":["The summary supports a clinical decision, so its accuracy is necessary but not sufficient. The review point and the lawful basis are separate obligations that accuracy cannot substitute for, and both must be settled before deployment.","Summary clinical faisle ko support karta hai, is liye accuracy zaroori hai magar kaafi nahi. Review point aur qanooni bunyaad alag zimmedariyan hain jinhe accuracy puri nahi kar sakti.","خلاصہ طبی فیصلے کی معاونت کرتا ہے، اس لیے درستگی ضروری ہے مگر کافی نہیں۔"]},
{"d":"D7","q":"An agent's responses have become noticeably shorter over the course of a week, with no configuration change.","a":"What is the correct approach?","o":["Ask the agent why it is being brief","Increase the maximum output length","Assume the model has degraded and switch to a different one","Establish what actually changed — the prompts in use, the knowledge source, or the data being supplied"],"c":3,"w":["Gradual change with a constant component points at something else in the system that has drifted. Jumping to a model swap replaces a working component and leaves the real cause in place, where it will reappear.","Component wohi hai magar rafta rafta tabdeeli — matlab system mein koi doosri cheez badal rahi hai. Model badalna ek chalte hue hisse ko phenk dena hai aur asal wajah wahi rehti hai.","رفتہ رفتہ تبدیلی مطلب نظام میں کوئی اور چیز بدل رہی ہے۔"]},
{"d":"D1","q":"A prompt asks for “a comprehensive analysis” but never says what decision the analysis is meant to support.","a":"What is the consequence?","o":["The output will be too short","The model will ask what the decision is","The model will refuse the task","The analysis will be broad but undirected, covering everything and informing nothing"],"c":3,"w":["Analysis is only comprehensive relative to a question. Without the decision named, the model has no basis for judging what is relevant, so it includes everything — which is a way of being unhelpful at length.","Analysis sirf kisi sawal ke hawale se comprehensive hoti hai. Faisla bataye baghair model ke paas ye tay karne ki bunyaad nahi ke kya mutaliq hai, to woh sab kuch daal deta hai.","تجزیہ صرف کسی سوال کے حوالے سے جامع ہوتا ہے۔"]},
{"d":"D3","q":"A team needs an agent that visits a supplier's public website and extracts current pricing into a structured table.","a":"What does this require?","o":["A fine-tuned model trained on the supplier's data","A model with a larger context window","An agent that can browse and extract, paired with a structured output format","A faster network connection"],"c":2,"w":["The information exists only on a live page that nobody controls and that changes without notice. Browsing supplies the access and structured output supplies the usability; neither alone is sufficient.","Maloomat sirf ek zinda safhe pe hai jise koi control nahi karta aur jo bina ittila badalta hai. Browsing access deta hai aur structured output faida-mand banata hai.","معلومات صرف ایک زندہ صفحے پر ہیں جو بغیر اطلاع بدلتا ہے۔"]},
{"d":"D4","q":"A team automating a claims process finds a step that requires judgement on genuinely ambiguous cases.","a":"What is the right design response?","o":["Remove the ambiguous cases from the process","Automate it anyway and accept the errors","Automate the clear cases and route ambiguous ones to a human, with the reason for the routing","Replace the human with a second model"],"c":2,"w":["The step is not a defect to be engineered away; it is a boundary. Automating up to the boundary and handing off at it is the design that keeps the gains of automation without pretending the judgement has been removed.","Ye step koi kharabi nahi jise hata dena chahiye; ye ek hadd hai. Hadd tak automate karna aur wahan human ko dena woh design hai jo faida rakhta hai bina ye maane ke judgement khatam ho gaya.","یہ مرحلہ کوئی خرابی نہیں؛ یہ ایک حد ہے۔"]},
{"d":"D2","q":"An AI-drafted proposal contains a delivery commitment — “shipped within ten days” — that the sales lead never agreed to.","a":"How should this be handled?","o":["Leave it, since proposals are not contracts","Treat it as a material commitment that must be removed or explicitly approved before the proposal leaves the building","Adjust the number to something safe and send","Add a disclaimer that dates are approximate"],"c":1,"w":["A proposal is the organisation speaking to a client, and the terms in it shape the negotiation whether or not they are binding. An invented commitment is the Trusting Move arriving through the back door — it looks like content but functions as authority.","Proposal organisation ki taraf se client se baat hai, aur uske terms negotiation banate hain, chahe binding hon ya nahi. Banaya hua commitment peeche ke darwaze se aane wala Trusting Move hai.","تجویز ادارے کی طرف سے بات ہے، اور اس کی شرائط مذاکرات بناتی ہیں۔"]},
{"d":"D6","q":"A company plans to have AI generate written performance feedback that managers will deliver to staff.","a":"What must be decided first?","o":["How long the feedback should be","Whether the feedback should be formal or informal","What the manager is accountable for in that feedback, and how the employee can respond to it","Which model writes the most natural prose"],"c":2,"w":["The feedback carries a person's standing in the organisation, and that judgement belongs to a human who can be questioned. Generating it wholesale moves accountability onto a system that cannot answer for itself.","Feedback kisi ki izzat se jurra hai, aur woh faisla aise human ka hai jise sawal kiya ja sake. Poora likhwa dena zimmedari aise system pe daalna hai jo jawab nahi de sakta.","فیڈبیک کسی کے مرتبے سے جڑا ہے، اور یہ فیصلہ اُس انسان کا ہے جس سے پوچھا جا سکے۔"]},
{"d":"D5","q":"A team notices the agent ignores a section of the knowledge base entirely, even when the question depends on it.","a":"What should be investigated?","o":["How that section is stored and indexed — whether it is reachable by retrieval at all","The length of the user's question","The model's willingness to cooperate","The speed of the connection"],"c":0,"w":["Content that is never surfaced behaves as though it does not exist. The first question is whether the material is actually retrievable in the form it was stored, before considering the model at all.","Jo content kabhi saamne nahi aata woh maujood hi nahi hota. Pehla sawal ye hai ke material us shakal mein retrievable hai ya nahi, model ka sawal baad mein.","جو مواد کبھی سامنے نہ آئے وہ موجود ہی نہیں۔"]},
{"d":"D4","q":"A team automates a process without mapping it first. The automation faithfully reproduces a step that the team had already stopped doing years ago.","a":"What does this illustrate?","o":["The process was too complex to automate","Automating an unexamined process preserves its flaws and gives them authority","The model made an error","The team needs a larger model"],"c":1,"w":["Automation is not improvement; it is preservation at speed. Making a step automatic removes the friction that would eventually have caused someone to question it, which is why the map has to come before the build.","Automation behtari nahi, raftar ke saath tahaffuz hai. Step ko automatic karne se woh rok khatam ho jati hai jo ek din us pe sawal utha deti, is liye naqsha pehle banta hai.","خودکاری بہتری نہیں، رفتار کے ساتھ تحفظ ہے۔"]},
{"d":"D2","q":"An AI summary records that a decision was “unanimous”, when the minutes show two members abstained.","a":"What has occurred?","o":["A rounding of the language for brevity","A transcription problem","An acceptable simplification of a long meeting","A substantive error — unanimity and majority are different outcomes with different consequences"],"c":3,"w":["Abstention is a position, and turning it into agreement erases the only record that anyone declined to support the decision. The summary has not shortened the meeting; it has changed its result.","Abstain karna bhi ek position hai, aur usay ittefaq bana dena woh wahid record mita deta hai ke kisi ne himayat nahi ki. Summary ne meeting chhoti nahi ki, uska nateeja badal diya.","اجتناب بھی ایک موقف ہے، اور اسے اتفاق بنانا واحد ریکارڈ مٹا دیتا ہے۔"]},
{"d":"D6","q":"An agent is asked to summarise an incident report that names affected customers.","a":"What should be established before the summary is circulated?","o":["Only that the summary is accurate","Only which model produces the best prose","Who needs the summary, whether the names are necessary for them, and what the organisation is permitted to share","Only how quickly the summary can be produced"],"c":2,"w":["The report exists for a purpose, and the summary widens its audience. Necessity and permission are separate questions from accuracy, and a correct summary can still be an unlawful or harmful one.","Report ka ek maqsad hai, aur summary uska audience barha deti hai. Zaroorat aur ijazat accuracy se alag sawal hain — durust summary bhi ghalat ya nuqsan-deh ho sakti hai.","رپورٹ کا ایک مقصد ہے، اور خلاصہ اس کے قاری بڑھا دیتا ہے۔"]},
{"d":"D1","q":"A user wants the model to argue against a position, not merely to agree with it.","a":"How should this be instructed?","o":["Ask twice and compare the answers","Explicitly request the strongest counterarguments, so the model is not simply validating what the user already believes","Ask the model to be balanced","Increase the model's creativity"],"c":1,"w":["Models default toward agreement, so agreement must be actively countermanded. Naming the specific task — produce the strongest case against this — is what converts a request for reassurance into a useful test of the idea.","Models ittefaq ki taraf jhukte hain, is liye ittefaq ko saaf mana karna parta hai. Khaas kaam batana — iske khilaf sabse mazboot dalil do — hi tasalli ki darkhwast ko fikr ka imtihan banata hai.","ماڈل اتفاق کی طرف جھکتے ہیں، اس لیے اتفاق کی صریح مخالفت کرنی پڑتی ہے۔"]},
{"d":"D3","q":"A team needs fast, inexpensive translation of internal working notes, which no one outside the team will read.","a":"Which approach is appropriate?","o":["A fast, low-cost model, because the content is internal and errors are cheap to correct","The highest-quality model available, on every note","No translation, to avoid errors","Manual translation by a professional"],"c":0,"w":["Model choice follows consequence. Where the reader is internal, the stakes are low and the volume is high, seeking maximum quality pays for capability the task cannot use — while the latency and cost are paid every time.","Model ka chunav nateeje ka faisla hai. Jahan padhne wala andar ka ho, khatra kam aur volume zyada, wahan maximum quality us taqat ki qeemat deti hai jo kaam use nahi kar sakta.","ماڈل کا انتخاب نتیجے کا فیصلہ ہے۔"]},
{"d":"D7","q":"A workflow's cost per run is roughly ten times what the team budgeted, though the outputs are correct.","a":"What should be examined first?","o":["The team's budget assumptions","The output length","What is being sent on each call — the input size, the number of calls, and any repeated context","Whether a cheaper model produces the same result"],"c":2,"w":["Ten times over budget with correct output points at volume, not quality. The usual cause is context that is resent on every call or a step that fans out into many more calls than the designer realised.","Sahi output ke saath das guna kharcha volume ki taraf ishara karta hai, quality ki nahi. Aam wajah ye hai ke context har call pe dobara bheja jata hai.","درست آؤٹ پٹ کے ساتھ دس گنا خرچ حجم کی طرف اشارہ کرتا ہے۔"]},
{"d":"D2","q":"An AI-generated list of action items from a meeting omits the one item that was assigned to the person who requested the list.","a":"Why is this particularly costly?","o":["The model needed a longer context window","The omission falls precisely on the reader's own responsibility, so they will act on a list that is wrong exactly where they most needed it to be right","It is not; the list is mostly complete","It makes the list shorter than expected"],"c":1,"w":["A missing item is always a gap, but a missing item that belongs to the reader is an unperformed task. Because the list looks complete, nothing prompts the reader to check — the failure is silent and lands on the person least able to spot it.","Ghayab item hamesha khala hai, magar padhne wale ka apna item chhut jana ek na-kiya gaya kaam hai. List mukammal lagti hai to koi check karne ki wajah nahi samajhta.","غائب آئٹم ہمیشہ خلا ہے، مگر قاری کا اپنا آئٹم چھوٹ جانا ایک نہ کیا گیا کام ہے۔"]},
{"d":"D5","q":"A team's stored instructions say “be concise”, but the task is legal review where every clause must be covered.","a":"What is the defect?","o":["A standing instruction written for a general context is being applied to a task it contradicts, and nothing overrides it","The task is unsuitable for AI","The model needs a longer output limit","The model is ignoring instructions"],"c":0,"w":["A rule that is right most of the time becomes wrong where it conflicts with the task. Standing configuration needs an explicit boundary or a task-level override, otherwise the default quietly wins over the requirement.","Jo rule aksar sahi hota hai woh wahan ghalat ho jata hai jahan kaam se takraye. Permanent configuration ko hadd ya task-level override chahiye, warna default chupke jeet jata hai.","جو قاعدہ عموماً درست ہوتا ہے وہ کام سے ٹکراؤ پر غلط ہو جاتا ہے۔"]},
{"d":"D4","q":"A team's automated report is accurate and consistently arrives on Monday morning, but the decision it supports is made on Friday afternoon.","a":"What is the design flaw?","o":["The workflow was never aligned to the decision it exists to serve, so its output always arrives after it can be used","The report should be shorter","The decision should be moved to Monday","The report takes too long to generate"],"c":0,"w":["Timeliness is part of correctness. A report that cannot influence its decision is a cost with no benefit, and the fault lies in the schedule — a design question — rather than in the analysis it contains.","Waqt pe hona bhi durustagi ka hissa hai. Jo report apne faisle pe asar nahi daal sakti woh kharch hai jiska koi faida nahi, aur galti schedule mein hai — ek design ka sawal.","وقت پر ہونا بھی درستگی کا حصہ ہے۔"]},
{"d":"D6","q":"A company gives an agent permission to post to its public social media account.","a":"What does this publish require?","o":["Only a content filter","A human approval step before posting, because publication is irreversible and speaks in the company's name","Only a well-written prompt","A faster posting schedule"],"c":1,"w":["Publication is the boundary case: it cannot be recalled, it reaches people who never consented to the interaction, and it carries the organisation's voice. That combination makes a human checkpoint mandatory rather than optional.","Publication hadd ka case hai: woh wapas nahi hoti, aise logon tak pohnchti hai jinhone ijazat nahi di, aur organisation ki awaaz rakhti hai — is liye human checkpoint lazmi hai.","اشاعت حد کا معاملہ ہے: واپس نہیں ہوتی، اور ادارے کی آواز رکھتی ہے۔"]},
{"d":"D2","q":"A model returns a confident answer citing a specific section number of an internal standard. The section number does not exist.","a":"What is the correct classification?","o":["A formatting error in the citation","A fabricated citation — specific and confident, which is precisely what makes it likely to be believed","A sign the standard has been updated","An acceptable paraphrase of a real section"],"c":1,"w":["Fabricated detail is dangerous in proportion to how checkable it looks. A vague claim invites verification; a section number looks like it has already been verified, and that appearance does the work of suppressing the check.","Banayi hui tafseel utni khatarnak hoti hai jitni check hone wali lagti hai. Dhundhla dawa check karne ko kehta hai; section number aisa lagta hai jaise check ho chuka hai.","بنائی تفصیل اُتنی خطرناک ہے جتنی جانچنے والی لگتی ہے۔"]},
{"d":"D7","q":"A workflow intermittently returns truncated JSON, always on longer responses.","a":"What is the likely cause?","o":["The model is producing invalid syntax","An output limit is being hit, silently cutting the response mid-structure with no error raised","The JSON parser is misconfigured","The input is malformed"],"c":1,"w":["The correlation with length locates the fault at a ceiling, not in the content. Because nothing errors, the truncation reaches consumers as malformed data — a failure that should be raised loudly is instead passed downstream.","Lambai se talluq batata hai ke masla ek hadd pe hai, content mein nahi. Koi error nahi aata, is liye kata hua output aage chala jata hai — jo galti zor se batani chahiye thi woh khamoshi se guzar jati hai.","لمبائی سے تعلق بتاتا ہے کہ مسئلہ ایک حد پر ہے۔"]},
{"d":"D1","q":"A user supplies a single long paragraph in which instructions are mixed in with background description.","a":"Why will this reduce output quality?","o":["The model cannot distinguish what to do from what to know, so a background detail may be treated as a requirement","The instructions are too few","The paragraph is too long for the model","The model prefers bullet points"],"c":0,"w":["Structure carries meaning. When requirements and context share the same grammatical space, the boundaries between them are lost, and whether a sentence is a constraint or an aside becomes a matter of interpretation.","Dhaancha matlab rakhta hai. Jab hidayat aur context ek hi jagah ghul jayein, unke darmiyan hadd khatam ho jati hai.","ڈھانچہ معنی رکھتا ہے۔ جب ہدایت اور سیاق ایک جگہ گھل جائیں، حد ختم ہو جاتی ہے۔"]},
{"d":"D4","q":"A team is placing human checkpoints in a five-stage automated pipeline.","a":"Where do checkpoints belong?","o":["Only at the very beginning","Where a human decision changes the outcome, and immediately before any irreversible action","Only at the very end","At every stage, to be safe"],"c":1,"w":["Review everywhere is review nowhere: each checkpoint adds delay, and a human asked to approve everything learns to approve without reading. Place them where they carry consequence — and always before the step that cannot be undone.","Har jagah review matlab kahin review nahi: har checkpoint der barhata hai, aur har cheez approve karne wala human bina padhe approve karna seekh jata hai. Wahan rakhein jahan nateeja badalta hai.","ہر جگہ جائزہ مطلب کہیں جائزہ نہیں۔"]},
{"d":"D2","q":"An AI compliance check reports “no issues found” on a document that contains two obvious problems.","a":"What is the most useful way to read this result?","o":["The document is compliant","The model needs a larger context window","The issues are minor enough to ignore","The check did not detect the issues, which means the check itself must be validated before it is trusted again"],"c":3,"w":["A false negative is a worse failure than a false positive, because it removes the reviewer's attention instead of redirecting it. The output to act on here is not the document — it is the checking process.","False negative false positive se zyada khatarnak hai, kyunke woh reviewer ki tawajjoh hata deta hai. Yahan amal wala output document nahi, checking ka process hai.","غلط منفی غلط مثبت سے زیادہ خطرناک ہے، کیونکہ وہ توجہ ہٹا دیتا ہے۔"]},
{"d":"D6","q":"An agent with write access to a shared calendar is asked to reschedule a meeting that includes an external client.","a":"What should happen?","o":["The agent is given greater access so it can handle such cases fully","The agent reschedules the meeting — it has write access","The agent proposes times and a human confirms with the client, because the change affects someone outside the organisation","The agent reschedules and notifies the client"],"c":2,"w":["Write access to a calendar is not authority over the people on it. The party affected here never agreed to deal with an agent, and the courtesy of asking them is not something the agent's permissions can supply.","Calendar pe write access uska ikhtiyar nahi jo us pe maujood logon pe ho. Mutasir fard ne agent se baat karne pe kabhi haan nahi kahi, aur unse poochne ki shisht aisi cheez nahi jo permissions de sakein.","کیلنڈر پر لکھنے کی اجازت اُن لوگوں پر اختیار نہیں۔"]},
{"d":"D7","q":"Two team members run the identical task on the same agent and get noticeably different quality results.","a":"What should be compared?","o":["Which model instance each request hit","Which person is more skilled at prompting","The time of day each request was made","The exact inputs each person supplies — the prompt text, the files attached and the context included"],"c":3,"w":["The same task is rarely the same input. Comparing the actual requests is what turns a vague impression of unreliability into a specific, fixable difference in how the task is being delegated.","Wohi kaam shaz o nadir hi wohi input hota hai. Asli requests compare karne se dhundhla aaizaa ek khaas, fix hone wale farq mein badal jata hai.","وہی کام شاذ و نادر ہی وہی ان پٹ ہوتا ہے۔"]}
],
3: [
{"d":"D2","q":"An AI tool summarises court judgments. In one summary it reverses which party won the case.","a":"What makes this failure category particular?","o":["It requires a larger context window to fix","Reversing the outcome inverts the meaning of the entire document while leaving it internally coherent and easy to act on wrongly","It is a wording problem that a reader will notice","It shows the source document was ambiguous"],"c":1,"w":["Every other part of the summary will be consistent with the reversed outcome, so nothing inside it signals a problem. This is the failure mode that survives review, because review looks for inconsistency and finds none.","Summary ka baqi hissa us ulte nateeje se mutabiq hoga, is liye andar se koi ishara nahi milega. Yehi woh galti hai jo review se bach jati hai, kyunke review be-rabti dhoondta hai aur nahi milti.","خلاصے کا باقی حصہ اُلٹ نتیجے سے مطابق ہوگا، اس لیے کوئی اشارہ نہیں ملے گا۔"]},
{"d":"D3","q":"A team wants a weekly scan across 40 public competitor sites, with notable changes highlighted.","a":"What determines the solution?","o":["The model's parameter count","Whether the agent can browse the sites and whether a scheduled workflow can diff this week's findings against last week's","How many people will read the report","The visual design of the report"],"c":1,"w":["The value here is in the comparison, not the reading. The design needs both live access and stored history, because a scan with nothing to compare against produces the same raw content every week.","Asli faida muqable mein hai, padhne mein nahi. Design ko live access aur mehfooz history, dono chahiye, kyunke jis scan ke paas compare karne ke liye kuch na ho woh har hafte wohi raw content deta hai.","اصل فائدہ موازنے میں ہے۔ ڈیزائن کو زندہ رسائی اور محفوظ تاریخ دونوں چاہیے۔"]},
