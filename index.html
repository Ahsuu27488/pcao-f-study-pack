<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="PCAO-F study pack: all seven domains, the ten official crash courses, flashcards, and three timed 60-question mock tests. English, Roman Urdu and Urdu.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F3F6F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C131B" media="(prefers-color-scheme: dark)">
<title>PCAO-F Study Pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&family=Noto+Naskh+Arabic:wght@400;600&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap">
<style>
/* ============================================================
   DESIGN PLAN
   Colour  : blueprint blue on a cool paper ground; semantic
             green / amber / red reserved for the answer archetypes
             (correct / caution / trap) — never used as decoration.
   Type    : IBM Plex Serif (display), IBM Plex Sans (body),
             IBM Plex Mono (codes, weights, scores).
             Urdu switches to Noto Nastaliq (headings) + Naskh (body).
   Layout  : single reading column, logical properties throughout so
             the whole page mirrors cleanly when Urdu sets dir=rtl.
   ============================================================ */
:root{
  --bg:#F3F6F9;
  --surface:#FFFFFF;
  --surface-2:#E9EEF4;
  --fg:#141D26;
  --muted:#5C6D7D;
  --line:#D2DBE4;
  --line-strong:#B4C2CF;
  --accent:#1B5FB0;
  --accent-ink:#123F76;
  --accent-soft:#E1ECF9;
  --ok:#1B6B4C;
  --ok-soft:#DCEFE6;
  --warn:#8E5F0C;
  --warn-soft:#F7EBD3;
  --trap:#A33327;
  --trap-soft:#F8E2DE;
  --shadow:0 1px 2px rgba(20,29,38,.06),0 5px 16px rgba(20,29,38,.055);
  --radius:10px;
  --font-display:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --font-body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C131B; --surface:#141E28; --surface-2:#1C2833;
    --fg:#E2E9F0; --muted:#8EA1B1; --line:#283746; --line-strong:#3B4E5F;
    --accent:#76ABEE; --accent-ink:#A8C8F4; --accent-soft:#16283C;
    --ok:#5FBF95; --ok-soft:#122A21; --warn:#D9A54C; --warn-soft:#2B2314;
    --trap:#E8857B; --trap-soft:#2F1A18;
    --shadow:0 1px 2px rgba(0,0,0,.42),0 5px 16px rgba(0,0,0,.32);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C131B; --surface:#141E28; --surface-2:#1C2833;
  --fg:#E2E9F0; --muted:#8EA1B1; --line:#283746; --line-strong:#3B4E5F;
  --accent:#76ABEE; --accent-ink:#A8C8F4; --accent-soft:#16283C;
  --ok:#5FBF95; --ok-soft:#122A21; --warn:#D9A54C; --warn-soft:#2B2314;
  --trap:#E8857B; --trap-soft:#2F1A18;
  --shadow:0 1px 2px rgba(0,0,0,.42),0 5px 16px rgba(0,0,0,.32);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--fg);
  font-family:var(--font-body);font-size:15px;line-height:1.62;
  padding-inline:clamp(16px,4vw,32px);padding-block:0 72px;
  -webkit-font-smoothing:antialiased;
}
:root[data-lang="ur"] body{
  font-family:"Noto Naskh Arabic",var(--font-body);font-size:16px;line-height:2.05;
}
:root[data-lang="ur"] h1,
:root[data-lang="ur"] h2,
:root[data-lang="ur"] h3,
:root[data-lang="ur"] .fc-q,
:root[data-lang="ur"] .qsc{font-family:"Noto Nastaliq Urdu",var(--font-display);line-height:2.15}
:root[data-lang="ur"] .eyebrow,
:root[data-lang="ur"] .fact dt,
:root[data-lang="ur"] .qn,
:root[data-lang="ur"] .dn,
:root[data-lang="ur"] .fc-hint{letter-spacing:0;font-family:"Noto Naskh Arabic",sans-serif}

.wrap{max-width:880px;margin-inline:auto;min-width:0}
.prose{max-width:68ch}
h1,h2,h3{font-family:var(--font-display);font-weight:600;text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:clamp(1.6rem,4.2vw,2.2rem);letter-spacing:-.01em}
h2{font-size:clamp(1.2rem,2.9vw,1.5rem)}
h3{font-size:1.04rem}
p{margin:0}
a{color:var(--accent);text-underline-offset:2px}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- masthead ---------- */
.masthead{padding-block:32px 18px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-family:var(--font-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.13em;color:var(--muted)}
.masthead .lede{color:var(--muted);font-size:.98rem;max-width:62ch}
.rule{height:1px;background:var(--line);border:0;margin:0}

.langbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.langbar .lb-label{font-family:var(--font-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.11em;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:20px;overflow:hidden;background:var(--surface)}
.seg button{
  appearance:none;border:0;background:none;color:var(--muted);
  font-family:inherit;font-size:.8rem;padding:5px 14px;cursor:pointer;
  border-inline-end:1px solid var(--line);white-space:nowrap;
}
.seg button:last-child{border-inline-end:0}
.seg button:hover{background:var(--surface-2);color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:500}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#08111A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#08111A}}

/* ---------- tab rail ---------- */
.tabrail{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 0;margin-bottom:22px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;border-bottom:1px solid var(--line)}
.tabs button{
  appearance:none;background:none;border:0;border-bottom:2px solid transparent;
  color:var(--muted);font-family:inherit;font-size:.86rem;font-weight:500;
  padding:9px 13px;cursor:pointer;white-space:nowrap;border-radius:6px 6px 0 0;
  transition:color .13s ease,border-color .13s ease,background .13s ease;
}
.tabs button:hover{color:var(--fg);background:var(--surface-2)}
.tabs button[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent)}

/* ---------- blocks ---------- */
section[data-panel]{display:flex;flex-direction:column;gap:20px}
section[data-panel][hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card .sub{color:var(--muted);font-size:.87rem}
.sectionhead{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.sectionhead p{color:var(--muted);font-size:.92rem;max-width:66ch}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.fact{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.fact dt{font-family:var(--font-mono);font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.fact dd{margin:0;font-family:var(--font-display);font-size:1.18rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.fact dd small{display:block;font-family:var(--font-body);font-size:.75rem;font-weight:400;color:var(--muted);margin-top:2px}

.callout{border:1px solid var(--line);border-inline-start:3px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:13px 16px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.callout.warn{border-inline-start-color:var(--warn);background:var(--warn-soft)}
.callout.ok{border-inline-start-color:var(--ok);background:var(--ok-soft)}
.callout.trap{border-inline-start-color:var(--trap);background:var(--trap-soft)}

.domains{display:flex;flex-direction:column;gap:2px}
.domain{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;padding:13px 16px;border-radius:8px;background:var(--surface);border:1px solid var(--line);border-inline-start:3px solid var(--line-strong);min-width:0}
.domain.priority{border-inline-start-color:var(--warn)}
.domain .dname{font-weight:500;min-width:0;overflow-wrap:anywhere}
.domain .dname .code{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);margin-inline-end:7px}
.domain .dweight{font-family:var(--font-mono);font-size:.95rem;font-weight:500;font-variant-numeric:tabular-nums;color:var(--accent-ink)}
.domain .track{grid-column:1/-1;height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.domain .track i{display:block;height:100%;background:var(--line-strong);border-radius:3px}
.domain.priority .track i{background:var(--warn)}
.domain .dcovers{grid-column:1/-1;font-size:.78rem;color:var(--muted)}
.scalenote{font-family:var(--font-mono);font-size:.69rem;color:var(--muted)}

.steps{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:11px 0;border-bottom:1px dashed var(--line);align-items:start}
.step:last-child{border-bottom:0}
.step .n{font-family:var(--font-mono);font-size:.73rem;font-weight:500;color:var(--accent-ink);background:var(--accent-soft);border-radius:5px;padding:2px 7px;flex:none;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.step .sb{display:flex;flex-direction:column;gap:2px;min-width:0}
.step .sb b{font-weight:600;font-size:.94rem}
.step .sb span{font-size:.87rem;color:var(--muted);overflow-wrap:anywhere}

.pairs{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);background:var(--surface)}
.pair > div{padding:10px 14px;font-size:.87rem;min-width:0;overflow-wrap:anywhere}
.pair .k{font-family:var(--font-mono);font-size:.79rem;color:var(--trap);border-inline-end:1px solid var(--line)}
@media(max-width:520px){.pair{grid-template-columns:1fr}.pair .k{border-inline-end:0;border-bottom:1px solid var(--line)}}

.arch{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.architem{border:1px solid var(--line);border-radius:8px;padding:13px 15px;display:flex;flex-direction:column;gap:5px;background:var(--surface);border-top:3px solid var(--line-strong)}
.architem.t{border-top-color:var(--trap)}
.architem.c{border-top-color:var(--ok);background:var(--ok-soft)}
.architem b{font-size:.89rem}
.architem span{font-size:.82rem;color:var(--muted)}
.tag{font-family:var(--font-mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;padding:2px 6px;border-radius:4px;align-self:flex-start}
.tag.t{background:var(--trap-soft);color:var(--trap)}
.tag.c{background:var(--ok-soft);color:var(--ok)}

.courses{display:flex;flex-direction:column;gap:8px}
.course{display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;padding:12px 15px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-decoration:none;color:inherit;transition:border-color .13s ease,background .13s ease}
.course:hover{border-color:var(--accent);background:var(--surface-2)}
.course .num{font-family:var(--font-mono);font-size:.75rem;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.course .cb{display:flex;flex-direction:column;gap:3px;min-width:0}
.course .ct{font-weight:500;font-size:.93rem;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:2px}
.course:hover .ct{text-decoration-color:var(--accent)}
.course .cd{font-size:.81rem;color:var(--muted)}
.course .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.dtag{font-family:var(--font-mono);font-size:.64rem;padding:2px 6px;border-radius:4px;background:var(--surface-2);color:var(--muted)}
.dtag.hot{background:var(--warn-soft);color:var(--warn)}

.fcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:11px}
.fc{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden;display:flex;flex-direction:column}
.fc.known{border-color:var(--ok);background:var(--ok-soft)}
.fc-body{appearance:none;border:0;background:none;text-align:start;cursor:pointer;padding:14px 15px;display:flex;flex-direction:column;gap:9px;flex:1;color:inherit;font-family:inherit;font-size:inherit}
.fc-q{font-weight:500;font-size:.91rem;min-width:0;overflow-wrap:anywhere}
.fc-a{display:none;font-size:.86rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:9px;min-width:0;overflow-wrap:anywhere}
.fc.open .fc-a{display:block}
.fc-hint{font-family:var(--font-mono);font-size:.64rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent-ink)}
.fc-foot{display:flex;justify-content:flex-end;padding:0 11px 11px}
.fc-know{appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);font-family:inherit;font-size:.73rem;border-radius:20px;padding:3px 12px;cursor:pointer}
.fc.known .fc-know{background:var(--ok);border-color:var(--ok);color:#fff}
.fc-progress{font-family:var(--font-mono);font-size:.75rem;color:var(--muted)}

/* ---------- quiz ---------- */
.quizctl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.quizctl .cl{font-family:var(--font-mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.stat{font-family:var(--font-mono);font-size:.78rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.stat b{color:var(--fg);font-weight:500}
.btn{appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);font-family:inherit;font-size:.79rem;border-radius:20px;padding:5px 15px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{opacity:.9;color:#fff}
:root[data-theme="dark"] .btn.primary{color:#08111A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#08111A}}
.btn.danger{border-color:var(--trap);color:var(--trap)}

.q{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.q .qsc{font-size:.93rem;min-width:0}
.q .qn{font-family:var(--font-mono);font-size:.7rem;color:var(--muted);display:block;margin-bottom:5px}
.q .qask{display:block;margin-top:8px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{appearance:none;text-align:start;display:grid;grid-template-columns:auto 1fr;gap:10px;border:1px solid var(--line);background:var(--surface);color:inherit;font-family:inherit;font-size:.87rem;line-height:1.5;border-radius:7px;padding:9px 13px;cursor:pointer;transition:border-color .12s ease,background .12s ease;min-width:0}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--surface-2)}
.opt .ol{font-family:var(--font-mono);font-size:.77rem;color:var(--muted);padding-top:1px}
.opt .ot{min-width:0;overflow-wrap:anywhere}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .ol{color:var(--ok)}
.opt.wrong{border-color:var(--trap);background:var(--trap-soft)}
.opt.wrong .ol{color:var(--trap)}
.opt.faded{opacity:.55}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);font-weight:500}
.why{display:none;border-inline-start:3px solid var(--accent);background:var(--accent-soft);border-radius:6px;padding:10px 14px;font-size:.85rem}
.q.answered .why{display:block}

/* mock */
.mockhead{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:12px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);position:sticky;top:calc(env(safe-area-inset-top,0px) + 42px);z-index:15}
.timer{font-family:var(--font-mono);font-size:1.05rem;font-weight:500;font-variant-numeric:tabular-nums;color:var(--accent-ink)}
.timer.low{color:var(--trap)}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px;max-width:100%}
.palette button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-family:var(--font-mono);font-size:.71rem;border-radius:6px;padding:6px 0;cursor:pointer;font-variant-numeric:tabular-nums}
.palette button.ans{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.palette button.cur{outline:2px solid var(--accent);outline-offset:1px}
.palette button.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.palette button.wrong{background:var(--trap-soft);border-color:var(--trap);color:var(--trap)}
.mocknav{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.mocknav .btn{margin-inline-start:0}
.spacer{margin-inline-start:auto}

.scorecard{display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:22px;text-align:center}
.scorecard.pass{border-color:var(--ok);background:var(--ok-soft)}
.scorecard.fail{border-color:var(--trap);background:var(--trap-soft)}
.scorenum{font-family:var(--font-display);font-size:clamp(2.6rem,9vw,3.6rem);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.verdict{font-family:var(--font-mono);font-size:.8rem;text-transform:uppercase;letter-spacing:.14em;font-weight:500}
.scorecard.pass .verdict,.scorecard.pass .scorenum{color:var(--ok)}
.scorecard.fail .verdict,.scorecard.fail .scorenum{color:var(--trap)}
.scorecard .scnote{font-size:.84rem;color:var(--muted)}

.dtable{width:100%;border-collapse:collapse;font-size:.84rem}
.dtable th,.dtable td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.dtable th{font-family:var(--font-mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
.dtable td.n{font-family:var(--font-mono)}
.dbar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;min-width:60px}
.dbar i{display:block;height:100%;border-radius:3px;background:var(--ok)}
.dbar i.mid{background:var(--warn)}
.dbar i.low{background:var(--trap)}
.tablewrap{overflow-x:auto;min-width:0}

.rev{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:9px}
.rev.bad{border-inline-start:3px solid var(--trap)}
.rev.good{border-inline-start:3px solid var(--ok)}
.rev .rq{font-size:.88rem;font-weight:500}
.rev .ra{font-size:.83rem;color:var(--muted)}
.rev .ra b{color:var(--fg)}

.plan{display:flex;flex-direction:column;gap:0}
.day{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);align-items:start}
.day:last-child{border-bottom:0}
.day .dn{font-family:var(--font-mono);font-size:.71rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;padding-top:3px}
.day.examday .dn{color:var(--trap)}
.day .dc{display:flex;flex-direction:column;gap:3px;min-width:0}
.day .dc b{font-size:.92rem;font-weight:600}
.day .dc span{font-size:.86rem;color:var(--muted);overflow-wrap:anywhere}
@media(max-width:520px){.day{grid-template-columns:1fr;gap:4px}.day .dn{padding-top:0}}

.check{display:flex;flex-direction:column;gap:9px}
.check label{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:start;font-size:.89rem;cursor:pointer;min-width:0}
.check input{margin:3px 0 0;width:16px;height:16px;accent-color:var(--accent);flex:none}
.check input:checked + span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.footnote{font-size:.81rem;color:var(--muted);max-width:70ch}
.footnote a{color:var(--accent)}
.empty{border:1px dashed var(--line-strong);border-radius:8px;padding:26px;text-align:center;color:var(--muted);font-size:.88rem}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms !important;animation-duration:.01ms !important}}
</style></head>
<body>
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img,svg,video{max-width:100%}
[hidden]{display:none !important}

/* --- six-day plan: hour chip and the note about where time goes --- */
.day .dc .dhrs{align-self:flex-start;font-family:var(--font-mono);font-size:.7rem;
  letter-spacing:.05em;color:var(--accent-ink);background:var(--accent-soft);
  border-radius:99px;padding:2px 9px;margin:1px 0 3px;font-variant-numeric:tabular-nums}
.day .dc .dnote{border-inline-start:2px solid var(--line);padding-inline-start:9px;
  font-style:italic;margin-top:2px}
/* --- course hour estimate --- */
.course .est{align-self:flex-start;font-family:var(--font-mono);font-size:.69rem;
  letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);
  border-radius:99px;padding:1px 8px;margin-top:2px;font-variant-numeric:tabular-nums}
/* --- phones: seven tabs will not fit on one line, and a hidden Quiz tab is
       a hidden Quiz tab. Wrap them into pills so all seven stay reachable. --- */
@media(max-width:600px){
  .tabs{flex-wrap:wrap;overflow-x:visible;border-bottom:0;gap:5px;padding-bottom:4px}
  .tabs button{border:1px solid var(--line);border-radius:99px;background:var(--surface);
    padding:7px 12px;font-size:.8rem}
  .tabs button:hover{background:var(--surface-2)}
  .tabs button[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);
    color:var(--accent-ink)}
}
</style>

"ov.laptopB":["Phones are not allowed for the exam. Two attempts are allowed — if the 11th goes badly you can re-sit on the 18th. You must reserve your slot through the exam form before you appear.","Exam mein mobile phone allowed nahi. Do attempts milte hain — agar 11 tareekh kharab jaye to 18 ko dobara de sakte hain. Exam se pehle slot form bharna zaroori hai.","امتحان میں موبائل فون کی اجازت نہیں۔ دو کوششیں ملتی ہیں — اگر ۱۱ تاریخ خراب جائے تو ۱۸ کو دوبارہ دے سکتے ہیں۔ امتحان سے پہلے سلاٹ فارم بھرنا لازمی ہے۔"],

"ov.testsH":["What this exam actually tests","Ye exam asal mein kya test karta hai","یہ امتحان اصل میں کیا جانچتا ہے"],
"ov.testsP1":["It tests <strong>judgment, not recall</strong>. Almost every question is a scenario: a team, a deadline, something the AI produced, and one detail buried in the prose that breaks the delegation. Your job is to spot that detail and pick the <em>smallest sufficient move</em> — not the most impressive one.","Ye <strong>samajh (judgment) test karta hai, ratta nahi</strong>. Taqreeban har sawal ek scenario hai: ek team, ek deadline, AI ne kya banaya, aur prose mein chhipi hui ek detail jo delegation tor deti hai. Aap ka kaam woh detail pakadna aur <em>sabse chhota kaafi move</em> chunna hai — sabse bara nahi.","یہ <strong>فیصلے کی صلاحیت جانچتا ہے، رٹا نہیں</strong>۔ تقریباً ہر سوال ایک منظرنامہ ہے: ایک ٹیم، ایک ڈیڈ لائن، اے آئی نے کیا بنایا، اور عبارت میں چھپی ایک تفصیل جو تفویض کو توڑ دیتی ہے۔ آپ کا کام وہ تفصیل پکڑنا اور <em>سب سے چھوٹا کافی اقدام</em> چننا ہے — سب سے بڑا نہیں۔"],
"ov.testsP2":["The published blueprint splits the exam into seven domains. <strong>Three of them carry 50% of the marks</strong>, and all three are about the same thing: delegating a task, checking what comes back, and governing what the agent was allowed to do.","Published blueprint exam ko saat domains mein baantta hai. <strong>Teen domains mil kar 50% marks rakhte hain</strong>, aur teenon ek hi cheez ke baare mein hain: kaam delegate karna, jo wapas aaya usay check karna, aur agent ko kis cheez ki ijazat thi usay govern karna.","شائع شدہ بلیو پرنٹ امتحان کو سات ڈومینز میں تقسیم کرتا ہے۔ <strong>تین ڈومینز مل کر ۵۰٪ نمبر رکھتے ہیں</strong>، اور تینوں ایک ہی چیز کے بارے میں ہیں: کام تفویض کرنا، جو واپس آیا اسے جانچنا، اور ایجنٹ کو کس چیز کی اجازت تھی اسے کنٹرول کرنا۔"],
"ov.sampleH":["Do the official sample early — not the night before.","Official sample exam jaldi dein — aakhri raat nahi."],
"ov.sampleB":["The official sample sitting mirrors the real format and does not use an attempt. Take it once in the first two days for a baseline, then again mid-week to see what moved.","Official sample exam bilkul asli format jaisa hai aur attempt count nahi khata. Pehle do din mein ek baar dein (baseline ke liye), phir hafte ke beech dobara — dekhein kya behtar hua.","سرکاری سیمپل امتحان بالکل اصل فارمیٹ جیسا ہے اور کوشش شمار نہیں کرتا۔ پہلے دو دن میں ایک بار دیں (بنیادی جائزے کے لیے)، پھر ہفتے کے وسط میں دوبارہ — دیکھیں کیا بہتر ہوا۔"],
"ov.langH":["About the languages","Zabaano ke baare mein","زبانوں کے بارے میں"],
"ov.langP":["The interface, all study notes and every answer explanation switch between English, Roman Urdu and اردو. <strong>Question papers stay in English</strong> — that is the language of the real exam, so practice in it.","Interface, saara study material aur har explanation English, Roman Urdu aur اردو mein switch hoti hai. <strong>Sawal English mein hi rehte hain</strong> — kyunke asli exam bhi English mein hai, to usi mein practice karein.","انٹرفیس، سارا مطالعہ اور ہر وضاحت انگریزی، رومن اردو اور اردو میں بدل جاتی ہے۔ <strong>سوالات انگریزی میں ہی رہتے ہیں</strong> — کیونکہ اصل امتحان بھی انگریزی میں ہے، تو اسی میں مشق کریں۔"],
"ov.srcH":["Sources behind this pack","Is pack ke sources","اس پیک کے ماخذ"],
"ov.srcP":["Weights and domain structure come from the published PCAO-F study guide. The scenario framework, action-verb boundaries and the four-option elimination strategy come from your official GIAIC group material. Where an older notice conflicted with a newer one, the newer notice wins — exam window is <strong>3:30–6:30 PM on 4, 11 and 18 October</strong>.","Weights aur domain structure official PCAO-F study guide se hain. Scenario framework, action-verb boundaries aur four-option strategy aap ke official GIAIC group material se hain. Jahan purana notice naye se takraya, naya jeeta — exam window <strong>4, 11 aur 18 October, 3:30–6:30 PM</strong> hai.","ویٹس اور ڈومین ڈھانچہ سرکاری PCAO-F اسٹڈی گائیڈ سے ہیں۔ اسٹوری طریقہ، ایکشن ورب کی حدیں اور چار آپشن کا طریقہ آپ کے سرکاری GIAIC گروپ کے مواد سے ہیں۔ جہاں پرانا نوٹس نئے سے ٹکرایا، نیا جیتا — امتحان <strong>۴، ۱۱ اور ۱۸ اکتوبر، ۳:۳۰ تا ۶:۳۰</strong> ہے۔"],

"dm.h":["Seven domains, ranked by weight","Saat domains, weight ke hisaab se","سات ڈومینز، وزن کے حساب سے"],
"dm.p":["Bars share one scale: the longest domain (21%) fills the track. The three marked amber carry half the paper.","Saare bars ek hi scale pe hain: sabse bara domain (21%) poori track bharta hai. Amber wale teen aadha paper rakhte hain.","تمام بار ایک ہی پیمانے پر ہیں: سب سے بڑا ڈومین (۲۱٪) پوری پٹی بھرتا ہے۔ نارنجی والے تین آدھا پرچہ رکھتے ہیں۔"],
"d2.n":["Output Evaluation &amp; Validation","Output Evaluation &amp; Validation","آؤٹ پٹ کی جانچ اور تصدیق"],
"d2.c":["Catching what the model got wrong before anyone acts on it. The single largest domain.","Model ne kya ghalat kiya, koi amal karne se pehle pakadna. Sabse bara domain.","ماڈل نے کیا غلط کیا، کوئی عمل کرنے سے پہلے پکڑنا۔ سب سے بڑا ڈومین۔"],
"d4.n":["Workflow Integration &amp; Solution Design","Workflow Integration &amp; Solution Design","ورک فلو انٹیگریشن اور حل کی ڈیزائننگ"],
"d4.c":["Fitting AI into a real workflow, and redesigning the workflow when it breaks.","AI ko asli workflow mein fit karna, aur tootne pe workflow dobara design karna.","اے آئی کو اصل ورک فلو میں فٹ کرنا، اور ٹوٹنے پر ورک فلو دوبارہ ڈیزائن کرنا۔"],
"d6.n":["Governance, Risk &amp; Responsible Use","Governance, Risk &amp; Responsible Use","گورننس، خطرہ اور ذمہ دارانہ استعمال"],
"d6.c":["What the agent is allowed to do, who is affected, when a human must review.","Agent ko kis cheez ki ijazat hai, kis pe asar hota hai, human ko kab review karna hai.","ایجنٹ کو کس چیز کی اجازت ہے، کس پر اثر ہوتا ہے، انسان کو کب جائزہ لینا ہے۔"],
"d1.n":["Prompting &amp; Task Execution","Prompting &amp; Task Execution","پرامپٹنگ اور کام کی تکمیل"],
"d1.c":["Giving the agent a job: outcome, context, boundaries.","Agent ko kaam dena: nateeja, context, hadein.","ایجنٹ کو کام دینا: نتیجہ، سیاق و سباق، حدیں۔"],
"d3.n":["Product &amp; Model Selection","Product &amp; Model Selection","پروڈکٹ اور ماڈل کا انتخاب"],
"d3.c":["Choosing the right model or product for the job in front of you.","Saamne wale kaam ke liye sahi model ya product chunna.","سامنے والے کام کے لیے صحیح ماڈل یا پروڈکٹ چننا۔"],
"d5.n":["Configuration &amp; Knowledge Management","Configuration &amp; Knowledge Management","کنفیگریشن اور علم کا انتظام"],
"d5.c":["Skills, connectors, and feeding the agent knowledge it can actually cite.","Skills, connectors, aur agent ko aisa knowledge dena jise woh cite kar sake.","اسکلز، کنیکٹرز، اور ایجنٹ کو ایسا علم دینا جس کا وہ حوالہ دے سکے۔"],
"d7.n":["Troubleshooting &amp; Optimization","Troubleshooting &amp; Optimization","خرابی کی تشخیص اور بہتری"],
"d7.c":["Diagnosing a failing workflow and matching the fix to the failure.","Fail hone wale workflow ki diagnosis, aur galti ke mutabiq fix.","ناکام ہونے والے ورک فلو کی تشخیص، اور غلطی کے مطابق حل۔"],
"dm.scale":["scale: bar length ∝ weight, 21% = full track","scale: bar ki lambai ∝ weight, 21% = poori track","پیمانہ: بار کی لمبائی ∝ وزن، ۲۱٪ = پوری پٹی"],
"dm.timeH":["How to spend your time","Waqt kaise lagayein","وقت کیسے لگائیں"],
"dm.timeP1":["Your group notes put D1 + D2 + D6 together at roughly half the paper, which matches the blueprint weights exactly. Two thirds of your study hours belong in those three. D3, D5 and D7 are 34% combined and mostly reward a good skim — read them once properly, don't drill them.","Aap ke group notes D1 + D2 + D6 ko mila kar taqreeban aadha paper kehte hain, jo blueprint weights se bilkul match karta hai. Do tihai waqt in teenon mein lagayein. D3, D5 aur D7 mil kar 34% hain — inhein ek baar theek se padh lein, ratta na lagayein.","آپ کے گروپ نوٹس D1 + D2 + D6 کو ملا کر تقریباً آدھا پرچہ کہتے ہیں، جو بلیو پرنٹ سے بالکل مطابقت رکھتا ہے۔ دو تہائی وقت انہی تینوں میں لگائیں۔ D3، D5 اور D7 مل کر ۳۴٪ ہیں — انہیں ایک بار ٹھیک سے پڑھ لیں، رٹا نہ لگائیں۔"],
"dm.timeP2":["There is no per-domain pass mark. The score report shows percent-correct by domain, but only the total scaled score decides.","Har domain ka alag pass mark nahi hota. Report domain-wise percent dikhati hai, lekin faisla sirf total scaled score karta hai.","ہر ڈومین کا الگ پاس مارک نہیں ہوتا۔ رپورٹ ڈومین کے حساب سے فیصد دکھاتی ہے، مگر فیصلہ صرف کل اسکور کرتا ہے۔"],

"mt.h":["The scenario method","Scenario ka tareeqa","منظرنامے کا طریقہ"],
"mt.p":["The highest-value page in this pack. Learn it and you can answer questions on content you half-remember, because the wrong options are built to a pattern.","Is pack ka sabse qeemti safha. Ye seekh liya to aadha-yaad content pe bhi jawab de sakte hain, kyunke ghalat options ek pattern pe bante hain.","اس پیک کا سب سے قیمتی صفحہ۔ یہ سیکھ لیا تو آدھے یاد مواد پر بھی جواب دے سکتے ہیں، کیونکہ غلط آپشن ایک ہی انداز پر بنتے ہیں۔"],
"mt.anatH":["Anatomy of every scenario question","Har scenario sawal ka dhaancha","ہر منظرنامے کی ساخت"],
"mt.anatP":["Stems are assembled from five blocks. The first four are scenery. The fifth is the answer.","Sawal paanch tukdon se banta hai. Pehle chaar sirf background hain. Paanchwa jawab hai.","سوال پانچ ٹکڑوں سے بنتا ہے۔ پہلے چار صرف پس منظر ہیں۔ پانچواں جواب ہے۔"],
"mt.a1b":["Company / Context","Company / Context","کمپنی / سیاق"],
"mt.a1s":["Who the person is, what team, what they're responsible for.","Banda kaun hai, kaunsi team, uski zimmedari kya hai.","فرد کون ہے، کون سی ٹیم، اس کی ذمہ داری کیا ہے۔"],
"mt.a2b":["Problem Statement","Problem Statement","مسئلہ"],
"mt.a2s":["The pressure — a deadline, a crisis, a constraint.","Dabao — deadline, crisis, ya koi constraint.","دباؤ — ڈیڈ لائن، بحران، یا کوئی پابندی۔"],
"mt.a3b":["Action","Action","عمل"],
"mt.a3s":["What the human asked the AI to do. This is the delegation.","Human ne AI se kya karwaya. Yahi delegation hai.","انسان نے اے آئی سے کیا کروایا۔ یہی تفویض ہے۔"],
"mt.a4b":["Workflow","Workflow","ورک فلو"],
"mt.a4s":["What the AI actually produced or did.","AI ne asal mein kya banaya ya kiya.","اے آئی نے اصل میں کیا بنایا یا کیا۔"],
"mt.a5b":["Hidden Clue","Hidden Clue","چھپی ہوئی سراغ"],
"mt.a5s":["The deliberate flaw — a hallucinated fact, an unverified assumption, or a boundary violation. <strong>Answer the clue, not the scenario.</strong>","Jaan boojh kar daali gayi galti — banaya hua fact, bina verify kiya assumption, ya hadd ki khilaaf-warzi. <strong>Clue ka jawab dein, poore scenario ka nahi.</strong>","جان بوجھ کر ڈالی گئی خامی — بنایا ہوا حقیقت، بغیر تصدیق مفروضہ، یا حد کی خلاف ورزی۔ <strong>سراغ کا جواب دیں، پورے منظرنامے کا نہیں۔</strong>"],
"mt.egH":["The flood-week courier example","Baadsh (flood) wale courier ki misaal","سیلاب والے کورئیر کی مثال"],
"mt.egB":["A coordinator uses Claude during flood disruption to draft customer updates. Claude writes that roads reopen Friday and parcels arrive Monday. The coordinator is about to broadcast to 900 customers. Two flaws are planted: the dates are specific but unsourced, and the human is about to send without verifying. The right answer is not \"use a better model\" or \"build an automated feed\" — it is <em>check the dates against a live source before sending</em>.","Ek coordinator flood ke doran Claude se customer updates draft karwata hai. Claude likhta hai ke sarkein Jumma ko khulengi aur parcel Monday ko aayenge. Coordinator 900 customers ko bhejne wala hai. Do galtiyan chhipi hain: dates specific hain magar kisi source se nahi, aur human bina verify kiye bhejne wala hai. Sahi jawab \"behtar model\" ya \"automated feed\" nahi — balke <em>bhejne se pehle live source se dates check karna</em> hai.","ایک کوآرڈینیٹر سیلاب کے دوران کلاؤڈ سے گاہکوں کے لیے پیغام تیار کرواتا ہے۔ کلاؤڈ لکھتا ہے کہ سڑکیں جمعہ کو کھلیں گی اور پارسل پیر کو پہنچیں گے۔ کوآرڈینیٹر ۹۰۰ گاہکوں کو بھیجنے والا ہے۔ دو خامیاں چھپی ہیں: تاریخیں مخصوص ہیں مگر کسی ماخذ سے نہیں، اور انسان بغیر تصدیق بھیجنے والا ہے۔ صحیح جواب \"بہتر ماڈل\" یا \"خودکار نظام\" نہیں — بلکہ <em>بھیجنے سے پہلے کسی زندہ ذریعے سے تاریخیں جانچنا</em> ہے۔"],
"mt.loopH":["The Delegation Loop","Delegation Loop","تفویض کا چکر"],
"mt.loopP":["Six things the human does around whatever the model does. Broken scenarios are always a break in one of these links — name which one and the answer usually picks itself.","Chhe kaam jo human model ke ird-gird karta hai. Kharab scenarios mein hamesha inhi mein se koi ek kari tooti hoti hai — usay naam dein, jawab khud mil jata hai.","چھ کام جو انسان ماڈل کے گرد کرتا ہے۔ خراب منظرناموں میں ہمیشہ انہی میں سے کوئی ایک کڑی ٹوٹی ہوتی ہے — اسے نام دیں، جواب خود مل جاتا ہے۔"],
"mt.l1n":["Define","Define","وضاحت"],"mt.l1b":["State the outcome","Nateeja wazeh karein","نتیجہ واضح کریں"],"mt.l1s":["What \"done\" looks like, and the criteria it will be judged against.","\"Mukammal\" kaisa lagega, aur kis mayaar pe judge hoga.","\"مکمل\" کیسا لگے گا، اور کس معیار پر جانچا جائے گا۔"],
"mt.l2n":["Delegate","Delegate","تفویض"],"mt.l2b":["Hand it over with boundaries","Hadein de kar kaam saunpein","حدیں دے کر کام سونپیں"],"mt.l2s":["Context, limits on what it may do, and the instructions.","Context, kya kar sakta hai ki hadd, aur hidayat.","سیاق، کیا کر سکتا ہے کی حد، اور ہدایات۔"],
"mt.l3n":["Observe","Observe","مشاہدہ"],"mt.l3b":["Watch it work","Kaam karte hue dekhein","کام کرتے ہوئے دیکھیں"],"mt.l3s":["Catch drift and hallucination <em>while</em> it runs, not after.","Drift aur hallucination <em>chalte waqt</em> pakrein, baad mein nahi.","بھٹکاؤ اور غلط معلومات <em>چلتے وقت</em> پکڑیں، بعد میں نہیں۔"],
"mt.l4n":["Intervene","Intervene","مداخلت"],"mt.l4b":["Correct mid-flight","Beech mein sudhaarein","درمیان میں درست کریں"],"mt.l4s":["Pause and steer when it heads the wrong way.","Rok kar sahi simt mein morrein.","روک کر صحیح سمت میں موڑیں۔"],
"mt.l5n":["Verify","Verify","تصدیق"],"mt.l5b":["Check every fact","Har fact check karein","ہر حقیقت جانچیں"],"mt.l5s":["Against an external record, before anything is used or sent.","Kisi bahar ke record se, istemal ya bhejne se pehle.","کسی بیرونی ریکارڈ سے، استعمال یا بھیجنے سے پہلے۔"],
"mt.l6n":["Accept","Accept","قبول"],"mt.l6b":["Own the result","Nateeje ki zimmedari lein","نتیجے کی ذمہ داری لیں"],"mt.l6s":["Accepting the output means accepting responsibility for it.","Output qubool karna matlab uski zimmedari qubool karna.","آؤٹ پٹ قبول کرنا مطلب اس کی ذمہ داری قبول کرنا۔"],
"mt.citH":["A citation is not verification. Checking the citation is verification.","Citation verification nahi hai. Citation check karna verification hai.","حوالہ تصدیق نہیں ہے۔ حوالہ جانچنا تصدیق ہے۔"],
"mt.citB":["If an option involves a source, ask whether it says <em>look at</em> the source or merely <em>has</em> a source. Only the first is correct.","Agar kisi option mein source hai, dekhein ke woh source <em>dekhne</em> keh raha hai ya sirf source <em>hona</em>. Sirf pehla sahi hai.","اگر کسی آپشن میں ماخذ ہو، دیکھیں وہ ماخذ <em>دیکھنے</em> کہہ رہا ہے یا صرف ماخذ <em>ہونا</em>۔ صرف پہلا درست ہے۔"],
"mt.verbH":["Action verbs: where the agent's authority stops","Action verbs: agent ka ikhtiyar kahan rukta hai","ایکشن ورب: ایجنٹ کا اختیار کہاں رکتا ہے"],
"mt.verbP":["Boundary questions are everywhere in D6. The pattern is always the same — gathering information is permitted, committing or destroying is not.","D6 mein boundary sawal har jagah hain. Pattern hamesha ek: maloomat jama karna allowed hai, commitment karna ya mitaana nahi.","D6 میں حد کے سوال ہر جگہ ہیں۔ انداز ہمیشہ ایک: معلومات جمع کرنا جائز ہے، وعدہ کرنا یا مٹانا نہیں۔"],
"mt.v1k":["Research ≠ Purchase","Research ≠ Purchase","تحقیق ≠ خریداری"],"mt.v1v":["An agent may find prices and availability. It must never complete the transaction.","Agent price aur availability dhoond sakta hai. Transaction khud mukammal nahi kar sakta.","ایجنٹ قیمت اور دستیابی ڈھونڈ سکتا ہے۔ لین دین خود مکمل نہیں کر سکتا۔"],
"mt.v2k":["Draft ≠ Send","Draft ≠ Send","مسودہ ≠ ارسال"],"mt.v2v":["Producing a draft is safe. Sending it commits the business to a third party and needs a human.","Draft banana safe hai. Bhejna business ko teesre fard se wada karta hai — iske liye human chahiye.","مسودہ بنانا محفوظ ہے۔ بھیجنا کاروبار کو تیسرے فرد سے وعدہ کرتا ہے — اس کے لیے انسان چاہیے۔"],
"mt.v3k":["Inspect ≠ Delete","Inspect ≠ Delete","معائنہ ≠ حذف"],"mt.v3v":["Flagging a broken file is fine. Deleting it destroys the audit trail.","Kharab file flag karna theek hai. Delete karna audit trail khatam kar deta hai.","خراب فائل نشان زد کرنا ٹھیک ہے۔ حذف کرنا آڈٹ ریکارڈ ختم کر دیتا ہے۔"],
"mt.v4k":["Choose ≠ Omit silently","Choose ≠ Omit silently","انتخاب ≠ خاموش حذف"],"mt.v4v":["An agent may skip something, but it must report what it skipped and why.","Agent kuch chhor sakta hai, magar batana parega ke kya chhora aur kyun.","ایجنٹ کچھ چھوڑ سکتا ہے، مگر بتانا پڑے گا کہ کیا چھوڑا اور کیوں۔"],
"mt.v5k":["Logged ≠ Remembered","Logged ≠ Remembered","درج ≠ یاد"],"mt.v5v":["Output must be grounded in a cited, checkable source — not in the model's conversational memory.","Output kisi cite kiye, check hone wale source se aana chahiye — model ki yaad se nahi.","آؤٹ پٹ کسی حوالہ شدہ، جانچنے والے ماخذ سے آنا چاہیے — ماڈل کی یاد سے نہیں۔"],
"mt.ladH":["The diagnostic ladder","Diagnostic ladder","تشخیص کی سیڑھی"],
"mt.ladP":["When something goes wrong, match the fix to the failure. Most wrong answers are a fix from the wrong rung.","Jab kuch ghalat ho, fix ko galti se match karein. Zyada ghalat jawab kisi doosri seedhi ka fix hote hain.","جب کچھ غلط ہو، حل کو غلطی سے ملائیں۔ زیادہ غلط جواب کسی دوسری سیڑھی کا حل ہوتے ہیں۔"],
"mt.d1b":["It answered a different question","Isne doosra sawal ka jawab diya","اس نے دوسرے سوال کا جواب دیا"],"mt.d1s":["Restate the outcome in one clear line.","Nateeja ek saaf line mein dobara likhein.","نتیجہ ایک صاف سطر میں دوبارہ لکھیں۔"],
"mt.d2b":["One fact or sentence is wrong","Ek fact ya jumla ghalat hai","ایک حقیقت یا جملہ غلط ہے"],"mt.d2s":["Edit that sentence. Do not rebuild the prompt.","Wohi jumla theek karein. Prompt dobara na banayein.","وہی جملہ درست کریں۔ پرامپٹ دوبارہ نہ بنائیں۔"],
"mt.d3b":["It's heading the wrong direction","Ghalat simt mein ja raha hai","غلط سمت میں جا رہا ہے"],"mt.d3s":["Redirect the trajectory back to the original objective.","Asal maqsad ki taraf wapas morein.","اصل مقصد کی طرف واپس موڑیں۔"],
"mt.d4b":["The task was defined badly","Kaam ki tareef ghalat thi","کام کی تعریف غلط تھی"],"mt.d4s":["Fix the instructions and the background context you supplied.","Hidayat aur diya gaya background context theek karein.","ہدایات اور دیا گیا سیاق درست کریں۔"],
"mt.d5b":["The reasoning is too complex for it","Reasoning iske liye bohat mushkil hai","استدلال اس کے لیے بہت مشکل ہے"],"mt.d5s":["Switch on extended thinking, or move to a higher-tier reasoning model.","Extended thinking on karein, ya higher-tier reasoning model pe jayein.","ایکسٹنڈڈ تھنکنگ آن کریں، یا اعلیٰ درجے کے ماڈل پر جائیں۔"],
"mt.d6b":["It keeps failing after several prompts","Kai prompts ke baad bhi fail ho raha hai","کئی پرامپٹ کے بعد بھی ناکام"],"mt.d6s":["Do the task manually. Stop iterating.","Kaam khud kar lein. Try karna band karein.","کام خود کر لیں۔ کوشش بند کریں۔"],
"mt.archH":["The four option archetypes","Chaar option archetypes","چار آپشن کے نمونے"],
"mt.archP":["Options are written in four shapes. Three are traps and you can usually eliminate them on sight.","Options chaar shaklon mein likhe jate hain. Teen trap hote hain — inhein aksar foran hata sakte hain.","آپشن چار شکلوں میں لکھے جاتے ہیں۔ تین پھندے ہوتے ہیں — انہیں اکثر فوراً ہٹا سکتے ہیں۔"],
"mt.trapTag":["Trap","Trap","پھندہ"],"mt.okTag":["Correct","Sahi","درست"],
"mt.ar1b":["The Trusting Move","The Trusting Move","بھروسے والا قدم"],"mt.ar1s":["Accept the output without verifying it. Always wrong.","Bina verify kiye output maan lena. Hamesha ghalat.","بغیر تصدیق آؤٹ پٹ مان لینا۔ ہمیشہ غلط۔"],
"mt.ar2b":["The Nervous Move","The Nervous Move","گھبراہٹ والا قدم"],"mt.ar2s":["Scrap the whole setup and rebuild over one small defect.","Chhoti si kharabi pe poora setup tor kar dobara banana.","چھوٹی سی خرابی پر پورا نظام توڑ کر دوبارہ بنانا۔"],
"mt.ar3b":["The Over-Reaction","The Over-Reaction","حد سے بڑا ردِعمل"],"mt.ar3s":["Introduce major architecture or heavy tooling for a simple problem.","Saada masle ke liye bara architecture ya bhaari tooling lana.","سادہ مسئلے کے لیے بڑا ڈھانچہ یا بھاری اوزار لانا۔"],
"mt.ar4b":["The Smallest Sufficient Move","The Smallest Sufficient Move","سب سے چھوٹا کافی قدم"],"mt.ar4s":["The lightest targeted correction that fixes the exact flaw you found.","Sabse halka, seedha fix jo mili hui kharabi theek kare.","سب سے ہلکا، براہِ راست حل جو ملی خرابی درست کرے۔"],
"mt.archClose":["Find the hidden clue → name which link of the Delegation Loop broke → discard trusting, nervous and over-reactive options → pick what's left.","Hidden clue dhoondein → dekhein Delegation Loop ki kaunsi kari tooti → trusting, nervous aur over-reaction wale options hata dein → jo bache woh chunein.","چھپی سراغ ڈھونڈیں → دیکھیں تفویض کے چکر کی کون سی کڑی ٹوٹی → بھروسے، گھبراہٹ اور حد سے بڑے آپشن ہٹا دیں → جو بچے وہ چنیں۔"],

"qz.p":["Three sets of 60 questions. <strong>Practice</strong> gives instant feedback; <strong>Mock</strong> is the real thing — 120 minutes, no feedback until you submit, then a scaled score out of 1,000.","Teen sets, har ek mein 60 sawal. <strong>Practice</strong> foran feedback deta hai; <strong>Mock</strong> asli cheez hai — 120 minute, submit karne tak koi feedback nahi, phir 1,000 mein se scaled score.","تین سیٹ، ہر ایک میں ۶۰ سوال۔ <strong>پریکٹس</strong> فوراً جواب دیتی ہے؛ <strong>موک</strong> اصل چیز ہے — ۱۲۰ منٹ، جمع کرنے تک کوئی جواب نہیں، پھر ۱۰۰۰ میں سے اسکور۔"],

"pl.h":["Six days, Mon 5 → Sun 11 October","Chhe din, Peer 5 → Itwaar 11 October","چھ دن، پیر ۵ تا اتوار ۱۱ اکتوبر"],
"pl.p":["About 30 hours in total, roughly 5 hours a day: all ten crash courses, three full 60-question mock sets, and a review pass. The hours below assume you are starting from zero and include pausing for notes. They are planning estimates — after the first course you will know your own pace, so stretch or squeeze the rest to match it. Study the heavy domains while your energy is fresh, and put nothing new in front of yourself after Friday.","Kul milakar taqreeban 30 ghante, rozana taqreeban 5: saare das crash courses, teen poore 60-sawal mock sets, aur ek review. Neeche diye ghante farz karte hain ke aap bilkul zero se shuru kar rahe hain aur is mein notes banane ka waqt shamil hai. Ye andaze hain — pehla course dekhne ke baad apni raftaar pata chal jayegi, baqi us ke mutabiq adjust karein. Bhaari domains tab padhein jab energy taaza ho, aur Jumerat ke baad kuch naya na rakhein.","کل تقریباً ۳۰ گھنٹے، روزانہ تقریباً ۵: سارے دس کورس، تین مکمل موک سیٹ، اور ایک جائزہ۔ نیچے دیے گھنٹے فرض کرتے ہیں کہ آپ بالکل صفر سے شروع کر رہے ہیں اور اس میں نوٹس بنانے کا وقت شامل ہے۔ یہ اندازے ہیں — پہلا کورس دیکھنے کے بعد اپنی رفتار پتا چل جائے گی۔ بھاری ڈومینز تب پڑھیں جب توانائی تازہ ہو۔"],
"pl.d1n":["Mon 5 Oct","Peer 5 Oct","پیر ۵ اکتوبر"],
"pl.d1b":["The 50% pair","50% wala jora","۵۰٪ والا جوڑا"],
"pl.d1h":["≈ 5.5 h","≈ 5.5 ghante","≈ ۵.۵ گھنٹے"],
"pl.d1s":["AI Fluency (4Ds) + Just Delegate It. Two courses only, but between them they carry D1 + D2 + D6 — half the paper. Watch with a notebook open, then close everything and re-explain each of the 4Ds out loud in your own words.","AI Fluency (4Ds) + Just Delegate It. Sirf do courses, magar mil kar D1 + D2 + D6 — aadha paper. Notebook khol kar dekhein, phir sab band kar ke har 4D apne lafzon mein buland awaaz mein samjhayein.","AI Fluency (4Ds) + Just Delegate It۔ صرف دو کورس، مگر مل کر D1 + D2 + D6 — آدھا پرچہ۔ نوٹ بک کھول کر دیکھیں، پھر سب بند کر کے ہر 4D اپنے الفاظ میں بلند آواز میں سمجھائیں۔"],
"pl.d1t":["Your slowest day. This material is abstract and does not reward memorising, so keep the whole evening free rather than splitting it.","Aap ka sabse sasta din. Ye material abstract hai, ratta kaam nahi aayega — poori shaam rakhein, tukron mein na baantein.","آپ کا سب سے سست دن۔ یہ مواد تجریدی ہے، رٹا کام نہیں آئے گا — پوری شام رکھیں۔"],
"pl.d2n":["Tue 6 Oct","Mangal 6 Oct","منگل ۶ اکتوبر"],
"pl.d2b":["Prompting and workflow","Prompting aur workflow","پرامپٹنگ اور ورک فلو"],
"pl.d2h":["≈ 5 h","≈ 5 ghante","≈ ۵ گھنٹے"],
"pl.d2s":["AI Prompting 2026 + Workflow Design & Diagnosis. These two carry D1, D4 and D7 — another 40% of the paper. Before you close the laptop, write the diagnostic ladder from memory on paper.","AI Prompting 2026 + Workflow Design & Diagnosis. Ye do mil kar D1, D4 aur D7 — paper ka 40% aur. Laptop band karne se pehle diagnostic ladder kaghaz par yaad se likhein.","AI Prompting 2026 + Workflow Design & Diagnosis۔ یہ دو مل کر D1، D4 اور D7 — پرچے کا ۴۰٪۔ لیپ ٹاپ بند کرنے سے پہلے تشخیصی سیڑھی کاغذ پر یاد سے لکھیں۔"],
"pl.d2t":["Workflow diagnosis is the stretch. The exam asks where a process breaks, not what a tool does — so keep asking yourself which step failed.","Asli mushkil workflow diagnosis hai. Exam poochta hai process kahan tootta hai, tool kya karta hai nahi — is liye khud se poochte rahein kaunsa step fail hua.","اصل مشکل ورک فلو تشخیص ہے۔ امتحان پوچھتا ہے عمل کہاں ٹوٹتا ہے — اس لیے خود سے پوچھتے رہیں کونسا مرحلہ ناکام ہوا۔"],
"pl.d3n":["Wed 7 Oct","Budh 7 Oct","بدھ ۷ اکتوبر"],
"pl.d3b":["Governance, then mock 1","Governance, phir mock 1","گورننس، پھر موک ۱"],
"pl.d3h":["≈ 5.5 h","≈ 5.5 ghante","≈ ۵.۵ گھنٹے"],
"pl.d3s":["Governance, Risk & Responsible Use + Code You Never Write + What AI Actually Is. Then take Mock Set 1 in the evening, timed, no notes. You want a baseline, not a good score.","Governance, Risk & Responsible Use + Code You Never Write + What AI Actually Is. Phir shaam ko Mock Set 1, timer ke saath, notes ke bina. Baseline chahiye, achha score nahi.","Governance + Code You Never Write + What AI Actually Is۔ پھر شام کو موک سیٹ ۱، ٹائم کے ساتھ، نوٹس کے بغیر۔ بنیاد چاہیے، اچھا اسکور نہیں۔"],
"pl.d3t":["Governance brings the most new vocabulary — affected parties, human-review thresholds, permissions. Give it the extra half hour rather than skimming it.","Governance mein sabse zyada nayi terminology hai — affected parties, human-review thresholds, permissions. Isay aadha ghanta zyada dein, sar-sari nazar se na guzrein.","گورننس میں سب سے زیادہ نئی اصطلاحات ہیں۔ اسے آدھا گھنٹہ زیادہ دیں۔"],
"pl.d4n":["Thu 8 Oct","Jumerat 8 Oct","جمعرات ۸ اکتوبر"],
"pl.d4b":["Last courses, then review","Aakhri courses, phir review","آخری کورس، پھر جائزہ"],
"pl.d4h":["≈ 5 h","≈ 5 ghante","≈ ۵ گھنٹے"],
"pl.d4s":["Claude & ChatGPT 101 + Skills & Connectors + General Agents on the Web. All ten courses are finished today. Then open the by-domain table from Mock 1 and write down your two weakest domains.","Claude & ChatGPT 101 + Skills & Connectors + General Agents on the Web. Aaj saare das courses khatam. Phir Mock 1 ka domain-wise table khol kar apne do sabse kamzor domains likh lein.","Claude & ChatGPT 101 + Skills & Connectors + General Agents on the Web۔ آج سارے دس کورس ختم۔ پھر موک ۱ کا ڈومین وار ٹیبل کھول کر دو کمزور ڈومین لکھ لیں۔"],
"pl.d4t":["These three are the fastest of the ten, and that is the trap — rushing them is how the tool-selection distinctions in D3 slip past you.","Ye teen das mein sabse tez hain, aur yahi trap hai — jaldi karna hi D3 ki tool-selection bariqiyan chhootne ki wajah banta hai.","یہ تینوں سب سے تیز ہیں، اور یہی خطرہ ہے — جلد بازی ہی D3 کی باریکیاں چھوٹنے کا سبب بنتی ہے۔"],
"pl.d5n":["Fri 9 Oct","Juma 9 Oct","جمعہ ۹ اکتوبر"],
"pl.d5b":["Weak domains, then mock 2","Kamzor domains, phir mock 2","کمزور ڈومین، پھر موک ۲"],
"pl.d5h":["≈ 5 h","≈ 5 ghante","≈ ۵ گھنٹے"],
"pl.d5s":["Morning: re-watch only your two weakest domains, nothing else. Afternoon: Mock Set 2 with the timer running, then read every explanation — including the ones you got right.","Subah: sirf apne do sabse kamzor domains dobara dekhein, aur kuch nahi. Dopahar: timer chala kar Mock Set 2, phir har explanation padhein — jo sahi hue un ki bhi.","صبح: صرف دو سب سے کمزور ڈومین دوبارہ دیکھیں۔ دوپہر: ٹائم کے ساتھ موک سیٹ ۲، پھر ہر وضاحت پڑھیں — صحیح والوں کی بھی۔"],
"pl.d5t":["The explanations are where the marks actually live. Answering correctly for the wrong reason is the most common way to lose the real paper.","Marks asal mein explanations mein hain. Ghalat wajah se sahi jawab dena asli paper haarne ka sabse aam tareeqa hai.","نمبر اصل میں وضاحتوں میں ہیں۔ غلط وجہ سے صحیح جواب دینا اصل پرچہ ہارنے کا عام طریقہ ہے۔"],
"pl.d6n":["Sat 10 Oct","Hafta 10 Oct","ہفتہ ۱۰ اکتوبر"],

{"d":"D1","q":"A marketing lead writes a single instruction: “Write something good about our new product.” The first output is unusable.","a":"Why is this result predictable?","o":["The model needs a larger context window to understand the product","No outcome, audience or constraint was stated — “good” is not a criterion anything can be judged against","The prompt is too short for the model to parse","The model is not capable of writing marketing copy"],"c":1,"w":["The delegation never defined what done looks like. Without an outcome and constraints there is nothing for the model to aim at, so the result can only ever be someone's unstated guess. A larger model or a longer prompt would not change that.","Delegation mein ye define hi nahi hua ke kaam mukammal kaisa lagega. Bina nateeje aur hadd ke model ke paas nishana hi nahi hota, to result sirf kisi ki unkahi tawaqqo hoti hai. Bara model ya lamba prompt isay theek nahi karega.","تفویض میں یہ طے ہی نہیں ہوا کہ کام مکمل کیسا لگے گا۔ نتیجے اور حد کے بغیر ماڈل کے پاس نشانہ ہی نہیں، تو نتیجہ صرف کسی کی ان کہی توقع ہوتا ہے۔ بڑا ماڈل اسے درست نہیں کرے گا۔"]},
{"d":"D2","q":"A coordinator drafts customer updates during a flood disruption. The draft states confidently that roads reopen on Friday and parcels arrive on Monday. No source is cited, and the coordinator is about to broadcast to 900 customers.","a":"What is the smallest sufficient next step?","o":["Build an automated feed that syncs road status every hour","Regenerate the message on a more capable model","Send it — the model is usually accurate about dates","Check the two dates against a live traffic and logistics source before sending"],"c":3,"w":["The planted flaw is a specific unsourced claim. The Smallest Sufficient Move is to verify that claim. Swapping models is Nervous, building an automated feed is Over-Reaction, and sending unverified specifics to 900 people is the Trusting Move — the one option guaranteed to cause harm.","Chhipi hui kharabi ek specific magar bina source wala dawa hai. Sabse chhota kaafi move wohi dawa verify karna hai. Model badalna Nervous hai, automated feed banana Over-Reaction hai, aur 900 logon ko bina verify bhejna Trusting Move — wohi ek option jo yaqeeni nuqsan dega.","چھپی خرابی ایک مخصوص مگر بے ماخذ دعویٰ ہے۔ سب سے چھوٹا کافی قدم وہی دعویٰ جانچنا ہے۔ ماڈل بدلنا گھبراہٹ ہے، خودکار نظام بنانا حد سے بڑا ردِعمل ہے، اور ۹۰۰ لوگوں کو بغیر تصدیق بھیجنا بھروسے والا قدم ہے۔"]},
{"d":"D3","q":"A finance department must extract line items from roughly 4,000 scanned invoices each week and reconcile them against a ledger every night.","a":"Which setup fits the requirement?","o":["Programmatic access with structured output, so each extraction can be validated and written to the ledger automatically","Assign temporary staff to key the invoices in","Choose a model with a larger context window","Paste the invoices into a chat window in batches by hand"],"c":0,"w":["The requirement is volume plus a machine-readable destination. That is a programmatic, structured-output task. Context size is irrelevant to the problem, and manual pasting or keying does not scale to 4,000 a week without becoming the bottleneck.","Requirement hai volume aur machine-readable destination. Ye programmatic, structured-output ka kaam hai. Context size is masle se mutaliq nahi, aur manual kaam hafte mein 4,000 tak scale nahi karta.","تقاضا ہے حجم اور مشین کے پڑھنے کے قابل نتیجہ۔ یہ پروگرام کے ذریعے، منظم آؤٹ پٹ کا کام ہے۔ سیاق کا حجم مسئلے سے متعلق نہیں۔"]},
{"d":"D4","q":"A support team's AI triage step routes tickets to the wrong queue about 30% of the time. The manager proposes rebuilding the entire intake system.","a":"What should be established first?","o":["Rebuild the intake system as proposed","Add a second AI to review the first","Replace the ticketing platform","Determine whether the misrouting comes from the routing rules or from the AI classification step"],"c":3,"w":["Rebuilding is the Over-Reaction — the heaviest possible response to a defect that has not been located yet. Adding a second AI compounds the same unknown. Diagnose which component is actually failing before changing any of them.","Poora system dobara banana Over-Reaction hai — kharabi dhoondne se pehle sabse bhaari jawab. Doosra AI lagana bhi wohi andha panch hai. Pehle pata karein kaunsa hissa fail ho raha hai.","پورا نظام دوبارہ بنانا حد سے بڑا ردِعمل ہے — خرابی ڈھونڈنے سے پہلے سب سے بھاری جواب۔ پہلے پتا کریں کون سا حصہ ناکام ہو رہا ہے۔"]},
{"d":"D5","q":"A team wants the agent to answer questions from their internal policy handbook and cite the section it used.","a":"What must be configured?","o":["A longer system prompt describing the handbook from memory","The handbook as a knowledge source the agent can retrieve and cite from","A model with a larger context window","A higher temperature setting"],"c":1,"w":["Citable answers require an actual retrievable source. Describing the handbook from memory produces answers that look grounded but point nowhere. Temperature and context size do not create a source.","Citable jawab ke liye asli retrievable source chahiye. Yaad se handbook describe karna aise jawab deta hai jo grounded lagte hain magar kisi jagah le jaate nahi. Temperature aur context size source nahi banate.","حوالہ کے قابل جواب کے لیے اصل قابلِ رسائی ماخذ چاہیے۔ یاد سے ہینڈ بک بیان کرنا ایسے جواب دیتا ہے جو بنیاد والے لگتے ہیں مگر کہیں لے نہیں جاتے۔"]},
{"d":"D2","q":"A finance analyst asks for a year-over-year variance. The model returns a confident percentage. The analyst never supplied the two underlying figures.","a":"How should this output be treated?","o":["It is reliable — percentages are simple arithmetic","It is unsupported: the figure cannot be derived from anything the analyst provided, so it must be recomputed from supplied data","The model simply needs a spreadsheet connector","The percentage should be rounded to reduce apparent precision"],"c":1,"w":["Nothing in the input could produce that number, so its fluency is the danger rather than a signal of quality. A figure with no derivable basis is a fabrication, and rounding it only disguises that.","Input mein aisi koi cheez nahi jo woh number de sake, is liye iski safai khatra hai, quality ki nishani nahi. Jiska koi banaya hua base na ho woh ghalat hai — round karne se sirf chhupta hai.","ان پٹ میں ایسی کوئی چیز نہیں جو وہ عدد دے سکے، اس لیے اس کی صفائی خطرہ ہے۔ جس کی کوئی بنیاد نہ ہو وہ غلط ہے — گول کرنا اسے چھپاتا ہے۔"]},
{"d":"D6","q":"An agent is asked to research three vendors and report their pricing and delivery windows.","a":"Which action falls inside the agent's authority?","o":["Placing purchase orders with the best-value vendor","Cancelling the incumbent supplier's contract","Gathering published prices and delivery windows","Signing the vendor agreement"],"c":2,"w":["Research and purchase are different verbs. Reading and reporting is permitted; committing the business to a third party is not. Ordering, signing and cancelling each bind the organisation to an obligation and all require a human.","Research aur purchase alag verbs hain. Padhna aur report karna allowed hai; business ko teesre fard se baandhna nahi. Order dena, sign karna aur cancel karna — teenon organisation ko zimmedari mein baandhte hain.","تحقیق اور خریداری الگ فعل ہیں۔ پڑھنا اور بتانا جائز ہے؛ کاروبار کو پابند کرنا نہیں۔ آرڈر، دستخط اور منسوخی — تینوں ادارے کو ذمہ داری میں باندھتے ہیں۔"]},
{"d":"D7","q":"A user has tried six times to make the model produce an export in a specific structure. Each attempt fails in a different way, and the exact structure exists only in the user's head.","a":"What is the correct move now?","o":["Enable extended thinking and retry","Rephrase the instruction once more with additional detail","Produce the export manually and stop iterating","Escalate to a larger model"],"c":2,"w":["This sits at the top of the diagnostic ladder: repeated failure after several prompts, on a requirement that has never been externalised. More prompting cannot supply knowledge only the user holds. Do it manually.","Ye diagnostic ladder ke sabse oopar hai: kai prompts ke baad bhi nakaam, aur requirement sirf user ke paas hai. Zyada prompting woh ilm nahi de sakti jo sirf user ke paas hai. Khud kar lein.","یہ تشخیصی سیڑھی کے اوپر ہے: کئی پرامپٹ کے بعد بھی ناکام، اور تقاضا صرف صارف کے پاس ہے۔ زیادہ پرامپٹ وہ علم نہیں دے سکتی۔"]},
{"d":"D1","q":"Two prompts are written for the same task. Prompt A states the audience, the required output format and two worked examples. Prompt B states the task in a single sentence.","a":"Which is more likely to produce usable output first time?","o":["Neither; the model tier decides the result on its own","Prompt B, provided a larger model runs it","Prompt B — shorter instructions leave less room for confusion","Prompt A — it defines the outcome and supplies reference material"],"c":3,"w":["Defining the outcome and supplying examples is the Define and Delegate half of the loop. Brevity is not a virtue when it leaves the success criteria unstated, and no model tier compensates for a criterion that was never given.","Nateeja define karna aur examples dena loop ka Define aur Delegate hissa hai. Ikhtisar us waqt faida nahi jab kamyabi ka mayaar bataya hi na gaya ho — koi model tier us kami ki bhar-pai nahi kar sakta.","نتیجہ واضح کرنا اور مثالیں دینا چکر کا پہلا حصہ ہے۔ اختصار فائدہ نہیں جب کامیابی کا معیار بتایا ہی نہ گیا ہو۔"]},
{"d":"D2","q":"A team uses AI to summarise customer interviews and publishes the summaries as research findings, with no one comparing them back to the recordings.","a":"What risk does this create?","o":["The interviews are too short to matter","The model will drift after several runs","None, provided the summaries read as faithful","There is no independent verification step, so any undetected error propagates outward as a published finding"],"c":3,"w":["Fluency is not fidelity. Without a step that checks the summary against the recording, the output becomes the record — and an error inside it becomes an error in the evidence base, where no one will look for it again.","Safai wafadari nahi hai. Recording se milane ka step na ho to output khud record ban jata hai — aur us mein chhipi galti evidence base ki galti ban jati hai, jahan koi dobara nahi dekhega.","صفائی وفاداری نہیں۔ ریکارڈنگ سے ملانے کا مرحلہ نہ ہو تو آؤٹ پٹ خود ریکارڈ بن جاتا ہے۔"]},
{"d":"D4","q":"A clinic plans to have AI draft patient follow-up notes, with a nurse reviewing each draft before it is filed to the patient record.","a":"Why is this design appropriate?","o":["It avoids the need for any governance policy","It makes the AI responsible for accuracy","It places human review at exactly the step where an error would enter the patient record","It removes human involvement from a routine task"],"c":2,"w":["The design is correct because the review point sits at the boundary where a mistake becomes irreversible. Removing the human would be the Trusting Move, and no automation transfers responsibility away from the organisation.","Design sahi hai kyunke review theek us hadd pe hai jahan galti na-badalne wali ban jati hai. Human hatana Trusting Move hai, aur koi automation zimmedari organisation se nahi le jati.","ڈیزائن درست ہے کیونکہ جائزہ ٹھیک اُس حد پر ہے جہاں غلطی ناقابلِ واپسی بن جاتی ہے۔"]},
{"d":"D6","q":"An agent has read access to a shared project folder. A task would be easier if it could also email an external supplier directly.","a":"What should happen?","o":["Let the agent send the email — it is a single message","Grant the agent permanent external email permission","Let the agent send it and log the action afterwards","The agent drafts the message and a human decides whether to send it"],"c":3,"w":["Draft and Send are different verbs. A sent email commits the organisation to an outside party and cannot be recalled. Logging after the fact records the harm rather than preventing it.","Draft aur Send alag verbs hain. Bheja gaya email organisation ko bahar wale se baandh deta hai aur wapas nahi aata. Baad mein log karna nuqsan ko rokta nahi, sirf likh deta hai.","مسودہ اور ارسال الگ فعل ہیں۔ بھیجا گیا ای میل واپس نہیں آتا۔ بعد میں درج کرنا نقصان روکتا نہیں۔"]},
{"d":"D3","q":"A developer must add a small feature to an unfamiliar codebase and wants the reasoning behind each change explained as it happens.","a":"Which setup fits best?","o":["A spreadsheet automation tool","The largest model available, run once, with no follow-up","A chat window with several files pasted in by hand","An agentic coding tool that can read the repository, make changes and explain them step by step"],"c":3,"w":["The task needs repository access and an interactive loop. A single large-model run cannot read the code it has not been given, and pasting files by hand loses the surrounding code that makes the change safe.","Kaam ke liye repository access aur interactive loop chahiye. Ek hi run us code ko nahi padh sakta jo diya hi na gaya, aur files haath se paste karne se aas-paas ka code chhut jata hai.","کام کے لیے ریپوزٹری تک رسائی اور متعامل چکر چاہیے۔ ایک ہی رن وہ کوڈ نہیں پڑھ سکتا جو دیا ہی نہ گیا۔"]},
{"d":"D2","q":"A report cites three industry statistics with hyperlinks. A reviewer opens each link and finds that none of the pages contains the stated figure.","a":"What has been established?","o":["The citations do not support the claims, so the statistics remain unverified","The statistics are sound because sources were provided","The report needs a model with a longer context window","The links should be removed and the statistics kept"],"c":0,"w":["A citation is not verification — checking the citation is verification. Here the check was performed and it failed, so the claims are unsupported. Deleting the link while keeping the number would hide that fact rather than fix it.","Citation verification nahi hai — citation check karna verification hai. Yahan check hua aur fail ho gaya, to dawе bina sahara hain. Link hata kar number rakhna sach chhupata hai, theek nahi karta.","حوالہ تصدیق نہیں — حوالہ جانچنا تصدیق ہے۔ یہاں جانچ ناکام ہوئی، تو دعوے بے سہارا ہیں۔"]},
{"d":"D5","q":"A team pastes the same twenty pages of brand guidelines into every new conversation.","a":"What is the better configuration?","o":["Continue pasting, since it works reliably","Condense the guidelines into a single sentence","Ask the model to remember them between sessions","Store the guidelines as a reusable knowledge source the agent retrieves from and cites"],"c":3,"w":["Repeated manual pasting is the manual version of a knowledge source. Storing it once makes the material consistent, citable and maintainable when the guidelines change. A model does not carry memory between separate sessions.","Baar baar paste karna knowledge source ka manual version hai. Ek dafa store karne se material consistent, citable aur update-able ban jata hai. Model sessions ke darmiyan yaad nahi rakhta.","بار بار پیسٹ کرنا علم کے ماخذ کا دستی روپ ہے۔ ایک بار محفوظ کرنے سے مواد مستقل اور قابلِ حوالہ رہتا ہے۔"]},
{"d":"D4","q":"A workflow handles ordinary records correctly but fails consistently on unusually long ones, timing out before it finishes.","a":"What most likely explains this?","o":["The workflow has no handling for inputs larger than the size it was designed around","The prompt is worded too politely","The output format is unspecified","The model has drifted since the workflow was built"],"c":0,"w":["The failure is input-dependent and reproducible, which points at an unhandled boundary rather than model behaviour. The workflow was designed around a size it never checked for, so the first oversized input becomes a failure with no path forward.","Failure input pe depend karta hai aur har baar hota hai — ye model ka masla nahi, ek unhandled hadd hai. Workflow ne size check hi nahi ki thi, to pehla bara input bina raaste ke fail ho jata hai.","ناکامی ان پٹ پر منحصر اور ہر بار ہے — یہ ماڈل کا مسئلہ نہیں، ایک نہ سنبھالی گئی حد ہے۔"]},
{"d":"D5","q":"A company wants the agent to apply its internal style guide whenever it writes customer emails.","a":"Where should this be applied?","o":["Typed from memory into each individual prompt","Stored as a reusable instruction or knowledge source applied consistently to every relevant task","Baked into the model's training data","Added to the customer's original email"],"c":1,"w":["A standard that lives in people's heads is applied inconsistently and drifts. Storing it once as configuration makes the same rule apply to every task and makes it reviewable when the standard changes.","Jo mayaar logon ke zehen mein rehta hai woh har baar badal jata hai. Ek dafa configuration mein rakhne se wohi rule har kaam pe lagta hai aur badlav pe review ho sakta hai.","جو معیار ذہن میں رہتا ہے وہ ہر بار بدل جاتا ہے۔ ایک بار ترتیب میں رکھنے سے وہی قاعدہ ہر کام پر لگتا ہے۔"]},
{"d":"D1","q":"A prompt gives the desired format and audience, but supplies no example of what a correct answer looks like.","a":"What is the most likely effect?","o":["The model will automatically ask for clarification","The format will be followed but the content may still miss the user's expectation, since no model of correct output was given","The model will refuse to answer","The output will be longer than necessary"],"c":1,"w":["Format is structure; an example is a model of judgement. Without one, the model satisfies the shape of the request while guessing at the standard, which is exactly the gap a worked example closes.","Format sirf dhaancha hai; example judgement ka namuna hai. Bina example ke model shakal poora kar deta hai magar mayaar andaza lagata hai — yahi khala example bharta hai.","فارمیٹ صرف ڈھانچہ ہے؛ مثال فیصلے کا نمونہ ہے۔ مثال کے بغیر ماڈل شکل پوری کرتا ہے مگر معیار کا اندازہ لگاتا ہے۔"]},
{"d":"D6","q":"An agent is asked to tidy a shared storage folder by deleting duplicated files.","a":"Where is the boundary problem?","o":["The agent needs unrestricted permission to be useful","Deletion destroys the audit trail, so the agent should flag duplicates for a human to remove","Reading the folder is itself the violation","Duplicates are always safe to remove without review"],"c":1,"w":["Inspect and Delete are different verbs. Identifying duplicates is analysis; removing them destroys records and may remove the only surviving copy. The agent can do the finding, but a human owns the irreversible step.","Inspect aur Delete alag verbs hain. Duplicates dhoondna analysis hai; mitaana records khatam karta hai aur mumkin hai wohi ek copy bachi ho. Dhoondna agent kar sakta hai, magar na-badalne wala step human ka hai.","معائنہ اور حذف الگ فعل ہیں۔ ڈھونڈنا تجزیہ ہے؛ مٹانا ریکارڈ ختم کرتا ہے۔"]},
{"d":"D1","q":"A workflow returns content of the right quality but in the wrong format on every single run.","a":"What should be changed?","o":["The model tier, since a better model would infer the format","The output format specification in the instructions","The context window size","The temperature setting, and nothing else"],"c":1,"w":["A consistent, content-correct failure in one dimension is a specification problem. The model already understands the task; it has never been told what shape the answer must take, so changing the tier or the temperature treats a symptom.","Ek hi pehlu mein har baar wohi galti specification ka masla hai. Model kaam samajhta hai; usay bataya hi nahi gaya ke jawab kis shakal mein chahiye.","ایک ہی پہلو میں ہر بار وہی غلطی تفصیل کا مسئلہ ہے۔ ماڈل کام سمجھتا ہے؛ اسے بتایا ہی نہیں گیا۔"]},
{"d":"D5","q":"A team repeatedly re-types a complex internal procedure into prompts, and the steps keep coming out slightly different each time.","a":"What is the underlying problem?","o":["The prompts are too long","The model is not capable of following procedures","The procedure exists only as improvisation, not as stored configuration, so it is re-invented on every use","The model requires a larger context window"],"c":2,"w":["Variation between runs is the signature of an unstated procedure. A skill or stored instruction fixes the sequence so every run follows the same steps, and makes an error in the procedure itself findable.","Runs ke darmiyan farq un-stated procedure ki nishani hai. Skill ya stored instruction sequence fix kar deta hai, aur procedure ki galti bhi pakdi ja sakti hai.","رنز کے درمیان فرق غیر متعین طریقہ کار کی نشانی ہے۔ اسکل ترتیب کو مقرر کر دیتا ہے۔"]},
{"d":"D6","q":"A manager asks which people or groups could be harmed if the AI screening model produces a wrong decision.","a":"What is this question an example of?","o":["Model latency optimisation","Prompt engineering technique","Identifying affected parties and the consequences of a wrong output","Context window sizing"],"c":2,"w":["Naming who is affected by an error is the first question of responsible use, and it precedes any decision about how much automation is acceptable. The other options are technical choices that cannot answer it.","Galti se kaun mutasir hoga — ye zimmedar istemal ka pehla sawal hai, aur ye har us faisle se pehle aata hai ke kitni automation theek hai.","غلطی سے کون متاثر ہوگا — یہ ذمہ دار استعمال کا پہلا سوال ہے، اور یہ ہر فیصلے سے پہلے آتا ہے۔"]},
{"d":"D7","q":"An AI drafting step produces accurate summaries, but they are consistently about half the requested length.","a":"How should this be diagnosed?","o":["The workflow needs a more capable model","The source documents are too short","The model is hallucinating content","The length constraint was stated but never enforced or checked at the output stage"],"c":3,"w":["The failure is uniform and predictable, which rules out hallucination. A constraint that is stated but never verified at the end of the workflow is exactly the kind of silent, repeatable defect that a validation check catches.","Galti ek jaisi aur predictable hai — ye hallucination nahi. Constraint likha gaya magar output pe check nahi hua — yehi khamoshi se dohraane wali galti hai jise validation pakadti hai.","غلطی یکساں اور متوقع ہے — یہ فریب نہیں۔ قاعدہ لکھا گیا مگر جانچا نہیں گیا۔"]},
{"d":"D2","q":"An AI-produced competitive analysis is fluent and internally consistent, but states two competitor revenue figures as fact with no citation.","a":"How should the figures be handled?","o":["Verify them against the competitors' published filings before any use","Round them to soften the apparent precision","Delete them and keep the rest of the analysis","Use them — they are specific and plausible"],"c":0,"w":["Specificity is not evidence, and plausible invented figures are more dangerous than obvious ones because nothing in the prose signals doubt. Verify against a primary record. Deleting them quietly is Choose without reporting.","Specific hona saboot nahi, aur plausible banaye hue numbers saaf ghalat se zyada khatarnak hain. Primary record se verify karein. Chupke se hata dena Choose without reporting hai.","مخصوص ہونا ثبوت نہیں۔ بنیادی ریکارڈ سے تصدیق کریں۔ خاموشی سے ہٹا دینا بغیر بتائے چھوڑنا ہے۔"]},
{"d":"D3","q":"A team must choose between a fast, inexpensive model and a slower reasoning model for a task that requires multi-step analysis with intermediate checks.","a":"Which fits the task?","o":["Both, chosen at random per request","Neither; the task must be done by hand","The reasoning model, because the task depends on multi-step analysis","The fast model, because turnaround speed matters most"],"c":2,"w":["Model selection follows task shape. Where the value comes from working through intermediate steps and checking them, a faster model that skips that work is a false economy. Matching capability to the task is the whole of this domain.","Model ka chunav kaam ki shakal dekhta hai. Jahan value beech ke steps sochne aur check karne se aati hai, wahan tez model asli sasta nahi, mehnga padta hai.","ماڈل کا انتخاب کام کی شکل دیکھتا ہے۔ جہاں قیمت درمیانی مراحل سے آتی ہے، وہاں تیز ماڈل سستا نہیں پڑتا۔"]},
{"d":"D6","q":"A team wants to reuse an agent already approved for one department's customer data on a new marketing analysis.","a":"What is required before the second use?","o":["Nothing — the approval already covers the organisation","The marketing team must use a different model","The new use, its data scope and its risks must be assessed in their own right","The agent must be rebuilt from scratch"],"c":2,"w":["Approval attaches to a stated purpose, not to a tool. A different purpose means different data, different affected parties and different harms, which is a fresh assessment. Rebuilding is unnecessary; skipping the assessment is not permitted.","Approval ek maqsad se juray hoti hai, tool se nahi. Naya maqsad matlab naya data, naye mutasir log aur naye khatre — naya jaiza. Dobara banana zaroori nahi, jaiza chhorna jaiz nahi.","منظوری مقصد سے جڑی ہوتی ہے، اوزار سے نہیں۔ نیا مقصد مطلب نیا جائزہ۔"]},
{"d":"D4","q":"A team automates a nightly report from three sources. Two update weekly; one updates once a year.","a":"What should the design account for?","o":["Treating all three sources as equally current","Running the report continuously instead","Different refresh cadences, so the workflow neither wastes work nor presents stale data as fresh","Removing the annually updated source"],"c":2,"w":["Data has a shelf life that differs by source. A workflow that refreshes everything at the same rate either wastes effort or, worse, presents year-old figures as if they were today's — an error the reader cannot see.","Har source ki data ki umar alag hai. Sab kuch ek hi rate pe refresh karna ya waqt zaya karta hai, ya saal purane numbers aaj ke bata deta hai — aur ye galti padhne wala dekh nahi sakta.","ہر ماخذ کے ڈیٹا کی عمر الگ ہے۔ سب کو ایک ہی رفتار سے تازہ کرنا وقت ضائع کرتا ہے یا پرانے اعداد آج کے بتاتا ہے۔"]},
{"d":"D2","q":"An AI-generated table has every figure correct, but a column heading that reverses what the column means.","a":"How should this be classified?","o":["A cosmetic issue, since the numbers are right","A material error — the heading changes the meaning of the figures, so it must be corrected before use","A formatting problem to be fixed later","An acceptable approximation"],"c":1,"w":["Correct data under a wrong heading is worse than wrong data, because it is trusted. The numbers will be read, quoted and acted on through the label, so the label is part of the claim rather than decoration.","Sahi data ghalat heading ke neeche ghalat data se zyada khatarnak hai, kyunke us pe bharosa kiya jata hai. Numbers usi label ke zariye padhe aur use honge, to label dawe ka hissa hai.","درست ڈیٹا غلط عنوان کے نیچے غلط ڈیٹا سے زیادہ خطرناک ہے، کیونکہ اسی عنوان سے پڑھا جاتا ہے۔"]},
{"d":"D7","q":"A team's agent performance dropped after they rewrote the system instructions.","a":"What is the most likely cause and the correct response?","o":["The output format is unspecified","The network connection is unstable","The model degraded overnight; switch models","The instruction change altered behaviour; review the change and revert it if it did not improve things"],"c":3,"w":["A change in output that follows a change in instructions is a cause, not a coincidence. Reverting is the Smallest Sufficient Move; replacing the model would discard a working setup to fix something the model never caused.","Instructions badalne ke baad output badla — ye wajah hai, ittefaq nahi. Wapas karna sabse chhota kaafi move hai; model badalna ek chalte hue setup ko be-wajah phenk dena hai.","ہدایات بدلنے کے بعد آؤٹ پٹ بدلا — یہ وجہ ہے، اتفاق نہیں۔"]},
{"d":"D3","q":"A company needs the same extraction task run 5,000 times a week, with each result written into a database.","a":"Which capability is required?","o":["Programmatic access with structured output that can be validated and stored automatically","A chat interface with manual copy and paste","A model with a larger context window","Voice input for faster operation"],"c":0,"w":["The volume and the destination both rule out human-mediated operation. Structured, machine-consumable output is what makes automated validation possible — without it the pipeline has no way to reject a bad result before it reaches the database.","Volume aur destination dono human ke zariye kaam ko namumkin karte hain. Structured output hi automated validation mumkin banata hai — warna pipeline database tak pohonchne se pehle ghalat result rok nahi sakti.","حجم اور منزل دونوں انسانی عمل کو ناممکن کرتے ہیں۔ منظم آؤٹ پٹ ہی خودکار جانچ ممکن بناتا ہے۔"]},
